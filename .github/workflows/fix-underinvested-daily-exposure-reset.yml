name: Verify Underinvested Daily Exposure Reset

on:
  push:
    branches:
      - feat/portfolio-weight-defined-exposure
    paths:
      - .github/workflows/fix-underinvested-daily-exposure-reset.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Patch non-100 percent daily exposure reset
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import textwrap

          ledger_path = Path('apps/api/app/portfolio/ledger.py')
          lines = ledger_path.read_text().splitlines()

          old_condition = '        and target_gross > 1.0 + WEIGHT_TOLERANCE'
          if lines.count(old_condition) != 1:
              raise SystemExit('expected old daily-reset condition exactly once')
          lines[lines.index(old_condition)] = (
              '        and abs(target_gross - 1.0) > WEIGHT_TOLERANCE'
          )

          debt_line = '        target_debt = target_gross + preserved_cash - net_equity'
          if lines.count(debt_line) != 1:
              raise SystemExit('expected gross-reset debt target exactly once')
          debt_index = lines.index(debt_line)
          expected_prefix = [
              '    def target_builder(net_equity: float) -> tuple[np.ndarray, float, float]:',
              '        target_gross = target_ratio * net_equity',
              '        target_assets = current_mix * target_gross',
          ]
          if lines[debt_index - 3:debt_index] != expected_prefix:
              raise SystemExit('unexpected gross-reset target builder shape')
          lines[debt_index:debt_index] = [
              '        if target_ratio < 1.0 - WEIGHT_TOLERANCE:',
              '            target_cash = max(net_equity - target_gross, 0.0)',
              '            return target_assets, 0.0, target_cash',
          ]

          threshold_start = '    if policy.target_gross_ratio < 1.0 - WEIGHT_TOLERANCE:'
          mix_line = '    current_mix = asset_values / gross'
          if lines.count(threshold_start) != 1:
              raise SystemExit('expected underinvested threshold branch exactly once')
          start = lines.index(threshold_start)
          try:
              end = lines.index(mix_line, start)
          except ValueError as exc:
              raise SystemExit('threshold current-mix line missing') from exc
          if end <= start:
              raise SystemExit('invalid threshold branch range')
          del lines[start:end]

          doc_old = '    residual cash; totals above 1.0 create financed gross exposure. Leveraged'
          if doc_old in lines:
              index = lines.index(doc_old)
              lines[index:index + 3] = [
                  '    residual cash; totals above 1.0 create financed gross exposure. Any',
                  '    non-100% gross exposure is reset at each close while preserving the',
                  '    current asset mix unless allocation rebalance independently fires.',
              ]

          ledger_path.write_text('\n'.join(lines) + '\n')

          test_path = Path('tests/test_portfolio_weight_defined_exposure.py')
          tests = test_path.read_text()

          new_cash_test = textwrap.dedent('''\
              def test_weight_below_100_percent_resets_total_exposure_each_close() -> None:
                  history = _history(
                      "AAA",
                      ["2024-01-02", "2024-01-03", "2024-01-04"],
                      [0.0, 0.10, 0.0],
                  )
                  ledger = simulate_portfolio_ledger(
                      PortfolioSpec.from_weights("80/20", {"AAA": 0.8}),
                      {"AAA": history},
                      SimulationConfig(initial_amount=100.0),
                  )

                  assert ledger.target_gross_exposure_ratio == pytest.approx(0.8)
                  assert ledger.target_cash_allocation == pytest.approx(0.2)
                  assert ledger.gross_exposure.iloc[0] == pytest.approx(80.0)
                  assert ledger.cash.iloc[0] == pytest.approx(20.0)
                  assert ledger.debt.iloc[0] == 0.0
                  assert ledger.equity.iloc[1] == pytest.approx(108.0)
                  assert ledger.gross_exposure.iloc[1] == pytest.approx(86.4)
                  assert ledger.cash.iloc[1] == pytest.approx(21.6)
                  assert ledger.debt.iloc[1] == pytest.approx(0.0)
                  assert ledger.gross_exposure_ratio.iloc[1] == pytest.approx(0.8)
                  assert ledger.gross_exposure_ratio.iloc[2] == pytest.approx(0.8)
                  assert ledger.leverage_reset_count == 1
                  assert any(event.type == "leverage_reset" for event in ledger.events)

          ''')
          pattern = r'def test_weight_below_100_percent_leaves_residual_cash_without_daily_reset\(\) -> None:\n.*?(?=def test_weight_defined_leverage_resets_gross_exposure_at_each_close)'
          tests, count = re.subn(pattern, new_cash_test, tests, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('expected old underinvested no-reset test exactly once')

          new_threshold_test = textwrap.dedent('''\
              def test_underinvested_gross_drift_does_not_trigger_asset_mix_threshold() -> None:
                  history = _history(
                      "AAA",
                      ["2024-01-02", "2024-01-03", "2024-01-04"],
                      [0.0, 0.25, 0.0],
                  )
                  ledger = simulate_portfolio_ledger(
                      PortfolioSpec.from_weights("80/20 threshold", {"AAA": 0.8}),
                      {"AAA": history},
                      SimulationConfig(
                          initial_amount=100.0,
                          rebalancing=RebalanceConfig(threshold_percent=3.0),
                      ),
                  )

                  assert ledger.rebalance_count == 0
                  assert ledger.leverage_reset_count == 1
                  assert ledger.equity.iloc[1] == pytest.approx(120.0)
                  assert ledger.gross_exposure.iloc[1] == pytest.approx(96.0)
                  assert ledger.cash.iloc[1] == pytest.approx(24.0)
                  assert ledger.gross_exposure_ratio.iloc[1] == pytest.approx(0.8)
                  assert any(event.type == "leverage_reset" for event in ledger.events)


              def test_underinvested_daily_reset_preserves_asset_mix_until_rebalance() -> None:
                  dates = ["2024-01-02", "2024-01-03", "2024-01-04"]
                  histories = {
                      "AAA": _history("AAA", dates, [0.0, 0.20, 0.0]),
                      "BBB": _history("BBB", dates, [0.0, 0.0, 0.0]),
                  }
                  portfolio = PortfolioSpec.from_weights(
                      "50 percent balanced",
                      {"AAA": 0.3, "BBB": 0.2},
                  )

                  reset_only = simulate_portfolio_ledger(
                      portfolio,
                      histories,
                      SimulationConfig(initial_amount=100.0),
                  )
                  assert reset_only.rebalance_count == 0
                  assert reset_only.leverage_reset_count >= 1
                  assert reset_only.gross_exposure_ratio.iloc[1] == pytest.approx(0.5)
                  assert reset_only.cash.iloc[1] == pytest.approx(53.0)
                  assert reset_only.allocation_history.iloc[1]["AAA"] == pytest.approx(36.0 / 56.0)
                  assert reset_only.allocation_history.iloc[1]["BBB"] == pytest.approx(20.0 / 56.0)

                  threshold_rebalanced = simulate_portfolio_ledger(
                      portfolio,
                      histories,
                      SimulationConfig(
                          initial_amount=100.0,
                          rebalancing=RebalanceConfig(threshold_percent=4.0),
                      ),
                  )
                  assert threshold_rebalanced.rebalance_count >= 1
                  assert threshold_rebalanced.allocation_history.iloc[1]["AAA"] == pytest.approx(0.6)
                  assert threshold_rebalanced.allocation_history.iloc[1]["BBB"] == pytest.approx(0.4)
                  assert threshold_rebalanced.gross_exposure_ratio.iloc[1] == pytest.approx(0.5)
                  assert any(
                      event.type == "rebalance" and event.details["trigger"] == "threshold"
                      for event in threshold_rebalanced.events
                  )

          ''')
          pattern = r'def test_underinvested_cash_is_part_of_threshold_allocation_semantics\(\) -> None:\n.*?(?=def test_leverage_reset_transaction_cost_is_charged_inside_ledger)'
          tests, count = re.subn(pattern, new_threshold_test, tests, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('expected old underinvested threshold test exactly once')
          test_path.write_text(tests)

          service_path = Path('tests/test_portfolio_api_service.py')
          service_tests = service_path.read_text()
          old = '    assert portfolio["leverage_reset_count"] == 0\n'
          new = (
              '    assert portfolio["leverage_reset_count"] > 0\n'
              '    for point in portfolio["series"][1:]:\n'
              '        if point["value"] and point["value"] > 0:\n'
              '            assert point["gross_exposure_ratio"] == pytest.approx(0.8, rel=1e-9)\n'
          )
          if service_tests.count(old) != 1:
              raise SystemExit('expected cash API reset-count assertion exactly once')
          service_path.write_text(service_tests.replace(old, new, 1))
          PY

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run focused and full Python regression
        run: |
          set -euo pipefail
          python -m compileall -q api apps scripts tests
          ruff check api apps scripts tests
          pytest -q tests/test_portfolio_weight_defined_exposure.py tests/test_portfolio_api_models.py tests/test_portfolio_api_service.py tests/test_portfolio_v3_api.py tests/test_portfolio_ledger.py tests/test_portfolio_ledger_compatibility.py
          python -m pytest -q

      - name: Commit only verified product changes and remove verifier
        run: |
          set -euo pipefail
          rm .github/workflows/fix-underinvested-daily-exposure-reset.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api/app/portfolio/ledger.py tests/test_portfolio_weight_defined_exposure.py tests/test_portfolio_api_service.py .github/workflows/fix-underinvested-daily-exposure-reset.yml
          git diff --cached --check
          git commit -m "fix: reset underinvested exposure at each close"
          git push origin HEAD:feat/portfolio-weight-defined-exposure
