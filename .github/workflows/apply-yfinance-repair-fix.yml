name: Apply yfinance repair fix

on:
  push:
    branches: [fix/yfinance-repair-dependency]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/yfinance-repair-dependency
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply dependency, version, documentation, and tests
        run: |
          python <<'PY'
          from pathlib import Path

          OLD_VERSION = "2026-07-31.1"
          NEW_VERSION = "2026-08-01.1"
          version_files = [
              "requirements.txt",
              "api/metrics.py",
              "public/scan-score-formulas.js",
              "docs/METRICS_REPRODUCIBILITY.md",
              "tests/e2e/metric_cache_invalidation.spec.mjs",
              "tests/e2e/scan_retry_termination.spec.mjs",
          ]
          for name in version_files:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if OLD_VERSION not in text:
                  raise SystemExit(f"{name}: old metric version not found")
              path.write_text(text.replace(OLD_VERSION, NEW_VERSION), encoding="utf-8")

          requirements = Path("requirements.txt")
          text = requirements.read_text(encoding="utf-8")
          anchor = "requests==2.32.5\nyfinance==1.2.1\n"
          replacement = "requests==2.32.5\nscipy==1.17.1\nyfinance==1.2.1\n"
          if text.count(anchor) != 1:
              raise SystemExit("requirements dependency anchor mismatch")
          requirements.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

          metrics = Path("api/metrics.py")
          text = metrics.read_text(encoding="utf-8")
          anchor = '        "pandas_version": package_version("pandas"),\n'
          replacement = anchor + '        "scipy_version": package_version("scipy"),\n'
          if text.count(anchor) != 1:
              raise SystemExit("metrics scipy metadata anchor mismatch")
          metrics.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

          docs = Path("docs/METRICS_REPRODUCIBILITY.md")
          text = docs.read_text(encoding="utf-8")
          anchor = "`requirements.txt` 精確鎖定 NumPy、pandas 與 yfinance 版本。"
          replacement = (
              "`requirements.txt` 精確鎖定 NumPy、pandas、SciPy 與 yfinance 版本。"
              "由於 `repair=true` 會使用 yfinance 的價格修復功能，SciPy 是正式環境的必要依賴，"
              "不得只在開發環境安裝。"
          )
          if text.count(anchor) != 1:
              raise SystemExit("documentation dependency anchor mismatch")
          text = text.replace(anchor, replacement, 1)
          text = text.replace(
              "- `pandas_version`\n",
              "- `pandas_version`\n- `scipy_version`\n",
              1,
          )
          docs.write_text(text, encoding="utf-8")

          deployment = Path("tests/test_deployment_contract.py")
          text = deployment.read_text(encoding="utf-8")
          if not text.startswith("import json\n"):
              raise SystemExit("deployment test import anchor mismatch")
          text = "import importlib.util\n" + text
          text = text.replace(
              '    assert "yfinance==1.2.1" in package_lines\n',
              '    assert "scipy==1.17.1" in package_lines\n'
              '    assert "yfinance==1.2.1" in package_lines\n\n\n'
              'def test_yfinance_price_repair_dependency_is_installed():\n'
              '    assert DATA_SOURCE_SETTINGS["repair"] is True\n'
              '    assert importlib.util.find_spec("scipy") is not None\n',
              1,
          )
          deployment.write_text(text, encoding="utf-8")

          metrics_test = Path("tests/test_metrics_core.py")
          text = metrics_test.read_text(encoding="utf-8")
          text = text.replace(
              "    calculate_metrics,\n    series_fingerprint,\n",
              "    calculate_metrics,\n    reproducibility_metadata,\n    series_fingerprint,\n",
              1,
          )
          text += '''\n\ndef test_reproducibility_metadata_includes_price_repair_runtime():
              metadata = reproducibility_metadata(risk_free_rate=0.0, benchmark="SPY")
              assert metadata["data_source_settings"]["repair"] is True
              assert metadata["scipy_version"] == "1.17.1"
          '''
          metrics_test.write_text(text, encoding="utf-8")

          Path(".github/workflows/apply-yfinance-repair-fix.yml").unlink()
          PY
      - name: Commit repair dependency fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install SciPy required by yfinance price repair"
          git push origin HEAD:fix/yfinance-repair-dependency
