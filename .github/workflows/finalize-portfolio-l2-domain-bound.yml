name: Finalize Portfolio L2 Domain Bound

on:
  push:
    branches:
      - feat/portfolio-weight-defined-exposure
    paths:
      - .github/workflows/finalize-portfolio-l2-domain-bound.yml

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Ensure API upper bound derives from Portfolio domain authority
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/api/app/portfolio/api_models.py')
          text = path.read_text()

          if '    MAX_TARGET_GROSS_EXPOSURE,\n' not in text:
              anchor = '    LeverageType,\n    PortfolioSpec,\n'
              if text.count(anchor) != 1:
                  raise SystemExit('Portfolio domain import anchor missing')
              text = text.replace(
                  anchor,
                  '    LeverageType,\n    MAX_TARGET_GROSS_EXPOSURE,\n    PortfolioSpec,\n',
                  1,
              )

          if 'weight: float = Field(gt=0.0, le=500.0)' in text:
              text = text.replace(
                  '    weight: float = Field(gt=0.0, le=500.0)',
                  '    weight: float = Field(\n'
                  '        gt=0.0, le=MAX_TARGET_GROSS_EXPOSURE * 100.0\n'
                  '    )',
                  1,
              )

          old_total = '''        total = sum(asset.weight for asset in self.assets)
          if total > 500.0:
              raise ValueError(
                  "portfolio target gross exposure cannot exceed 500%, "
                  f"received {total:.4f}%"
              )
          '''.replace('          ', '')
          if old_total in text:
              new_total = '''        total = sum(asset.weight for asset in self.assets)
          max_total = (MAX_TARGET_GROSS_EXPOSURE + WEIGHT_TOLERANCE) * 100.0
          if total > max_total:
              raise ValueError(
                  "portfolio target gross exposure cannot exceed "
                  f"{MAX_TARGET_GROSS_EXPOSURE * 100.0:g}%, received {total:.4f}%"
              )
          '''.replace('          ', '')
              text = text.replace(old_total, new_total, 1)

          required = (
              'MAX_TARGET_GROSS_EXPOSURE * 100.0',
              '(MAX_TARGET_GROSS_EXPOSURE + WEIGHT_TOLERANCE) * 100.0',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'domain-derived API bound incomplete: {missing}')
          if 'le=500.0' in text or 'if total > 500.0:' in text:
              raise SystemExit('hard-coded 500% authority still present')

          path.write_text(text)
          PY

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run L2 targeted and full Python regression
        run: |
          set -euo pipefail
          python -m compileall -q api apps scripts tests
          ruff check api apps scripts tests
          pytest -q tests/test_portfolio_api_models.py tests/test_portfolio_api_service.py tests/test_portfolio_v3_api.py
          python -m pytest -q

      - name: Commit only verified authority repair and remove verifier
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-portfolio-l2-domain-bound.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api/app/portfolio/api_models.py .github/workflows/finalize-portfolio-l2-domain-bound.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No persistent product diff required."
            exit 0
          fi
          git commit -m "fix: derive Portfolio API exposure bound from domain"
          git push origin HEAD:feat/portfolio-weight-defined-exposure
