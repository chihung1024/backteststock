name: Internal Research Library UX Integrate

on:
  push:
    branches:
      - internal-4a7-research-memory
    paths:
      - ".github/workflows/internal-4a7b-research-library-ui.yml"

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: internal-4a7-research-memory
          fetch-depth: 0
      - name: Integrate Research Library into Walk-Forward workspace
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/portfolio-web/src/WalkForwardWorkspace.tsx")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {text.count(old)}")
              text = text.replace(old, new, 1)

          replace_once(
              'import { WalkForwardResults } from "./WalkForwardResults";',
              'import { ResearchLibraryPanel } from "./ResearchLibraryPanel";\nimport { WalkForwardResults } from "./WalkForwardResults";',
              "results import",
          )
          replace_once('  canRemove,\n  onChange,', '  canRemove,\n  disabled,\n  onChange,', "PeriodEditor destructure")
          replace_once('  canRemove: boolean;\n  onChange:', '  canRemove: boolean;\n  disabled: boolean;\n  onChange:', "PeriodEditor type")
          replace_once('disabled={!canRemove}', 'disabled={disabled || !canRemove}', "remove disable")
          replace_once(
              '          maxLength={80}\n          onChange=',
              '          maxLength={80}\n          disabled={disabled}\n          onChange=',
              "period id disable",
          )
          if text.count('<input type="date" aria-label=') != 5:
              raise SystemExit("expected five date inputs")
          text = text.replace('<input type="date" aria-label=', '<input type="date" disabled={disabled} aria-label=')

          replace_once(
              'export function WalkForwardWorkspace() {',
              'export function WalkForwardWorkspace({ onBusyChange }: { onBusyChange?: (busy: boolean) => void }) {',
              "workspace signature",
          )
          replace_once(
              '  const [busy, setBusy] = useState(false);\n',
              '  const [busy, setBusy] = useState(false);\n  const [libraryBusy, setLibraryBusy] = useState(false);\n',
              "library busy state",
          )
          replace_once(
              '  const latestComplete = latestCompleteUtcDate();\n',
              '  const latestComplete = latestCompleteUtcDate();\n  const workspaceBusy = busy || libraryBusy;\n',
              "workspace busy",
          )
          replace_once(
              '  useEffect(() => () => activeController.current?.abort(), []);\n',
              '  useEffect(() => () => activeController.current?.abort(), []);\n\n  useEffect(() => {\n    onBusyChange?.(workspaceBusy);\n    return () => onBusyChange?.(false);\n  }, [onBusyChange, workspaceBusy]);\n',
              "busy propagation",
          )

          text = text.replace('disabled={busy ||', 'disabled={workspaceBusy ||')
          text = text.replace('disabled={busy}', 'disabled={workspaceBusy}')
          replace_once(
              'className={busy ? "wf-period-list busy" : "wf-period-list"}',
              'className={workspaceBusy ? "wf-period-list busy" : "wf-period-list"}',
              "period busy class",
          )
          replace_once(
              'canRemove={!busy && model.periods.length > 1}',
              'canRemove={model.periods.length > 1}\n              disabled={workspaceBusy}',
              "PeriodEditor busy prop",
          )

          return_anchor = '\n\n  return (\n'
          return_index = text.find(return_anchor)
          if return_index < 0:
              raise SystemExit("workspace return anchor not found")
          helpers = '''

          function setResearchLibraryBusy(nextBusy: boolean) {
            setLibraryBusy(nextBusy);
            if (!nextBusy) return;
            requestVersion.current += 1;
            activeController.current?.abort();
            activeController.current = null;
            setBusy(false);
            setResult(null);
            setError("");
            setMessage("");
          }

          function showResearchLibraryResult(nextResult: WalkForwardResultResponse, nextMessage: string) {
            setResult(nextResult);
            setError("");
            setMessage(nextMessage);
            window.requestAnimationFrame(() => resultRef.current?.scrollIntoView({ behavior: "smooth", block: "start" }));
          }
          '''
          text = text[:return_index] + helpers + text[return_index:]

          replace_once(
              '      <div ref={resultRef}>{result && <WalkForwardResults result={result} />}</div>\n',
              '      <ResearchLibraryPanel\n        request={request}\n        disabled={workspaceBusy}\n        onBusyChange={setResearchLibraryBusy}\n        onResult={showResearchLibraryResult}\n      />\n\n      <div ref={resultRef}>{result && <WalkForwardResults result={result} />}</div>\n',
              "library panel",
          )
          path.write_text(text, encoding="utf-8")

          wrapper = Path("apps/portfolio-web/src/WalkForwardAdmissionWorkspace.tsx")
          wrapper_text = wrapper.read_text(encoding="utf-8")
          pairs = [
              (
                  '  const [revision, setRevision] = useState(0);\n',
                  '  const [revision, setRevision] = useState(0);\n  const [workspaceBusy, setWorkspaceBusy] = useState(false);\n',
              ),
              (
                  '  function applyRecommended() {\n    if (!admission || !persistRecommended(admission)) return;',
                  '  function applyRecommended() {\n    if (workspaceBusy || !admission || !persistRecommended(admission)) return;',
              ),
              (
                  'disabled={!admission.recommended} onClick={applyRecommended}',
                  'disabled={workspaceBusy || !admission.recommended} onClick={applyRecommended}',
              ),
              (
                  '<WalkForwardWorkspace key={revision} />',
                  '<WalkForwardWorkspace key={revision} onBusyChange={setWorkspaceBusy} />',
              ),
          ]
          for old, new in pairs:
              if wrapper_text.count(old) != 1:
                  raise SystemExit(f"wrapper anchor mismatch: {old[:40]}")
              wrapper_text = wrapper_text.replace(old, new, 1)
          wrapper.write_text(wrapper_text, encoding="utf-8")
          PY
      - name: Commit integration and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/portfolio-web/src/WalkForwardWorkspace.tsx apps/portfolio-web/src/WalkForwardAdmissionWorkspace.tsx
          git rm -- .github/workflows/internal-4a7b-research-library-ui.yml
          git commit -m "feat: integrate durable Research Library UX"
          git push origin HEAD:internal-4a7-research-memory
