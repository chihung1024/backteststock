name: Apply optimizer verification allocation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'feature/portfolio-optimizer-mvp' && contains(github.event.pull_request.title, '最佳化器') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/portfolio-optimizer-mvp
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply exact verification allocation
        run: python scripts/apply_optimizer_verification_allocation.py
      - name: Commit exact allocation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guarantee optimizer exact verification allocation"
          git push origin HEAD:feature/portfolio-optimizer-mvp
