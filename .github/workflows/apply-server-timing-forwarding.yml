name: Apply Server-Timing forwarding fix

on:
  push:
    branches: [fix/server-timing-forwarding]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/server-timing-forwarding
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Forward backend timing through a stable application header
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "worker/index.js",
              '''    const responseHeaders = new Headers(response.headers);
              responseHeaders.delete("server");''',
              '''    const responseHeaders = new Headers(response.headers);
              const backendServerTiming = response.headers.get("server-timing");
              if (backendServerTiming) {
                // Cloudflare may omit Server-Timing from a proxied subrequest.
                // Keep the standards-based header and mirror it to an application
                // header that is stable across the edge proxy boundary.
                responseHeaders.set("server-timing", backendServerTiming);
                responseHeaders.set("x-backend-server-timing", backendServerTiming);
              }
              responseHeaders.delete("server");''',
              "worker timing header forwarding",
          )

          replace_once(
              "public/scan-output-ui.js",
              '        serverTiming: response.headers.get("server-timing"),',
              '''        serverTiming:
                  response.headers.get("server-timing")
                  || response.headers.get("x-backend-server-timing")
                  || "",''',
              "output module timing fallback",
          )

          replace_once(
              "public/app.js",
              '          serverTiming: response.headers.get("server-timing") || "",',
              '''          serverTiming:
                    response.headers.get("server-timing")
                    || response.headers.get("x-backend-server-timing")
                    || "",''',
              "app timing fallback",
          )

          index_path = Path("public/index.html")
          index = index_path.read_text(encoding="utf-8")
          for asset in ("app.js", "scan-output-ui.js"):
              old = f'src="/{asset}?v=20260801.2"'
              new = f'src="/{asset}?v=20260801.3"'
              if index.count(old) != 1:
                  raise SystemExit(f"index version anchor missing for {asset}")
              index = index.replace(old, new, 1)
          index_path.write_text(index, encoding="utf-8")

          test_path = Path("tests/test_worker.mjs")
          test = test_path.read_text(encoding="utf-8")
          test += r'''

          test("proxy mirrors backend Server-Timing to a stable edge header", async () => {
            const originalFetch = globalThis.fetch;
            globalThis.fetch = async () => new Response(
              JSON.stringify([{ ticker: "AAPL", status: "ok" }]),
              {
                status: 200,
                headers: {
                  "content-type": "application/json",
                  "server-timing": "market;dur=1250.0, compute;dur=220.0, total;dur=1500.0",
                  "x-scan-requested": "1",
                  "x-scan-resolved": "1",
                },
              },
            );

            try {
              const response = await worker.fetch(
                new Request("https://example.com/api/scan", {
                  method: "POST",
                  headers: { "content-type": "application/json" },
                  body: JSON.stringify({ tickers: ["AAPL"] }),
                }),
                { BACKEND_ORIGIN: "https://backend.example.com" },
              );
              const expected = "market;dur=1250.0, compute;dur=220.0, total;dur=1500.0";
              assert.equal(response.status, 200);
              assert.equal(response.headers.get("server-timing"), expected);
              assert.equal(response.headers.get("x-backend-server-timing"), expected);
              assert.equal(response.headers.get("x-scan-requested"), "1");
              assert.equal(response.headers.get("x-scan-resolved"), "1");
            } finally {
              globalThis.fetch = originalFetch;
            }
          });
          '''
          test_path.write_text(test, encoding="utf-8")

          e2e_path = Path("tests/e2e/scan_output_readability.spec.mjs")
          e2e = e2e_path.read_text(encoding="utf-8")
          old = '      "server-timing": "market;dur=1250.0, compute;dur=220.0, total;dur=1500.0",'
          new = '      "x-backend-server-timing": "market;dur=1250.0, compute;dur=220.0, total;dur=1500.0",'
          if e2e.count(old) != 1:
              raise SystemExit(f"E2E timing header anchor count={e2e.count(old)}")
          e2e_path.write_text(e2e.replace(old, new, 1), encoding="utf-8")

          Path(".github/workflows/apply-server-timing-forwarding.yml").unlink()
          PY
      - name: Commit timing forwarding fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Forward scan phase timing through Cloudflare"
          git push origin HEAD:fix/server-timing-forwarding
