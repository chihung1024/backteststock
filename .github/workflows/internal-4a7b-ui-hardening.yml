name: Internal Research Library UI Hardening

on:
  push:
    branches:
      - internal-4a7-research-memory
    paths:
      - ".github/workflows/internal-4a7b-ui-hardening.yml"

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: internal-4a7-research-memory
      - name: Harden busy propagation and library action serialization
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace = Path("apps/portfolio-web/src/WalkForwardWorkspace.tsx")
          text = workspace.read_text(encoding="utf-8")
          old = '    onBusyChange?.(workspaceBusy);\n    return () => onBusyChange?.(false);\n  }, [onBusyChange, workspaceBusy]);'
          new = '    onBusyChange?.(workspaceBusy);\n  }, [onBusyChange, workspaceBusy]);\n\n  useEffect(() => () => onBusyChange?.(false), [onBusyChange]);'
          if text.count(old) != 1:
              raise SystemExit(f"busy propagation anchor count={text.count(old)}")
          workspace.write_text(text.replace(old, new, 1), encoding="utf-8")

          panel = Path("apps/portfolio-web/src/ResearchLibraryPanel.tsx")
          panel_text = panel.read_text(encoding="utf-8")
          replacements = [
              ('if (!request || disabled) return;', 'if (!request || disabled || action) return;'),
              ('if (!capability || disabled) return;', 'if (!capability || disabled || action) return;'),
              ('disabled={disabled || workspaceAction || !request || health !== "online"}', 'disabled={disabled || Boolean(action) || !request || health !== "online"}'),
              ('disabled={workspaceAction} onClick={forgetDeviceCredential}', 'disabled={Boolean(action)} onClick={forgetDeviceCredential}'),
              ('disabled={disabled || workspaceAction} onClick={() => void openRun(run)}', 'disabled={disabled || Boolean(action)} onClick={() => void openRun(run)}'),
              ('disabled={disabled || workspaceAction} onClick={() => void rerun(run)}', 'disabled={disabled || Boolean(action)} onClick={() => void rerun(run)}'),
          ]
          for old, new in replacements:
              count = panel_text.count(old)
              if count < 1:
                  raise SystemExit(f"panel anchor not found: {old[:55]}")
              panel_text = panel_text.replace(old, new)
          panel.write_text(panel_text, encoding="utf-8")
          PY
      - name: Commit hardening and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/portfolio-web/src/WalkForwardWorkspace.tsx apps/portfolio-web/src/ResearchLibraryPanel.tsx
          git rm -- .github/workflows/internal-4a7b-ui-hardening.yml
          git commit -m "fix: serialize Research Library workspace actions"
          git push origin HEAD:internal-4a7-research-memory
