name: Internal 4A-7 D1 Row Bound

on:
  push:
    branches:
      - internal-4a7-d1-row-bound
    paths:
      - ".github/workflows/internal-4a7-d1-row-bound.yml"

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Align ResearchRun persistence bound with D1 row limit
        run: |
          python - <<'PY'
          from pathlib import Path

          worker = Path('worker/research_runs.js')
          text = worker.read_text(encoding='utf-8')
          before = '''const CREATE_REQUEST_MAX_BYTES = 160 * 1024;\nconst STORED_RESULT_MAX_BYTES = 4 * 1024 * 1024;'''
          after = '''const CREATE_REQUEST_MAX_BYTES = 160 * 1024;\n// D1 currently caps an individual string/BLOB or complete table row at 2,000,000 bytes.\n// Keep the completed result below that platform ceiling after reserving the full request budget\n// plus conservative space for identifiers, hashes, names, timestamps and row encoding overhead.\nconst D1_MAX_ROW_BYTES = 2_000_000;\nconst D1_ROW_SAFETY_RESERVE_BYTES = 64 * 1024;\nconst STORED_RESULT_MAX_BYTES = D1_MAX_ROW_BYTES - CREATE_REQUEST_MAX_BYTES - D1_ROW_SAFETY_RESERVE_BYTES;'''
          if text.count(before) != 1:
              raise SystemExit('ResearchRun size-bound anchor mismatch')
          worker.write_text(text.replace(before, after, 1), encoding='utf-8')

          tests = Path('tests/test_research_run_memory.mjs')
          text = tests.read_text(encoding='utf-8')
          marker = 'test("completed result larger than the safe D1 row budget fails before persistence"'
          if marker not in text:
              anchor = 'test("browser cannot submit completed result evidence for persistence", async () => {'
              insert = '''test("completed result larger than the safe D1 row budget fails before persistence", async () => {\n  const db = new FakeD1();\n  await withBackend(async (backendRequest) => {\n    const body = await backendRequest.json();\n    return Response.json({\n      ...successfulResult(body),\n      padding: "x".repeat(1_850_000),\n    });\n  }, async () => {\n    const response = await router.fetch(\n      new Request("https://edge.example/api/v1/research/runs", {\n        method: "POST",\n        headers: { "content-type": "application/json" },\n        body: JSON.stringify({ name: "Too large for one D1 row", request: sampleRequest() }),\n      }),\n      { DB: db, BACKEND_ORIGIN: "https://backend.example" },\n      {},\n    );\n    assert.equal(response.status, 413);\n    const payload = await response.json();\n    assert.match(payload.error, /超過 ResearchRun V1 可保存大小/u);\n  });\n  assert.equal(db.libraries.size, 0);\n  assert.equal(db.runs.size, 0);\n});\n\n'''
              if text.count(anchor) != 1:
                  raise SystemExit('test insertion anchor mismatch')
              text = text.replace(anchor, insert + anchor, 1)
              tests.write_text(text, encoding='utf-8')

          doc = Path('docs/research/RESEARCH_RUN_MEMORY_V1.md')
          text = doc.read_text(encoding='utf-8')
          before = '- the completed result exceeds the V1 persistence payload bound;'
          after = '- the completed result exceeds the V1 persistence payload bound, which is conservatively below D1\'s 2,000,000-byte row/string ceiling after reserving the full request budget and row metadata;'
          if text.count(before) != 1:
              raise SystemExit('contract size-bound anchor mismatch')
          doc.write_text(text.replace(before, after, 1), encoding='utf-8')

          handoff = Path('to_do_update_list.md')
          text = handoff.read_text(encoding='utf-8')
          before = '4. Concurrent internal writers advanced one branch during verification. Unknown-changes protection rejected the stale push; no force/reset occurred. Final candidate verification was isolated.\n'
          after = before + '5. Exact-PR self-review found the initial 4 MiB result guard exceeded Cloudflare D1\'s 2,000,000-byte string/row limit. Root fix budgets the full request plus a 64 KiB row reserve and rejects oversized completed evidence with 413 before any D1 write.\n'
          if text.count(before) != 1:
              raise SystemExit('handoff root-cause anchor mismatch')
          handoff.write_text(text.replace(before, after, 1), encoding='utf-8')
          PY

      - run: npm ci

      - name: Verify ResearchRun authority regression
        run: |
          npm run check
          npm run test:worker
          git diff --check

      - name: Verify Cloudflare bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-d1-row-bound

      - name: Commit verified blocker fix and self-remove
        run: |
          git fetch origin internal-4a7-d1-row-bound
          test "$(git rev-parse origin/internal-4a7-d1-row-bound)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- worker/research_runs.js tests/test_research_run_memory.mjs docs/research/RESEARCH_RUN_MEMORY_V1.md to_do_update_list.md
          git rm -- .github/workflows/internal-4a7-d1-row-bound.yml
          git commit -m "fix: align ResearchRun size bound with D1"
          git push origin HEAD:internal-4a7-d1-row-bound
