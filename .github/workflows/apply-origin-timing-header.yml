name: Apply origin timing header fix

on:
  push:
    branches: [fix/origin-timing-header]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/origin-timing-header
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Emit stable timing header at the Vercel origin
        run: |
          python <<'PY'
          from pathlib import Path

          scan_path = Path("api/scan_v2.py")
          scan = scan_path.read_text(encoding="utf-8")
          old = '''        response.headers["Server-Timing"] = ", ".join(
              [
                  f"market;dur={market_duration_ms:.1f}",
                  f"compute;dur={compute_duration_ms:.1f}",
                  f"serialize;dur={serialize_duration_ms:.1f}",
                  f"total;dur={total_duration_ms:.1f}",
              ]
          )'''
          new = '''        timing_header = ", ".join(
              [
                  f"market;dur={market_duration_ms:.1f}",
                  f"compute;dur={compute_duration_ms:.1f}",
                  f"serialize;dur={serialize_duration_ms:.1f}",
                  f"total;dur={total_duration_ms:.1f}",
              ]
          )
          response.headers["Server-Timing"] = timing_header
          # Cloudflare can hide Server-Timing from a Worker subrequest. Emit a
          # normal application header at the origin so the edge can forward it.
          response.headers["X-Backend-Server-Timing"] = timing_header'''
          if scan.count(old) != 1:
              raise SystemExit(f"scan timing block count={scan.count(old)}")
          scan_path.write_text(scan.replace(old, new, 1), encoding="utf-8")

          test_path = Path("tests/test_production_runtime.py")
          test = test_path.read_text(encoding="utf-8")
          old_assert = '''    assert "market;dur=" in response.headers["Server-Timing"]
              assert response.headers["X-Scan-Requested"] == "1"'''
          new_assert = '''    assert "market;dur=" in response.headers["Server-Timing"]
              assert response.headers["X-Backend-Server-Timing"] == response.headers["Server-Timing"]
              assert response.headers["X-Scan-Requested"] == "1"'''
          if test.count(old_assert) != 1:
              raise SystemExit(f"runtime timing assertion count={test.count(old_assert)}")
          test_path.write_text(test.replace(old_assert, new_assert, 1), encoding="utf-8")

          worker_path = Path("tests/test_worker.mjs")
          worker = worker_path.read_text(encoding="utf-8")
          old_headers = '''              "server-timing": "market;dur=1250.0, compute;dur=220.0, total;dur=1500.0",
                  "x-scan-requested": "1",'''
          new_headers = '''              "server-timing": "market;dur=1250.0, compute;dur=220.0, total;dur=1500.0",
                  "x-backend-server-timing": "market;dur=1250.0, compute;dur=220.0, total;dur=1500.0",
                  "x-scan-requested": "1",'''
          if worker.count(old_headers) != 1:
              raise SystemExit(f"worker timing fixture count={worker.count(old_headers)}")
          worker_path.write_text(worker.replace(old_headers, new_headers, 1), encoding="utf-8")

          Path(".github/workflows/apply-origin-timing-header.yml").unlink()
          PY
      - name: Commit origin timing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Emit stable scan timing header from Vercel origin"
          git push origin HEAD:fix/origin-timing-header
