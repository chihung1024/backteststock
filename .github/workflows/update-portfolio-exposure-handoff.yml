name: Update Portfolio Exposure Handoff

on:
  push:
    branches:
      - feat/portfolio-weight-defined-exposure
    paths:
      - .github/workflows/update-portfolio-exposure-handoff.yml

permissions:
  contents: write

jobs:
  update-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Patch current handoff without touching historical appendix
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('to_do_update_list.md')
          text = path.read_text()
          marker = '\n---\n\n# Historical Execution Record — Batch 4A-5\n'
          if text.count(marker) != 1:
              raise SystemExit('historical appendix marker missing or duplicated')
          prefix, appendix = text.split(marker, 1)

          replacements = [
              (
                  'Status: **DONE / exact-head CI + Vercel preview verified at `3b4d7fea90bb2298d89f62f9a0d4fe0c886cb9cc`**.',
                  'Status: **DONE foundation / original exact-head CI + Vercel preview verified at `3b4d7fea90bb2298d89f62f9a0d4fe0c886cb9cc`; narrowly reopened and corrected during L2 after the user clarified underinvested daily-reset semantics.**',
              ),
              (
                  'Final L1 exact-head CI #834 and Vercel preview both succeeded.\n',
                  'Final L1 exact-head CI #834 and Vercel preview both succeeded.\n\nDuring L2 product review, the user clarified that a 50% Portfolio must also reset total exposure to 50% at every close, not merely start with 50% cash. This reopened one narrow L1 policy edge. Evidence showed `_exposure_policy()` only assigned `daily_reset_ratio` above 100%, so underinvested Portfolios drifted after inception. Root-cause repair now assigns the daily reset to every non-100% weight-defined exposure (excluding legacy fixed-debt), solves underinvested target cash from post-cost equity with zero debt, and lets allocation thresholds inspect normalized internal asset mix only. The correction passed focused plus full Python regression before atomic publish at product head `6849140495ed4eef8dfaafec0fa265f1659bbff9`.\n\nBecause the same reset now applies to both cash and leveraged Portfolios, the unreleased public/ledger naming was generalized from `leverage_reset` / `leverage_reset_count` to `exposure_reset` / `exposure_reset_count`. That contract-only rename also passed focused plus full Python regression before atomic publish at `16855490bfef000e76ea7cc2d39e0e638d6cf579`.\n',
              ),
              (
                  '9. Leveraged allocation-threshold checks normalized asset mix, so gross-exposure drift alone cannot masquerade as allocation drift.\n10. Underinvested allocation-threshold semantics include intentional residual cash.\n11. Reset/rebalance transaction costs are solved against post-cost equity through the ledger; no leveraged-return multiplication approximation is allowed.',
                  '9. Allocation-threshold checks normalized internal asset mix for non-100% Portfolios; gross/cash drift is handled by the independent daily exposure reset and cannot by itself trigger internal rebalancing.\n10. Underinvested daily reset recomputes target asset gross and residual cash from post-cost equity and does not create debt merely to preserve a stale cash amount.\n11. Reset/rebalance transaction costs are solved against post-cost equity through the ledger; no leveraged-return multiplication approximation is allowed.',
              ),
              (
                  '- canonical `docs/PORTFOLIO_V3_CONTRACT.md` has been updated with the opened API contract and the user-confirmed gross-reset/internal-mix semantics;\n- this handoff update is part of the final user-authored L2 candidate used to obtain formal exact-head CI/Vercel evidence.',
                  '- user clarification exposed a real underinvested correctness blocker: the initial L1 policy reset only >100% targets daily; <100% targets merely started with residual cash and then drifted;\n- the underinvested repair now resets every non-100% target at each close, preserves current internal asset mix, recomputes cash from post-cost equity, and leaves periodic/threshold rules as the only authority that restores target internal mix; focused + full Python regression passed before publish;\n- the unreleased event/result contract was generalized to `exposure_reset` / `exposure_reset_count` so 50% cash and 150% leverage share one truthful name; focused + full Python regression passed before publish;\n- canonical `docs/PORTFOLIO_V3_CONTRACT.md` has been updated with the opened API contract and the user-confirmed gross-reset/internal-mix semantics;\n- the final user-authored L2 candidate must still pass formal exact-head full-repository CI and Vercel preview before L2 is marked DONE.',
              ),
              (
                  '4. treat L1 as CLOSED unless new correctness evidence reopens it;',
                  '4. treat the corrected L1 ledger semantics as locked unless new correctness evidence reopens them;',
              ),
          ]

          for old, new in replacements:
              if prefix.count(old) != 1:
                  raise SystemExit('handoff anchor mismatch: ' + old[:80])
              prefix = prefix.replace(old, new, 1)

          updated = prefix + marker + appendix
          if updated.count('# Historical Execution Record — Batch 4A-5') != 1:
              raise SystemExit('historical appendix was not preserved exactly once')
          path.write_text(updated)
          PY

          git diff --check
          git diff -- to_do_update_list.md

      - name: Commit handoff only and remove updater
        run: |
          set -euo pipefail
          rm .github/workflows/update-portfolio-exposure-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- to_do_update_list.md .github/workflows/update-portfolio-exposure-handoff.yml
          git diff --cached --check
          git commit -m "docs: record non-100 exposure reset RCA"
          git push origin HEAD:feat/portfolio-weight-defined-exposure
