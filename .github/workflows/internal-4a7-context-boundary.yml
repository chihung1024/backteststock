name: Internal 4A-7 Context Boundary

on:
  push:
    branches:
      - internal-4a7-context-boundary
    paths:
      - .github/workflows/internal-4a7-context-boundary.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Apply candidate patch
        run: python scripts/_internal_4a7_context_boundary.py

      - name: Install dependencies
        run: npm ci

      - name: Check source and Worker authority
        run: |
          npm run check
          npm run test:worker

      - name: Type-check and build Portfolio
        run: npm run check:portfolio

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test Research Library context boundaries
        run: npx playwright test tests/e2e/walk_forward_workspace.spec.mjs tests/e2e/walk_forward_admission.spec.mjs tests/e2e/research_library.spec.mjs tests/e2e/research_library_concurrency.spec.mjs tests/e2e/research_library_stale.spec.mjs --reporter=line

      - name: Verify Cloudflare bundle and diff
        run: |
          npx wrangler deploy --dry-run --outdir .wrangler-context-boundary
          git diff --check

      - name: Commit verified hardening and self-remove
        run: |
          git fetch origin internal-4a7-context-boundary
          test "$(git rev-parse origin/internal-4a7-context-boundary)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- worker/walk_forward_router.js apps/portfolio-web/src/ResearchLibraryPanel.tsx tests/test_research_run_memory.mjs tests/e2e/research_library_stale.spec.mjs public/portfolio
          git rm -- .github/workflows/internal-4a7-context-boundary.yml scripts/_internal_4a7_context_boundary.py
          git commit -m "fix: preserve Research Library execution context"
          git push origin HEAD:internal-4a7-context-boundary
