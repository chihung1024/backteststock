name: Internal 4A-7 Final Handoff Sync

on:
  push:
    branches:
      - internal-4a7-context-boundary
    paths:
      - .github/workflows/internal-4a7-final-handoff-sync.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply current handoff truth
        run: python scripts/_internal_sync_4a7_handoff.py

      - name: Validate handoff
        run: |
          grep -q 'run 31999833266: SUCCESS' to_do_update_list.md
          grep -q '120 / 120 PASS' to_do_update_list.md
          grep -q 'late-connect/unmount credential race' to_do_update_list.md
          grep -q 'cchung911 R3 exact-head review' to_do_update_list.md
          git diff --check

      - name: Commit handoff and self-remove
        run: |
          git fetch origin internal-4a7-context-boundary
          test "$(git rev-parse origin/internal-4a7-context-boundary)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- to_do_update_list.md
          git rm -- .github/workflows/internal-4a7-final-handoff-sync.yml scripts/_internal_sync_4a7_handoff.py
          git commit -m "docs: sync final 4A-7 handoff truth"
          git push origin HEAD:internal-4a7-context-boundary
