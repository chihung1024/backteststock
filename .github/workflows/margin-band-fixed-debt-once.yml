name: Margin Band Fixed Debt Once

on:
  push:
    branches:
      - fix/portfolio-margin-band-20260827
    paths:
      - ".github/workflows/margin-band-fixed-debt-once.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-margin-band-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch fixed-debt rebalance authority
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/api/app/portfolio/ledger.py')
          text = p.read_text()
          old = '''    def target_builder(net_equity: float) -> tuple[np.ndarray, float, float]:\n        return _target_state(net_equity, policy, leverage)\n\n    return _solve_trade_target(\n'''
          new = '''    if policy.fixed_debt:\n        preserved_debt = max(float(debt), 0.0)\n\n        def target_builder(net_equity: float) -> tuple[np.ndarray, float, float]:\n            target_gross = max(net_equity + preserved_debt, 0.0)\n            return policy.target_asset_mix * target_gross, preserved_debt, 0.0\n    else:\n        def target_builder(net_equity: float) -> tuple[np.ndarray, float, float]:\n            return _target_state(net_equity, policy, leverage)\n\n    return _solve_trade_target(\n'''
          if old not in text:
              raise SystemExit('fixed-debt rebalance anchor missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify accrued fixed debt survives rebalance
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import pandas as pd
          from apps.api.app.portfolio.ledger import simulate_portfolio_ledger
          from apps.api.app.portfolio.models import (
              LeverageConfig, LeverageType, PortfolioSpec,
              RebalanceConfig, RebalanceFrequency, SimulationConfig,
          )

          idx = pd.DatetimeIndex(['2025-12-30','2025-12-31','2026-01-02'])
          def history():
              returns = pd.Series([0.0, 0.0, 0.0], index=idx)
              return SimpleNamespace(
                  daily_returns=returns,
                  price_returns=returns.copy(),
                  distribution_returns=pd.Series(0.0, index=idx),
                  valuation=SimpleNamespace(native_observation_mask=pd.Series(True, index=idx)),
              )

          ledger = simulate_portfolio_ledger(
              PortfolioSpec.from_weights('FixedDebt', {'A': 1.0}),
              {'A': history()},
              SimulationConfig(
                  initial_amount=100.0,
                  leverage=LeverageConfig(
                      type=LeverageType.FIXED_DEBT,
                      debt_amount=50.0,
                      annual_interest_rate_percent=10.0,
                  ),
                  rebalancing=RebalanceConfig(frequency=RebalanceFrequency.ANNUAL),
              ),
          )
          r = 0.10 / 365.2425
          debt_after_day1 = 50.0 * (1.0 + r)
          assert abs(float(ledger.debt.iloc[1]) - debt_after_day1) < 1e-9
          # Annual rebalance is on Dec 31 in this calendar; it must not reset debt to 50.
          assert float(ledger.debt.iloc[1]) > 50.0
          assert abs(float(ledger.debt.iloc[2]) - debt_after_day1 * (1.0 + 2*r)) < 1e-8
          print('fixed-debt accrued-interest invariant: OK')
          PY
      - name: Remove self and commit
        run: |
          git config user.name "chihung1024"
          git config user.email "104315542+chihung1024@users.noreply.github.com"
          git rm .github/workflows/margin-band-fixed-debt-once.yml
          git add apps/api/app/portfolio/ledger.py
          git commit -m "fix: preserve accrued fixed debt on rebalance"
          git push origin HEAD:fix/portfolio-margin-band-20260827
