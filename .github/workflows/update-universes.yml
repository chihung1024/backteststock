name: Update Universe Membership

on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate sources without publishing to D1
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: universe-membership-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      UNIVERSE_NASDAQ100_RELAY_URL: https://backteststock.chired.workers.dev/api/v2/sources/qqqm-holdings
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        if: ${{ inputs.dry_run != true }}
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install requests
      - name: Install Worker dependencies
        if: ${{ inputs.dry_run != true }}
        run: npm ci
      - name: Resolve or create Universe D1 database
        if: ${{ inputs.dry_run != true }}
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          database_id="$(npx wrangler d1 list --json | node scripts/find_d1_database.mjs backteststock-universe)"
          if [ -z "$database_id" ]; then
            npx wrangler d1 create backteststock-universe --location apac
            database_id="$(npx wrangler d1 list --json | node scripts/find_d1_database.mjs backteststock-universe)"
          fi
          if [ -z "$database_id" ]; then
            echo "Unable to resolve the backteststock-universe D1 database." >&2
            exit 1
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
      - name: Render production configuration
        if: ${{ inputs.dry_run != true }}
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: node scripts/render_wrangler_config.mjs
      - name: Apply D1 migrations
        if: ${{ inputs.dry_run != true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler d1 migrations apply backteststock-universe
          --remote --config wrangler.production.jsonc
      - name: Validate and publish Universe snapshots
        if: ${{ inputs.dry_run != true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: python scripts/update_universes.py --publish
      - name: Validate Universe sources
        if: ${{ inputs.dry_run == true }}
        run: python scripts/update_universes.py
      - name: Upload validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: universe-update-report
          path: universe-update-report.json
          if-no-files-found: warn
