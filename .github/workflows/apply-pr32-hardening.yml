name: Apply PR32 hardening

on:
  push:
    branches:
      - fix/optimizer-manual-shortlist-30
    paths:
      - .github/workflows/apply-pr32-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/optimizer-manual-shortlist-30
          fetch-depth: 0
      - name: Apply reviewed source transformations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          worker_path = root / 'public/optimizer-worker.js'
          worker = worker_path.read_text()

          old = '''function searchBudgetPlan(primaryObjective, searchBudget) {
            const primaryQuota = Math.floor(searchBudget * 0.50);
            const secondaryQuota = Math.floor(searchBudget * 0.10);
            const requested = Object.fromEntries(
              OBJECTIVES.map((objective) => [
                objective,
                objective === primaryObjective ? primaryQuota : secondaryQuota,
              ]),
            );
            requested.pareto_diversity = (
              searchBudget
              - primaryQuota
              - secondaryQuota * (OBJECTIVES.length - 1)
            );
            return requested;
          }'''
          new = '''function searchBudgetPlan(searchBudget) {
            const objectiveQuota = Math.floor(searchBudget * 0.18);
            const requested = Object.fromEntries(
              OBJECTIVES.map((objective) => [objective, objectiveQuota]),
            );
            requested.pareto_diversity = (
              searchBudget - objectiveQuota * OBJECTIVES.length
            );
            return requested;
          }'''
          assert old in worker, 'searchBudgetPlan block not found'
          worker = worker.replace(old, new)

          worker = worker.replace(
          '''function selectDeepMasks({
            records,
            indexByMask,
            primaryObjective,
            searchBudget,
            seedText,
          }) {''',
          '''function selectDeepMasks({
            records,
            indexByMask,
            searchBudget,
            seedText,
          }) {''')
          worker = worker.replace(
            '  const requested = searchBudgetPlan(primaryObjective, searchBudget);',
            '  const requested = searchBudgetPlan(searchBudget);',
          )
          worker = worker.replace(
          '''  const objectiveOrder = [
            primaryObjective,
            ...OBJECTIVES.filter((objective) => objective !== primaryObjective),
          ];''',
          '''  const objectiveOrder = [...OBJECTIVES];''')
          worker = worker.replace(
            '    const seedCount = objective === primaryObjective ? 80 : 30;',
            '    const seedCount = 50;',
          )

          pattern = re.compile(
            r'function selectVerificationRecords\(records, primaryObjective\) \{.*?\n\}\n\nexport function serializeMasksLittleEndian',
            re.S,
          )
          replacement = '''function selectVerificationRecords(records) {
            const output = [];
            const seen = new Set();
            const requested = Object.fromEntries(
              OBJECTIVES.map((objective) => [objective, 48]),
            );
            requested.pareto_diversity = 60;
            const actual = Object.fromEntries(
              [...OBJECTIVES, "pareto_diversity"].map((key) => [key, 0]),
            );

            for (const objective of OBJECTIVES) {
              actual[objective] = addUniqueRanked(
                output,
                seen,
                records,
                requested[objective],
                `objective:${objective}`,
                objective,
              );
            }

            const anchors = output.slice(0, 25).map((record) => record.mask);
            const diversityDistance = (record) => Math.min(
              ...anchors.map((anchor) => hammingDistance(record.mask, anchor)),
            );
            const pareto = approximatePareto(records)
              .filter((record) => !seen.has(record.mask))
              .sort((left, right) => (
                diversityDistance(right) - diversityDistance(left)
                || left.mask - right.mask
              ));
            const remaining = records
              .filter((record) => !seen.has(record.mask))
              .sort((left, right) => (
                diversityDistance(right) - diversityDistance(left)
                || left.mask - right.mask
              ));
            for (const record of [...pareto, ...remaining]) {
              if (actual.pareto_diversity >= requested.pareto_diversity) break;
              if (seen.has(record.mask)) continue;
              seen.add(record.mask);
              output.push({ ...record, selectionSource: "pareto-diversity" });
              actual.pareto_diversity += 1;
            }

            const mismatches = [...OBJECTIVES, "pareto_diversity"].filter(
              (key) => actual[key] !== requested[key],
            );
            if (output.length !== 300 || mismatches.length) {
              throw new Error(
                `精確複驗配額不完整：${JSON.stringify({ requested, actual })}`,
              );
            }
            return {
              records: output,
              allocation: { requested, actual },
            };
          }

          export function serializeMasksLittleEndian'''
          worker, count = pattern.subn(replacement, worker)
          assert count == 1, f'selectVerificationRecords replacement count={count}'

          old = '''  const primaryObjective = settings.primaryObjective || "sortino_ratio";
            if (!OBJECTIVES.includes(primaryObjective)) {
              throw new Error("主要最佳化目標無效。");
            }'''
          new = '''  const optimizationMode = "balanced_multi_objective";'''
          assert old in worker, 'primary objective validation block not found'
          worker = worker.replace(old, new)
          worker = worker.replace('    primaryObjective,\n    searchBudget,', '    searchBudget,')
          worker = worker.replace('    primaryObjective,\n  );', '  );')
          worker = worker.replace(
          '''  const verificationSelection = selectVerificationRecords(
            deepRecords,
            primaryObjective,
          );''',
          '''  const verificationSelection = selectVerificationRecords(deepRecords);''')
          worker = worker.replace(
            '      primaryObjective,\n      proxyCombinationCount:',
            '      optimizationMode,\n      primaryObjective: null,\n      proxyCombinationCount:',
          )
          worker_path.write_text(worker)

          optimizer_path = root / 'public/optimizer.js'
          optimizer = optimizer_path.read_text()
          optimizer = optimizer.replace(
            '"/optimizer-worker.js?v=20260801.1"',
            '"/optimizer-worker.js?v=20260802.2"',
          )
          optimizer = optimizer.replace(
          '''    const settings = {
              primaryObjective,
              searchBudget,''',
          '''    const settings = {
              primaryObjective,
              optimizationMode: "balanced_multi_objective",
              searchBudget,''')
          optimizer = optimizer.replace(
            '    renderResultTable(results, primaryObjective);',
            '    renderResultTable(results, primaryObjective);',
          )
          optimizer_path.write_text(optimizer)

          html_path = root / 'public/optimizer.html'
          html = html_path.read_text()
          html = html.replace(
            '<script type="module" src="/optimizer.js?v=20260801.1"></script>',
            '<script type="module" src="/optimizer-ui-hardening.js?v=20260802.2"></script>\n  <script type="module" src="/optimizer.js?v=20260802.2"></script>',
          )
          old = '''        <label>
                  <span>主要最佳化目標</span>
                  <select id="optimizer-primary-objective"></select>
                </label>'''
          new = '''        <label class="optimizer-balanced-search-control">
                  <span>搜尋策略</span>
                  <input type="text" value="五目標平衡搜尋（無單一主要目標）" readonly>
                  <select id="optimizer-primary-objective" class="hidden" aria-hidden="true" tabindex="-1"></select>
                </label>'''
          assert old in html, 'primary objective HTML block not found'
          html = html.replace(old, new)
          html = html.replace(
            'value="300 組（120 + 4×30 + 60）"',
            'value="300 組（5×48 + 60）"',
          )
          html = html.replace(
            '<h3>300 組精確複驗</h3>',
            '<h3>300 組精確複驗（可自由排序）</h3>',
          )
          html_path.write_text(html)

          ui_path = root / 'public/optimizer-ui-hardening.js'
          ui_path.write_text(r'''const DATE_MODE_KEY = "backteststock-optimizer-date-mode-v1";
          const CUSTOM_RANGE_KEY = "backteststock-optimizer-custom-range-v1";
          const LOOKBACK_YEARS = 10;

          let verifiedRows = new Map();
          let currentSort = { field: "training.sortino_ratio", direction: "desc" };

          const SORT_FIELDS = Object.freeze([
            ["training.sortino_ratio", "訓練 Sortino", "desc"],
            ["training.cagr", "訓練 CAGR", "desc"],
            ["training.mdd", "訓練 |MDD|", "asc-abs"],
            ["training.beta", "訓練 |Beta|", "asc-abs"],
            ["training.alpha", "訓練 Alpha", "desc"],
            ["training.annualizedTurnoverOneWay", "訓練年化單邊換手", "asc"],
            ["training.rebalanceCount", "訓練再平衡次數", "asc"],
            ["validation.sortino_ratio", "樣本外 Sortino", "desc"],
            ["validation.cagr", "樣本外 CAGR", "desc"],
            ["validation.mdd", "樣本外 |MDD|", "asc-abs"],
            ["validation.beta", "樣本外 |Beta|", "asc-abs"],
            ["validation.alpha", "樣本外 Alpha", "desc"],
            ["validation.annualizedTurnoverOneWay", "樣本外年化單邊換手", "asc"],
            ["validation.rebalanceCount", "樣本外再平衡次數", "asc"],
          ]);

          function formatLocalDate(date) {
            return [
              date.getFullYear(),
              String(date.getMonth() + 1).padStart(2, "0"),
              String(date.getDate()).padStart(2, "0"),
            ].join("-");
          }

          function rollingRange(now = new Date()) {
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const end = new Date(today);
            end.setDate(end.getDate() - 1);
            const year = today.getFullYear() - LOOKBACK_YEARS;
            const maxDay = new Date(year, today.getMonth() + 1, 0).getDate();
            const start = new Date(year, today.getMonth(), Math.min(today.getDate(), maxDay));
            return { startDate: formatLocalDate(start), endDate: formatLocalDate(end) };
          }

          function recentAutomaticMatch(startDate, endDate, days = 31) {
            const now = new Date();
            for (let offset = 0; offset <= days; offset += 1) {
              const candidate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - offset);
              const range = rollingRange(candidate);
              if (range.startDate === startDate && range.endDate === endDate) return true;
            }
            return false;
          }

          function readJson(key) {
            try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
          }

          function installRollingDates() {
            const start = document.querySelector("#optimizer-start-date");
            const end = document.querySelector("#optimizer-end-date");
            if (!start || !end) return;
            const current = rollingRange();
            const mode = localStorage.getItem(DATE_MODE_KEY);
            const custom = readJson(CUSTOM_RANGE_KEY);
            const inferredAutomatic = recentAutomaticMatch(start.value, end.value);

            if (mode === "custom" && custom?.startDate && custom?.endDate) {
              start.value = custom.startDate;
              end.value = custom.endDate;
            } else if (mode === "automatic" || (!mode && inferredAutomatic)) {
              start.value = current.startDate;
              end.value = current.endDate;
              localStorage.setItem(DATE_MODE_KEY, "automatic");
            } else if (!mode) {
              localStorage.setItem(DATE_MODE_KEY, "custom");
              localStorage.setItem(CUSTOM_RANGE_KEY, JSON.stringify({
                startDate: start.value,
                endDate: end.value,
              }));
            }

            const record = () => {
              const latest = rollingRange();
              if (start.value === latest.startDate && end.value === latest.endDate) {
                localStorage.setItem(DATE_MODE_KEY, "automatic");
                localStorage.removeItem(CUSTOM_RANGE_KEY);
              } else {
                localStorage.setItem(DATE_MODE_KEY, "custom");
                localStorage.setItem(CUSTOM_RANGE_KEY, JSON.stringify({
                  startDate: start.value,
                  endDate: end.value,
                }));
              }
            };
            start.addEventListener("change", record);
            end.addEventListener("change", record);

            const endLabel = end.closest("label");
            if (endLabel && !document.querySelector("#optimizer-reset-rolling-dates")) {
              const button = document.createElement("button");
              button.type = "button";
              button.id = "optimizer-reset-rolling-dates";
              button.className = "button ghost compact optimizer-date-reset";
              button.textContent = "恢復每日自動日期";
              button.addEventListener("click", () => {
                const latest = rollingRange();
                start.value = latest.startDate;
                end.value = latest.endDate;
                localStorage.setItem(DATE_MODE_KEY, "automatic");
                localStorage.removeItem(CUSTOM_RANGE_KEY);
              });
              endLabel.append(button);
            }
          }

          function valueAt(row, path) {
            return path.split(".").reduce((value, key) => value?.[key], row);
          }

          function escapeHtml(value) {
            return String(value ?? "")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&#039;");
          }

          function format(value, type = "number") {
            const numeric = Number(value);
            if (!Number.isFinite(numeric)) return "—";
            if (type === "percent") return `${(numeric * 100).toFixed(2)}%`;
            if (type === "integer") return String(Math.round(numeric));
            return numeric.toFixed(3);
          }

          function sortRows(rows) {
            const definition = SORT_FIELDS.find(([field]) => field === currentSort.field);
            const preferred = definition?.[2] || "desc";
            return [...rows].sort((left, right) => {
              let leftValue = Number(valueAt(left, currentSort.field));
              let rightValue = Number(valueAt(right, currentSort.field));
              if (!Number.isFinite(leftValue)) leftValue = Number.POSITIVE_INFINITY;
              if (!Number.isFinite(rightValue)) rightValue = Number.POSITIVE_INFINITY;
              const absolute = preferred === "asc-abs";
              if (absolute) {
                leftValue = Math.abs(leftValue);
                rightValue = Math.abs(rightValue);
              }
              const direction = currentSort.direction === "asc" ? 1 : -1;
              const difference = (leftValue - rightValue) * direction;
              return Math.abs(difference) > 1e-12
                ? difference
                : Number(left.mask) - Number(right.mask);
            });
          }

          function header(label, field) {
            const active = currentSort.field === field;
            const arrow = active ? (currentSort.direction === "asc" ? " ▲" : " ▼") : "";
            return `<button type="button" class="optimizer-sort-header" data-sort-field="${field}">${label}${arrow}</button>`;
          }

          function renderSortableResults() {
            const table = document.querySelector("#optimizer-result-table");
            if (!table || verifiedRows.size === 0) return;
            const rows = sortRows([...verifiedRows.values()]);
            let controls = document.querySelector("#optimizer-result-sort-controls");
            if (!controls) {
              controls = document.createElement("div");
              controls.id = "optimizer-result-sort-controls";
              controls.className = "optimizer-result-sort-controls";
              table.closest(".table-wrap")?.before(controls);
            }
            controls.innerHTML = `
              <label><span>顯示排序</span><select id="optimizer-result-sort-field">
                ${SORT_FIELDS.map(([field, label]) => `<option value="${field}" ${field === currentSort.field ? "selected" : ""}>${label}</option>`).join("")}
              </select></label>
              <label><span>方向</span><select id="optimizer-result-sort-direction">
                <option value="desc" ${currentSort.direction === "desc" ? "selected" : ""}>由高到低</option>
                <option value="asc" ${currentSort.direction === "asc" ? "selected" : ""}>由低到高</option>
              </select></label>
              <p>排序只改變顯示順序，不回頭改變候選池、搜尋或樣本外驗證。</p>`;
            controls.querySelector("#optimizer-result-sort-field")?.addEventListener("change", (event) => {
              const field = event.target.value;
              const preferred = SORT_FIELDS.find(([key]) => key === field)?.[2] || "desc";
              currentSort = { field, direction: preferred.startsWith("asc") ? "asc" : "desc" };
              renderSortableResults();
            });
            controls.querySelector("#optimizer-result-sort-direction")?.addEventListener("change", (event) => {
              currentSort.direction = event.target.value;
              renderSortableResults();
            });

            table.innerHTML = `
              <thead><tr>
                <th>顯示排名</th><th>持股</th>
                <th>${header("訓練 Sortino", "training.sortino_ratio")}</th>
                <th>${header("訓練 CAGR", "training.cagr")}</th>
                <th>${header("訓練 MDD", "training.mdd")}</th>
                <th>${header("訓練 Beta", "training.beta")}</th>
                <th>${header("訓練 Alpha", "training.alpha")}</th>
                <th>${header("樣本外 Sortino", "validation.sortino_ratio")}</th>
                <th>${header("樣本外 CAGR", "validation.cagr")}</th>
                <th>${header("樣本外 MDD", "validation.mdd")}</th>
                <th>${header("樣本外 Beta", "validation.beta")}</th>
                <th>${header("樣本外 Alpha", "validation.alpha")}</th>
                <th>${header("訓練換手", "training.annualizedTurnoverOneWay")}</th>
                <th>${header("樣本外換手", "validation.annualizedTurnoverOneWay")}</th>
                <th>${header("訓練再平衡", "training.rebalanceCount")}</th>
                <th>${header("樣本外再平衡", "validation.rebalanceCount")}</th>
              </tr></thead>
              <tbody>${rows.map((row, index) => `<tr>
                <td>${index + 1}</td><td class="optimizer-holdings">${escapeHtml(row.tickers.join(", "))}</td>
                <td>${format(row.training.sortino_ratio)}</td><td>${format(row.training.cagr, "percent")}</td>
                <td>${format(row.training.mdd, "percent")}</td><td>${format(row.training.beta)}</td>
                <td>${format(row.training.alpha, "percent")}</td><td>${format(row.validation.sortino_ratio)}</td>
                <td>${format(row.validation.cagr, "percent")}</td><td>${format(row.validation.mdd, "percent")}</td>
                <td>${format(row.validation.beta)}</td><td>${format(row.validation.alpha, "percent")}</td>
                <td>${format(row.training.annualizedTurnoverOneWay, "percent")}</td>
                <td>${format(row.validation.annualizedTurnoverOneWay, "percent")}</td>
                <td>${format(row.training.rebalanceCount, "integer")}</td>
                <td>${format(row.validation.rebalanceCount, "integer")}</td>
              </tr>`).join("")}</tbody>`;
          }

          const nativeFetch = window.fetch.bind(window);
          window.fetch = async (input, init = {}) => {
            const response = await nativeFetch(input, init);
            const url = typeof input === "string" ? input : input?.url || "";
            if (url.includes("/api/optimizer/verify") && response.ok) {
              try {
                const payload = await response.clone().json();
                for (const row of payload.results || []) verifiedRows.set(row.combinationId, row);
                queueMicrotask(renderSortableResults);
              } catch {
                // Preserve the original response if diagnostics cannot be decoded.
              }
            }
            return response;
          };

          function installStyles() {
            const style = document.createElement("style");
            style.textContent = `
              .optimizer-date-reset { margin-top: .45rem; width: max-content; }
              .optimizer-result-sort-controls { display:grid; grid-template-columns:minmax(12rem,1fr) minmax(9rem,.45fr) minmax(18rem,2fr); gap:.75rem; align-items:end; margin:0 0 .8rem; }
              .optimizer-result-sort-controls p { margin:0 0 .55rem; color:var(--muted); }
              .optimizer-sort-header { appearance:none; border:0; padding:0; background:transparent; color:inherit; font:inherit; font-weight:800; cursor:pointer; white-space:nowrap; }
              @media (max-width:760px) { .optimizer-result-sort-controls { grid-template-columns:1fr; } }
            `;
            document.head.append(style);
          }

          installStyles();
          window.addEventListener("DOMContentLoaded", () => {
            installRollingDates();
            const observer = new MutationObserver(() => {
              if (verifiedRows.size) renderSortableResults();
            });
            const table = document.querySelector("#optimizer-result-table");
            if (table) observer.observe(table, { childList: true, subtree: true });
            table?.addEventListener("click", (event) => {
              const button = event.target.closest("[data-sort-field]");
              if (!button) return;
              const field = button.dataset.sortField;
              if (currentSort.field === field) {
                currentSort.direction = currentSort.direction === "asc" ? "desc" : "asc";
              } else {
                const preferred = SORT_FIELDS.find(([key]) => key === field)?.[2] || "desc";
                currentSort = { field, direction: preferred.startsWith("asc") ? "asc" : "desc" };
              }
              renderSortableResults();
            });
          }, { once: true });
          ''')

          test_path = root / 'tests/test_optimizer_worker.mjs'
          test = test_path.read_text()
          test = test.replace(
          '''      sortino_ratio: 500,
                cagr: 100,
                mdd_abs: 100,
                beta_abs: 100,
                alpha: 100,
                pareto_diversity: 100,''',
          '''      sortino_ratio: 180,
                cagr: 180,
                mdd_abs: 180,
                beta_abs: 180,
                alpha: 180,
                pareto_diversity: 100,''')
          test = test.replace(
          '''      sortino_ratio: 120,
                cagr: 30,
                mdd_abs: 30,
                beta_abs: 30,
                alpha: 30,
                pareto_diversity: 60,''',
          '''      sortino_ratio: 48,
                cagr: 48,
                mdd_abs: 48,
                beta_abs: 48,
                alpha: 48,
                pareto_diversity: 60,''')
          test = test.replace('sourceCounts["primary:sortino_ratio"].length, 120', 'sourceCounts["objective:sortino_ratio"].length, 48')
          test = test.replace('sourceCounts["secondary:cagr"].length, 30', 'sourceCounts["objective:cagr"].length, 48')
          test = test.replace('sourceCounts["secondary:mdd_abs"].length, 30', 'sourceCounts["objective:mdd_abs"].length, 48')
          test = test.replace('sourceCounts["secondary:beta_abs"].length, 30', 'sourceCounts["objective:beta_abs"].length, 48')
          test = test.replace('sourceCounts["secondary:alpha"].length, 30', 'sourceCounts["objective:alpha"].length, 48')
          test = test.replace(
            '  assert.equal(result.search.proxyCombinationCount, 184756);',
            '  assert.equal(result.search.optimizationMode, "balanced_multi_objective");\n  assert.equal(result.search.primaryObjective, null);\n  assert.equal(result.search.proxyCombinationCount, 184756);',
          )
          test_path.write_text(test)

          e2e_path = root / 'tests/e2e/optimizer_dual_mode.spec.mjs'
          e2e = e2e_path.read_text().replace('await page.goto("/");', 'await page.goto("/", { waitUntil: "domcontentloaded" });')
          e2e_path.write_text(e2e)

          rolling_test = root / 'tests/e2e/optimizer_rolling_dates.spec.mjs'
          rolling_test.write_text(r'''import { expect, test } from "@playwright/test";

          function localRange(now = new Date()) {
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const end = new Date(today);
            end.setDate(end.getDate() - 1);
            const year = today.getFullYear() - 10;
            const maxDay = new Date(year, today.getMonth() + 1, 0).getDate();
            const start = new Date(year, today.getMonth(), Math.min(today.getDate(), maxDay));
            const format = (date) => [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
            return { startDate: format(start), endDate: format(end) };
          }

          test("optimizer advances a prior rolling default after refresh", async ({ page }) => {
            const current = localRange();
            const previousNow = new Date();
            previousNow.setDate(previousNow.getDate() - 1);
            const previous = localRange(previousNow);
            await page.addInitScript(({ prior }) => {
              localStorage.setItem("backteststock-scan-job-v2", JSON.stringify({
                version: 2,
                id: "prior-day-job",
                payload: { tickers: Array.from({ length: 20 }, (_, index) => `T${index}`), benchmark: "SPY", startDate: prior.startDate, endDate: prior.endDate },
                results: [], pending: [], attempts: {}, retryRound: 0,
              }));
            }, { prior: previous });
            await page.goto("/optimizer.html", { waitUntil: "domcontentloaded" });
            await expect(page.locator("#optimizer-start-date")).toHaveValue(current.startDate);
            await expect(page.locator("#optimizer-end-date")).toHaveValue(current.endDate);
            await expect(page.locator("#optimizer-reset-rolling-dates")).toBeVisible();
          });

          test("optimizer preserves an explicitly custom range", async ({ page }) => {
            await page.addInitScript(() => {
