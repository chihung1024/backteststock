name: Apply corporate-action follow-ups

on:
  push:
    branches: [fix/corporate-action-total-return-audit]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/corporate-action-total-return-audit
      - name: Apply exact replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "api/index_v2.py",
              "from api.metrics import (\n    METRIC_DEFINITION_VERSION,",
              "from api.metrics import (\n    DATA_SOURCE_SETTINGS,\n    METRIC_DEFINITION_VERSION,",
          )
          replace_once(
              "api/index_v2.py",
              "logger = logging.getLogger(__name__)\n\n\ndef bulk_download_prices",
              "logger = logging.getLogger(__name__)\n\nif DATA_SOURCE_SETTINGS[\"auto_adjust\"] or not DATA_SOURCE_SETTINGS[\"actions\"]:\n    raise RuntimeError(\n        \"Production backtest requires explicit Adj Close with corporate actions retained\"\n    )\n\n\ndef bulk_download_prices",
          )
          replace_once(
              "api/corporate_actions.py",
              '''def _split_like_unreported_returns(\n    adjusted: pd.Series,\n    declared_actions: pd.Series,\n) -> pd.Series:\n    ratios = adjusted / adjusted.shift(1)\n    distances = np.abs(ratios.to_numpy(dtype=float)[:, None] / SPLIT_LIKE_RATIOS - 1.0)\n    nearest = pd.Series(np.nanmin(distances, axis=1), index=ratios.index)\n    return nearest.le(0.03) & ~declared_actions & ratios.notna()\n''',
              '''def _split_like_unreported_returns(\n    adjusted: pd.Series,\n    declared_actions: pd.Series,\n) -> pd.Series:\n    ratios = adjusted / adjusted.shift(1)\n    nearest = pd.Series(np.inf, index=ratios.index, dtype=float)\n    valid = ratios.notna()\n    if valid.any():\n        distances = np.abs(\n            ratios.loc[valid].to_numpy(dtype=float)[:, None] / SPLIT_LIKE_RATIOS - 1.0\n        )\n        nearest.loc[valid] = np.min(distances, axis=1)\n    return nearest.le(0.03) & ~declared_actions & valid\n''',
          )
          replace_once(
              "public/scan-score-formulas.js",
              'export const METRIC_DEFINITION_VERSION = "2026-08-01.1";',
              'export const METRIC_DEFINITION_VERSION = "2026-08-01.2";',
          )
          for path in ("public/scan-output-ui.js", "public/scan-composite-score.js"):
              replace_once(
                  path,
                  'from "./scan-score-formulas.js";',
                  'from "./scan-score-formulas.js?v=20260801.2";',
              )
          replace_once(
              "public/index.html",
              '<script type="module" src="/scan-output-ui.js?v=20260801.3"></script>',
              '<script type="module" src="/scan-output-ui.js?v=20260801.4"></script>',
          )
          replace_once(
              "public/index.html",
              '<script type="module" src="/scan-composite-score.js?v=20260801.2"></script>',
              '<script type="module" src="/scan-composite-score.js?v=20260801.3"></script>',
          )
          PY
      - name: Verify patch scope
        run: |
          git diff --check
          git diff -- api/index_v2.py api/corporate_actions.py public/scan-score-formulas.js public/scan-output-ui.js public/scan-composite-score.js public/index.html
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/index_v2.py api/corporate_actions.py public/scan-score-formulas.js public/scan-output-ui.js public/scan-composite-score.js public/index.html
          git commit -m "Synchronize corporate-action runtime and browser contracts"
          git push origin HEAD:fix/corporate-action-total-return-audit
