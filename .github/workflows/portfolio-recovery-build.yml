name: Portfolio Recovery Build

on:
  push:
    branches:
      - fix/portfolio-time-source-truth-20260827
    paths:
      - ".github/workflows/portfolio-recovery-build.yml"
      - "apps/portfolio-web/**"
      - "package.json"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/portfolio-time-source-truth-20260827
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install minimal Portfolio toolchain
        run: npm install --no-audit --no-fund

      - name: Typecheck and build Portfolio source
        run: npm run check:portfolio

      - name: Keep frozen production artifact surface
        run: rm -f public/portfolio/assets/*.map

      - name: Commit deterministic Portfolio artifact
        shell: bash
        run: |
          set -euo pipefail
          git add -A public/portfolio
          if git diff --cached --quiet; then
            echo "Portfolio build produced no artifact change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate Portfolio artifact from restored source"
          git push origin HEAD:fix/portfolio-time-source-truth-20260827
