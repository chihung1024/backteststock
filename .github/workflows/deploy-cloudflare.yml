name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "worker/**"
      - "public/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/render_wrangler_config.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Worker dependencies
        run: npm ci
      - name: Resolve or create Universe D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          database_id="$(npx wrangler d1 list --json | node scripts/find_d1_database.mjs backteststock-universe)"
          if [ -z "$database_id" ]; then
            npx wrangler d1 create backteststock-universe --location apac
            database_id="$(npx wrangler d1 list --json | node scripts/find_d1_database.mjs backteststock-universe)"
          fi
          if [ -z "$database_id" ]; then
            echo "Unable to resolve the backteststock-universe D1 database." >&2
            exit 1
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
      - name: Render production configuration
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: node scripts/render_wrangler_config.mjs
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler d1 migrations apply backteststock-universe
          --remote --config wrangler.production.jsonc
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.jsonc
