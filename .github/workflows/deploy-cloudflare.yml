name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "worker/**"
      - "public/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/render_wrangler_config.mjs"
      - "scripts/smoke_test_production.mjs"
      - "scripts/smoke_test_portfolio_v3.mjs"
      - "scripts/smoke_test_refinery_v1.mjs"
      - "scripts/smoke_test_walk_forward_v1.mjs"
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Report deployment started
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$(printf '%s' '{"state":"pending","context":"Cloudflare Worker","description":"Production deployment and smoke test are running","target_url":"'"${STATUS_URL}"'"}')"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Worker dependencies
        run: npm ci
      - name: Resolve or create Universe D1 database
        id: d1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          database_id="$(npx wrangler d1 list --json | node scripts/find_d1_database.mjs backteststock-universe)"
          if [ -z "$database_id" ]; then
            npx wrangler d1 create backteststock-universe --location apac
            database_id="$(npx wrangler d1 list --json | node scripts/find_d1_database.mjs backteststock-universe)"
          fi
          if [ -z "$database_id" ]; then
            echo "Unable to resolve the backteststock-universe D1 database." >&2
            exit 1
          fi
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
      - name: Render production configuration
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.database_id }}
        run: node scripts/render_wrangler_config.mjs
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler d1 migrations apply backteststock-universe
          --remote --config wrangler.production.jsonc
      - name: Deploy Worker and static assets
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          output_file="$(mktemp)"
          npx wrangler deploy --config wrangler.production.jsonc 2>&1 | tee "$output_file"
          deployment_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$output_file" | tail -n 1)"
          if [ -z "$deployment_url" ]; then
            echo "Unable to determine the deployed Worker URL." >&2
            exit 1
          fi
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Smoke test production Russell 2000 flow
        env:
          WORKER_ORIGIN: ${{ steps.deploy.outputs.url }}
        run: node scripts/smoke_test_production.mjs "$WORKER_ORIGIN"
      - name: Smoke test production Portfolio v3 flow
        env:
          WORKER_ORIGIN: ${{ steps.deploy.outputs.url }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
        run: node scripts/smoke_test_portfolio_v3.mjs "$WORKER_ORIGIN"
      - name: Smoke test production Walk-Forward v1 routing
        env:
          WORKER_ORIGIN: ${{ steps.deploy.outputs.url }}
          BACKEND_ORIGIN: https://stockbacktest.vercel.app
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
        run: node scripts/smoke_test_walk_forward_v1.mjs "$WORKER_ORIGIN"
      - name: Smoke test production Refinery v1 flow
        env:
          WORKER_ORIGIN: ${{ steps.deploy.outputs.url }}
        run: node scripts/smoke_test_refinery_v1.mjs "$WORKER_ORIGIN"
      - name: Report final deployment status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${JOB_STATUS}" in
            success)
              state="success"
              description="Production deployment and smoke test succeeded"
              ;;
            cancelled)
              state="error"
              description="Production deployment was cancelled"
              ;;
            *)
              state="failure"
              description="Production deployment or smoke test failed"
              ;;
          esac
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            --data "$(printf '%s' '{"state":"'"${state}"'","context":"Cloudflare Worker","description":"'"${description}"'","target_url":"'"${STATUS_URL}"'"}')"
