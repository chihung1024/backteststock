name: One-time 4B-1 safe closeout

on:
  push:
    branches: [internal-4b1-closeout-handoff]
    paths:
      - ".github/workflows/one-time-4b1-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: internal-4b1-closeout-handoff
      - name: Prepend verified handoff without rewriting history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          handoff = Path("to_do_update_list.md")
          helper = Path(".closeout/4b1_verified_handoff_block.md")
          text = handoff.read_text(encoding="utf-8")
          block = helper.read_text(encoding="utf-8").rstrip("\n")
          title = "# BacktestStock — Live Project Status & Handoff\n"
          sentinel = "## 0. Current Operational Truth — 2026-08-17 (4B-1 CLOSED)"
          if not text.startswith(title):
              raise SystemExit("unexpected handoff title; refusing destructive rewrite")
          if not block.startswith(sentinel):
              raise SystemExit("unexpected closeout block; refusing prepend")
          if sentinel not in text:
              rest = text[len(title):]
              handoff.write_text(title + "\n" + block + "\n\n---\n" + rest, encoding="utf-8")

          marker = Path(".vercel-redeploy-trigger")
          marker_text = marker.read_text(encoding="utf-8")
          expected = "4a7-closeout-2026-08-17"
          replacement = "4b1-closeout-2026-08-17"
          if replacement not in marker_text:
              if expected not in marker_text:
                  raise SystemExit("unexpected release marker; refusing blind replacement")
              marker.write_text(marker_text.replace(expected, replacement), encoding="utf-8")
          PY
      - name: Remove one-time helpers and commit clean closeout tree
        shell: bash
        run: |
          rm .github/workflows/one-time-4b1-closeout.yml
          rm .closeout/4b1_verified_handoff_block.md
          rmdir .closeout
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close 4B-1 production handoff"
          git push origin HEAD:internal-4b1-closeout-handoff
