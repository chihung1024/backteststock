name: One-time 4B-1 safe closeout

on:
  push:
    branches: [internal-4b1-closeout-handoff]
    paths:
      - ".github/workflows/one-time-4b1-closeout.yml"

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: internal-4b1-closeout-handoff
      - name: Prepend verified 4B-1 handoff without rewriting history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          handoff = Path("to_do_update_list.md")
          text = handoff.read_text(encoding="utf-8")
          title = "# BacktestStock — Live Project Status & Handoff\n"
          if not text.startswith(title):
              raise SystemExit("unexpected to_do_update_list.md title; refusing destructive rewrite")

          sentinel = "## 0. Current Operational Truth — 2026-08-17 (4B-1 CLOSED)"
          if sentinel not in text:
              block = r'''## 0. Current Operational Truth — 2026-08-17 (4B-1 CLOSED)

> This block supersedes older operational snapshots below where they conflict. Historical sections are intentionally preserved byte-for-byte after this prepended block. Re-query mutable remote truth before important writes.

### Project Status / Stable State

```text
