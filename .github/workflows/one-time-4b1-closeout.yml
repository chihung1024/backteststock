**Phase 4B / Batch 4B-1 — Optimizer Hub Dual Momentum is CLOSED / PRODUCTION ACCEPTED.**

Primary Goal delivered: add the first user-facing Optimizer Hub vertical slice without creating a second research, PIT, Portfolio, metric, or persistence authority.

### Architecture Notes / Locked Decisions

- Dual Momentum configured ETF membership uses separately versioned `ConfiguredResearchUniverse` provenance; it does not fabricate PIT evidence.
- Existing PIT / Exhaustive Decision payload and hash semantics remain frozen and regression-tested.
- Momentum signals use only audited TWD total-return levels available inside Training; Evaluation/OOS data remains structurally absent from selection.
- Absolute momentum hurdle is applied before deterministic relative ranking; canonical symbol is the tie-break; no risky pass uses defensive fallback.
- 4B-1 allocation is equal weight only. Inverse-volatility, ERC/Risk Parity, minimum variance, maximum diversification, HRP, parameter optimization and advanced tactical allocation remain out of scope.
- Existing Walk-Forward `SelectionEngine -> DecisionSnapshot -> Evaluation -> Portfolio v3 OOS` remains the execution authority.
- Existing Portfolio v3 transaction cost and metric math remains unchanged.
- ResearchRun remains D1 durable authority; saved exact requests are rerun through the backend authority, never from browser-computed completed evidence.
- Browser renders backend-produced signal/performance evidence and does not become an authoritative calculation path.
- Production exact-SHA and fail-closed gates remain mandatory.

### Master Plan / Current Phase

```text
4A-7 Research Memory: CLOSED
4B-1 Optimizer Hub Dual Momentum: CLOSED
NEXT: select one user-facing 4B capability from verified main; preserve the 4B-1 authority seams and avoid methodology expansion inside closeout.
```

### Batch 4B-1 Change Log

Scope delivered:
- configured-request universe provenance separate from PIT authority;
- trailing calendar-month TWD total-return Momentum primitive;
- absolute filter + deterministic relative Top-K ranking + defensive fallback;
- monthly Walk-Forward schedule validation;
- equal-weight 4B-1 selection;
- additive public API selector dispatch with legacy Exhaustive backward compatibility;
- Optimizer Hub controls and backend evidence in the existing Walk-Forward workspace;
- ResearchRun save/load/rerun compatibility;
- causal, golden, API, model and browser regression coverage;
- canonical generated `public/portfolio` assets synchronized to source.

Final PR scope: 19 files. No D1 schema migration, Portfolio/metric formula rewrite, CI gate weakening, PR #147 merge, or unrelated cleanup/refactor was included.

### Root Cause Log

Candidate hardening exposed three issues, all closed at root cause:

1. **TypeScript selector union drift**
   - Symptom: Research Library naming helper assumed only the legacy Exhaustive selector shape.
   - Root Cause: UI helper was not narrowed against the new discriminated selector union.
   - Fix: explicit strategy narrowing; no persistence or quant semantics changed.
   - Regression: exact-head TypeScript/Vite, source contracts and full CI passed.

2. **Committed production asset drift**
   - Symptom: fail-closed committed-Portfolio verifier rejected the candidate.
   - Root Cause: canonical `public/portfolio` generated assets were stale relative to verified source.
   - Fix: recover exact Vite-generated outputs from CI and commit only canonical generated artifacts; temporary diagnostics/sync workflow was fully removed.
   - Regression: the original verifier remained enabled and passed on final candidate and main.

3. **Playwright strict locator drift**
   - Symptom: E2E failed on page-global exact `PASS` after the new evidence table legitimately rendered multiple PASS cells.
   - Failure Point: Playwright strict locator ambiguity.
   - Root Cause: test scope was broader than the intended QQQ risky-ranking evidence row.
   - Fix: scope assertion to the intended row/cell; product behavior was not changed.
   - Regression: exact-head and post-main full Playwright suites passed.

