name: Apply optimizer integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'feature/portfolio-optimizer-mvp' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/portfolio-optimizer-mvp
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply optimizer integration
        run: python scripts/apply_optimizer_integration.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate optimizer routes, UI entry, and CI"
          git push origin HEAD:feature/portfolio-optimizer-mvp
