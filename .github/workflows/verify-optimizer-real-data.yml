name: Verify optimizer real data

on:
  push:
    branches: [verify/optimizer-mvp-real-data]
  pull_request:
    branches: [feature/portfolio-optimizer-mvp]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      OPTIMIZER_SIGNING_SECRET: optimizer-real-data-verification-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Prepare signed real-data snapshot
        run: python scripts/verify_optimizer_real_prepare.py
      - name: Run complete proxy and 30,000-combination deep search twice
        run: node scripts/verify_optimizer_real_search.mjs
      - name: Verify 300 portfolios with the signed snapshot
        run: python scripts/verify_optimizer_real_exact.py
      - name: Show compact verification summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in (
              "optimizer-prepare-report.json",
              "optimizer-search-report.json",
              "optimizer-exact-report.json",
          ):
              payload = json.loads((Path("diagnostics") / name).read_text())
              print(f"--- {name} ---")
              print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: optimizer-real-data-verification-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
