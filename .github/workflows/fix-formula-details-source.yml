name: Fix formula details source

on:
  push:
    branches: [fix/scan-output-and-performance]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/scan-output-and-performance
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Replace formula note with native details element
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("public/scan-composite-score.js")
          text = path.read_text(encoding="utf-8")
          start = text.index("function ensureFormulaComparisonNote()")
          end = text.index("\n\nfunction removeInjectedColumns", start)
          replacement = '''function ensureFormulaComparisonNote() {
            const table = document.querySelector(TABLE_SELECTOR);
            const tableWrap = table?.closest(".table-wrap");
            if (!tableWrap) return;

            let details = document.querySelector("#score-formula-comparison");
            if (details && details.tagName !== "DETAILS") {
              details.remove();
              details = null;
            }
            if (details) return;

            details = document.createElement("details");
            details.id = "score-formula-comparison";
            details.className = "result-context score-formula-details";

            const summary = document.createElement("summary");
            summary.textContent = "分數公式與排名說明";
            const list = document.createElement("ul");
            SCORE_FORMULAS.forEach((formula) => {
              const item = document.createElement("li");
              item.textContent = `${formula.shortLabel}：${formula.description}`;
              list.append(item);
            });
            const note = document.createElement("p");
            note.textContent = "每格顯示「名次 · 分數」；排名以全部已完成且可計算標的為母體，掃描進行中會動態更新。";
            details.append(summary, list, note);
            tableWrap.insertAdjacentElement("beforebegin", details);
          }
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          Path(".github/workflows/fix-formula-details-source.yml").unlink()
          PY
      - name: Commit formula details fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Create formula comparison details in score module"
          git push origin HEAD:fix/scan-output-and-performance
