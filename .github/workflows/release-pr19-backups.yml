name: PR 19 Backup Releases

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  create-backups:
    if: contains(github.event.head_commit.message, '[release-backup:pr19]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create immutable pre- and post-merge releases
        env:
          GH_TOKEN: ${{ github.token }}
          PRE_SHA: 937a3c50a777e8fab6f52fdf567d98393eb74406
          PRE_TAG: backup-pre-pr19-20260801-0056
        run: |
          set -euo pipefail
          post_tag="backup-post-pr19-${GITHUB_SHA:0:12}"

          if ! gh release view "$PRE_TAG" >/dev/null 2>&1; then
            gh release create "$PRE_TAG" \
              --target "$PRE_SHA" \
              --title "Backup before PR #19" \
              --notes "Immutable backup of main before PR #19. Target: $PRE_SHA"
          fi

          if ! gh release view "$post_tag" >/dev/null 2>&1; then
            gh release create "$post_tag" \
              --target "$GITHUB_SHA" \
              --title "Backup after PR #19" \
              --notes "Immutable backup of main after PR #19. Target: $GITHUB_SHA"
          fi
