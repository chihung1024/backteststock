name: Portfolio web CI

on:
  pull_request:
    paths:
      - "apps/portfolio-web/**"
      - "public/portfolio/**"
      - "tests/e2e/portfolio_full_page.spec.mjs"
      - "tests/e2e/refinery_workspace.spec.mjs"
      - "tests/e2e/refinery_contract.spec.mjs"
      - "tests/test_portfolio_web_contract.mjs"
      - "tests/test_portfolio_route_bridge.mjs"
      - "tests/test_refinery_web_contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portfolio-web-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/portfolio-web/**"
      - "public/portfolio/**"
      - "tests/e2e/portfolio_full_page.spec.mjs"
      - "tests/e2e/refinery_workspace.spec.mjs"
      - "tests/e2e/refinery_contract.spec.mjs"
      - "tests/test_portfolio_web_contract.mjs"
      - "tests/test_portfolio_route_bridge.mjs"
      - "tests/test_refinery_web_contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portfolio-web-ci.yml"

permissions:
  contents: read

concurrency:
  group: portfolio-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build Portfolio app
        run: npm run check:portfolio
      - name: Test Portfolio and Refinery source contracts
        run: node --test tests/test_portfolio_web_contract.mjs tests/test_portfolio_route_bridge.mjs tests/test_refinery_web_contract.mjs
      - name: Verify committed production assets
        run: git diff --exit-code -- package-lock.json public/portfolio

  temporary_sync_generated_assets:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase4/refinery-diagnostic-ui'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SOURCE_SHA: b8ef28fec6d52f4d9e37ec4dc60b012a211023fe
      TARGET_BRANCH: phase4/refinery-diagnostic-ui
      TRIGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Guard exact source parent and remote head
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${current}" = "${TRIGGER_HEAD_SHA}"
          test "${parent}" = "${EXPECTED_SOURCE_SHA}"
          test "${remote}" = "${current}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check and deterministically rebuild Portfolio app
        run: npm run check:portfolio

      - name: Verify build changed only production assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Expected production asset changes, but build produced no diff."
            exit 1
          fi
          printf 'Generated changes:\n'
          printf '  %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "${path}" in
              package-lock.json|public/portfolio/*) ;;
              *)
                echo "Unexpected build-side change: ${path}"
                exit 1
                ;;
            esac
          done

      - name: Upload exact generated assets for audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4-refinery-scoped-css-production-assets
          path: public/portfolio
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- package-lock.json public/portfolio
          if git diff --cached --quiet; then
            echo "No generated asset diff to commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync scoped Refinery CSS production assets"

      - name: Guard target branch against races and push
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote}" = "${TRIGGER_HEAD_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
