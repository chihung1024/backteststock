name: Portfolio web CI

on:
  pull_request:
    paths:
      - "apps/portfolio-web/**"
      - "public/portfolio/**"
      - "tests/e2e/portfolio_full_page.spec.mjs"
      - "tests/e2e/refinery_workspace.spec.mjs"
      - "tests/e2e/refinery_contract.spec.mjs"
      - "tests/e2e/refinery_phase5.spec.mjs"
      - "tests/test_portfolio_web_contract.mjs"
      - "tests/test_portfolio_route_bridge.mjs"
      - "tests/test_refinery_web_contract.mjs"
      - "tests/test_refinery_phase5_web_contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portfolio-web-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/portfolio-web/**"
      - "public/portfolio/**"
      - "tests/e2e/portfolio_full_page.spec.mjs"
      - "tests/e2e/refinery_workspace.spec.mjs"
      - "tests/e2e/refinery_contract.spec.mjs"
      - "tests/e2e/refinery_phase5.spec.mjs"
      - "tests/test_portfolio_web_contract.mjs"
      - "tests/test_portfolio_route_bridge.mjs"
      - "tests/test_refinery_web_contract.mjs"
      - "tests/test_refinery_phase5_web_contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portfolio-web-ci.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply hardened P5-CORR-D convergence patch
        if: ${{ github.event.pull_request.head.ref == 'fix/phase5-correctness-convergence' }}
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python scripts/_temporary_apply_p5_corr_d2.py
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "P5-CORR-D patch already applied."
          else
            echo "$changed"
            while IFS= read -r path; do
              case "$path" in
                apps/api/app/quant/clustering.py|\
                apps/api/app/refinery/models.py|\
                apps/api/app/refinery/relationships.py|\
                apps/api/app/refinery/phase5_service.py|\
                apps/portfolio-web/src/*.ts|\
                apps/portfolio-web/src/*.tsx|\
                tests/*.py|\
                tests/*.mjs|\
                docs/research/REFINERY_CLUSTERING_V1.md|\
                docs/research/REFINERY_API_V1.md|\
                docs/research/REFINERY_UI_V1.md|\
                docs/research/PHASE5_REVIEW_AND_CONVERGENCE_PLAN.md)
                  ;;
                *)
                  echo "Unexpected P5-CORR-D path: $path" >&2
                  exit 1
                  ;;
              esac
            done <<< "$changed"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $changed
            git commit -m "docs: converge Phase 5 corrected contracts and versions"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build Portfolio app
        run: npm run check:portfolio
      - name: Test Portfolio and Refinery source contracts
        run: node --test tests/test_portfolio_web_contract.mjs tests/test_portfolio_route_bridge.mjs tests/test_refinery_web_contract.mjs tests/test_refinery_phase5_web_contract.mjs
      - name: Verify committed production assets
        run: git diff --exit-code -- package-lock.json public/portfolio
