name: Portfolio web CI

on:
  pull_request:
    paths:
      - "apps/portfolio-web/**"
      - "public/portfolio/**"
      - "tests/e2e/portfolio_full_page.spec.mjs"
      - "tests/e2e/refinery_workspace.spec.mjs"
      - "tests/e2e/refinery_contract.spec.mjs"
      - "tests/e2e/refinery_phase5.spec.mjs"
      - "tests/test_portfolio_web_contract.mjs"
      - "tests/test_portfolio_route_bridge.mjs"
      - "tests/test_refinery_web_contract.mjs"
      - "tests/test_refinery_phase5_web_contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portfolio-web-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/portfolio-web/**"
      - "public/portfolio/**"
      - "tests/e2e/portfolio_full_page.spec.mjs"
      - "tests/e2e/refinery_workspace.spec.mjs"
      - "tests/e2e/refinery_contract.spec.mjs"
      - "tests/test_portfolio_web_contract.mjs"
      - "tests/test_portfolio_route_bridge.mjs"
      - "tests/test_refinery_web_contract.mjs"
      - "tests/test_refinery_phase5_web_contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portfolio-web-ci.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply precise Wrangler advisory fix
        if: ${{ github.event.pull_request.head.ref == 'fix/phase5-correctness-convergence' }}
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          npm install --save-dev --save-exact wrangler@4.120.1
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "Wrangler advisory fix already applied."
          else
            echo "$changed"
            while IFS= read -r path; do
              case "$path" in
                package.json|package-lock.json) ;;
                *)
                  echo "Unexpected security-update path: $path" >&2
                  exit 1
                  ;;
              esac
            done <<< "$changed"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: update Wrangler to patched 4.120.1"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
      - name: Verify post-fix audit state
        shell: bash
        run: |
          npm audit --json > /tmp/audit-all.json || true
          npm audit --omit=dev --json > /tmp/audit-prod.json || true
          node <<'NODE'
          const fs = require('fs');
          for (const [label, path] of [['all','/tmp/audit-all.json'], ['prod','/tmp/audit-prod.json']]) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            console.log(`P5_SEC_POST_FIX_${label.toUpperCase()}: ${JSON.stringify(data.metadata?.vulnerabilities || {})}`);
            console.log(`P5_SEC_POST_FIX_${label.toUpperCase()}_NAMES: ${JSON.stringify(Object.keys(data.vulnerabilities || {}))}`);
          }
          NODE
          npm ls wrangler miniflare undici --all || true
      - name: Type-check and build Portfolio app
        run: npm run check:portfolio
      - name: Test Portfolio and Refinery source contracts
        run: node --test tests/test_portfolio_web_contract.mjs tests/test_portfolio_route_bridge.mjs tests/test_refinery_web_contract.mjs tests/test_refinery_phase5_web_contract.mjs
      - name: Verify committed production assets
        run: git diff --exit-code -- package-lock.json public/portfolio
