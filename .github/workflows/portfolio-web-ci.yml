name: Portfolio web CI

on:
  pull_request:
    paths:
      - "apps/portfolio-web/**"
      - "public/portfolio/**"
      - "tests/e2e/portfolio_full_page.spec.mjs"
      - "tests/e2e/refinery_workspace.spec.mjs"
      - "tests/e2e/refinery_contract.spec.mjs"
      - "tests/e2e/refinery_phase5.spec.mjs"
      - "tests/test_portfolio_web_contract.mjs"
      - "tests/test_portfolio_route_bridge.mjs"
      - "tests/test_refinery_web_contract.mjs"
      - "tests/test_refinery_phase5_web_contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portfolio-web-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/portfolio-web/**"
      - "public/portfolio/**"
      - "tests/e2e/portfolio_full_page.spec.mjs"
      - "tests/e2e/refinery_workspace.spec.mjs"
      - "tests/e2e/refinery_contract.spec.mjs"
      - "tests/e2e/refinery_phase5.spec.mjs"
      - "tests/test_portfolio_web_contract.mjs"
      - "tests/test_portfolio_route_bridge.mjs"
      - "tests/test_refinery_web_contract.mjs"
      - "tests/test_refinery_phase5_web_contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portfolio-web-ci.yml"

permissions:
  contents: read

concurrency:
  group: portfolio-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build Portfolio app
        run: npm run check:portfolio
      - name: Test Portfolio and Refinery source contracts
        run: node --test tests/test_portfolio_web_contract.mjs tests/test_portfolio_route_bridge.mjs tests/test_refinery_web_contract.mjs tests/test_refinery_phase5_web_contract.mjs
      - name: Verify committed production assets
        run: git diff --exit-code -- package-lock.json public/portfolio

  temporary_sync_phase5_ancestor_fix_assets:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase5/clustering-redundancy'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_PARENT_SHA: 154153ac776b8133b02001012078d2a82deb5647
      TARGET_BRANCH: phase5/clustering-redundancy
      TRIGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Guard exact branch state
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${current}" = "${TRIGGER_HEAD_SHA}"
          test "${parent}" = "${EXPECTED_PARENT_SHA}"
          test "${remote}" = "${current}"
      - name: Build locked Portfolio production assets
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check:portfolio
          changed="$(git diff --name-only)"
          test -n "${changed}"
          while IFS= read -r path; do
            case "${path}" in
              package-lock.json|public/portfolio/*) ;;
              *) echo "unexpected generated path: ${path}" >&2; exit 1 ;;
            esac
          done <<< "${changed}"
      - name: Commit and push deterministic assets
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote}" = "${TRIGGER_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/portfolio
          git commit -m "build: sync Phase 5 ancestor-containment assets"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
