name: Temporary Phase 4 closeout patch

on:
  push:
    branches:
      - "docs/phase4-closeout"
    paths:
      - ".github/workflows/portfolio-web-ci.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/phase4-closeout
          fetch-depth: 0

      - name: Guard exact parent and branch head
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          remote="$(git ls-remote origin refs/heads/docs/phase4-closeout | awk '{print $1}')"
          test "${current}" = "${GITHUB_SHA}"
          test "${parent}" = "443ba4159bdac54e6b033475c9cf83a459f65032"
          test "${remote}" = "${current}"

      - name: Patch roadmap
        shell: bash
        run: |
          set -euo pipefail
          python -c "import base64,zlib; exec(zlib.decompress(base64.b64decode('')).decode('utf-8'))"
          test "$(git diff --name-only)" = "to_do_update_list.md"
          git diff --check

      - name: Commit roadmap
        shell: bash
        run: |
          set -euo pipefail
          git add -- to_do_update_list.md
          git diff --cached --quiet && { echo "No roadmap change produced"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record Phase 4 closure and Phase 5 handoff"

      - name: Guard race and push
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/docs/phase4-closeout | awk '{print $1}')"
          test "${remote}" = "${GITHUB_SHA}"
          git push origin HEAD:refs/heads/docs/phase4-closeout
