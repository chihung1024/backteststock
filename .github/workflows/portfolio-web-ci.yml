name: Portfolio web CI

on:
  pull_request:
    paths:
      - "apps/portfolio-web/**"
      - "public/portfolio/**"
      - "tests/e2e/portfolio_full_page.spec.mjs"
      - "tests/e2e/refinery_workspace.spec.mjs"
      - "tests/e2e/refinery_contract.spec.mjs"
      - "tests/e2e/refinery_phase5.spec.mjs"
      - "tests/test_portfolio_web_contract.mjs"
      - "tests/test_portfolio_route_bridge.mjs"
      - "tests/test_refinery_web_contract.mjs"
      - "tests/test_refinery_phase5_web_contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portfolio-web-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/portfolio-web/**"
      - "public/portfolio/**"
      - "tests/e2e/portfolio_full_page.spec.mjs"
      - "tests/e2e/refinery_workspace.spec.mjs"
      - "tests/e2e/refinery_contract.spec.mjs"
      - "tests/e2e/refinery_phase5.spec.mjs"
      - "tests/test_portfolio_web_contract.mjs"
      - "tests/test_portfolio_route_bridge.mjs"
      - "tests/test_refinery_web_contract.mjs"
      - "tests/test_refinery_phase5_web_contract.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portfolio-web-ci.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply guarded P5-CORR-A patch
        if: ${{ github.event.pull_request.head.ref == 'fix/phase5-correctness-convergence' }}
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python scripts/_temporary_apply_p5_corr_a.py
          if git diff --quiet -- \
            apps/api/app/quant/clustering.py \
            apps/api/app/quant/__init__.py \
            apps/api/app/refinery/phase5_service.py \
            apps/api/app/refinery/relationships.py \
            apps/portfolio-web/src/refineryTypes.ts \
            tests/test_clustering.py \
            tests/test_refinery_phase5.py; then
            echo "P5-CORR-A source patch already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              apps/api/app/quant/clustering.py \
              apps/api/app/quant/__init__.py \
              apps/api/app/refinery/phase5_service.py \
              apps/api/app/refinery/relationships.py \
              apps/portfolio-web/src/refineryTypes.ts \
              tests/test_clustering.py \
              tests/test_refinery_phase5.py
            git commit -m "fix: align Phase 5 bootstrap input identity"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and build Portfolio app
        run: npm run check:portfolio
      - name: Test Portfolio and Refinery source contracts
        run: node --test tests/test_portfolio_web_contract.mjs tests/test_portfolio_route_bridge.mjs tests/test_refinery_web_contract.mjs tests/test_refinery_phase5_web_contract.mjs
      - name: Verify committed production assets
        run: git diff --exit-code -- package-lock.json public/portfolio
