name: Apply ten-year default patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ten-year-default-date-restore
      - name: Apply implementation
        run: |
          python scripts/apply_ten_year_default_patch.py
          rm -f scripts/apply_ten_year_default_patch.py
          rm -f .github/workflows/apply-ten-year-default.yml
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Default backtests to ten years and restore legacy dates"
          git push origin HEAD:fix/ten-year-default-date-restore
