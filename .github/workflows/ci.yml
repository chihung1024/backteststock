name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q api/index.py
      - name: Lint Python
        run: ruff check api/index.py tests/test_api.py
      - name: Test Python API
        run: python -m pytest -q tests/test_api.py
      - name: Check browser JavaScript
        run: node --check public/app.js
      - name: Check Worker JavaScript
        run: node --check worker/index.js
      - name: Validate JSON configuration
        run: python -m json.tool vercel.json > /dev/null
