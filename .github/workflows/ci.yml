name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify Python dependency consistency
        run: python -m pip check
      - name: Install Worker dependencies
        run: npm ci
      - name: Compile Python
        run: >-
          python -m compileall -q
          api/index.py api/index_v2.py api/metrics.py api/scan.py api/scan_v2.py
          api/screener.py api/exhaustive_optimizer.py api/portfolio_v3.py api/refinery_v1.py
          apps/api/app
          scripts/update_universes.py
      - name: Lint Python
        run: ruff check api apps scripts tests
      - name: Test Python
        run: python -m pytest -q
      - name: Check JavaScript
        run: npm run check
      - name: Test Worker
        run: npm run test:worker
      - name: Test score formulas
        run: npm run test:score
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Test browser user flow
        run: npm run test:e2e -- --reporter=line,html
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Vercel configuration
        run: python -m json.tool vercel.json > /dev/null
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply backteststock-universe --local
      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

  temporary_fix_phase5_results_grid_ancestor:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase5/clustering-redundancy'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_PARENT_SHA: b46720ac332eeadab4b59f78bf804888873b42c0
      TARGET_BRANCH: phase5/clustering-redundancy
      TRIGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Guard exact branch state
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${current}" = "${TRIGGER_HEAD_SHA}"
          test "${parent}" = "${EXPECTED_PARENT_SHA}"
          test "${remote}" = "${current}"
      - name: Patch real Phase 5 overflow ancestor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workspace = Path("apps/portfolio-web/src/RefineryWorkspace.tsx")
          text = workspace.read_text(encoding="utf-8")
          old = '<div ref={resultsRef}>{analysis && <RefineryResults response={analysis} />}</div>'
          new = '<div ref={resultsRef} className="refinery-results-shell">{analysis && <RefineryResults response={analysis} />}</div>'
          if text.count(old) != 1:
              raise SystemExit("results wrapper marker mismatch")
          workspace.write_text(text.replace(old, new, 1), encoding="utf-8")

          css = Path("apps/portfolio-web/src/refineryPhase5.css")
          text = css.read_text(encoding="utf-8")
          marker = '.refinery-workspace .refinery-phase5-card {\n'
          prefix = '''.refinery-workspace .refinery-results-shell,
          .refinery-workspace .refinery-results-stack {
            width: 100%;
            min-width: 0;
            max-width: 100%;
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit("Phase 5 CSS marker mismatch")
          css.write_text(text.replace(marker, prefix + marker, 1), encoding="utf-8")

          contract = Path("tests/test_refinery_phase5_web_contract.mjs")
          text = contract.read_text(encoding="utf-8")
          marker = 'test("Phase 5 wide tables remain contained by their own horizontal scroll region", () => {\n'
          new_test = '''test("Refinery results grid ancestors opt out of intrinsic min-content expansion", () => {
            const workspaceSource = read("apps/portfolio-web/src/RefineryWorkspace.tsx");
            assert.match(workspaceSource, /className="refinery-results-shell"/u);
            assert.match(
              phase5CssSource,
              /\\.refinery-workspace \\.refinery-results-shell,[\\s\\S]*?\\.refinery-workspace \\.refinery-results-stack\\s*\\{[^}]*width:\\s*100%;[^}]*min-width:\\s*0;[^}]*max-width:\\s*100%;/su,
            );
          });

          '''
          if text.count(marker) != 1:
              raise SystemExit("Phase 5 source-contract marker mismatch")
          contract.write_text(text.replace(marker, new_test + marker, 1), encoding="utf-8")
          PY
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' apps/portfolio-web/src/RefineryWorkspace.tsx apps/portfolio-web/src/refineryPhase5.css tests/test_refinery_phase5_web_contract.mjs | sort)"
          test "${changed}" = "${expected}"
      - name: Commit and push root-cause fix
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote}" = "${TRIGGER_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portfolio-web/src/RefineryWorkspace.tsx apps/portfolio-web/src/refineryPhase5.css tests/test_refinery_phase5_web_contract.mjs
          git commit -m "fix: contain Phase 5 results grid ancestry"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
