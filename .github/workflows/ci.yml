name: Validate Frozen Runtime

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  validate:
    if: github.event_name == 'pull_request_target'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate frozen repository target
        run: |
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}"

  finalize:
    if: github.event_name == 'push'
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete remaining non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [ "${branch}" != "main" ]; then
              git push origin --delete "${branch}"
            fi
          done
      - name: Clear Actions artifacts and caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t artifact_ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          for artifact_id in "${artifact_ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
          mapfile -t cache_ids < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" --jq '.actions_caches[].id')
          for cache_id in "${cache_ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
          done
