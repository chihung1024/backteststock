name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify Python dependency consistency
        run: python -m pip check
      - name: Install Worker dependencies
        run: npm ci
      - name: Compile Python
        run: >-
          python -m compileall -q
          api/index.py api/index_v2.py api/metrics.py api/scan.py api/scan_v2.py
          api/screener.py api/exhaustive_optimizer.py api/portfolio_v3.py api/refinery_v1.py
          apps/api/app
          scripts/update_universes.py
      - name: Lint Python
        run: ruff check api apps scripts tests
      - name: Test Python
        run: python -m pytest -q
      - name: Check JavaScript
        run: npm run check
      - name: Test Worker
        run: npm run test:worker
      - name: Test score formulas
        run: npm run test:score
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Test browser user flow
        run: npm run test:e2e -- --reporter=line,html
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Vercel configuration
        run: python -m json.tool vercel.json > /dev/null
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply backteststock-universe --local
      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

  temporary_phase5_layout_probe:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase5/clustering-redundancy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Guard probe parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d252f748a31146cf35470387b1bf29d587e45260"
      - name: Install locked dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Inject layout diagnostics into failing Phase 5 case
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("tests/e2e/refinery_phase5.spec.mjs")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?m)^\s*const overflow = await page\.evaluate\(\(\) => document\.documentElement\.scrollWidth - window\.innerWidth\);\s*\n\s*expect\(overflow\)\.toBeLessThanOrEqual\(1\);'
          )
          new = '''  const layoutDiagnostics = await page.evaluate(() => {
            const describe = (element, label) => {
              if (!element) return null;
              const rect = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              return {
                label,
                tag: element.tagName,
                className: typeof element.className === "string" ? element.className : "",
                left: rect.left,
                right: rect.right,
                width: rect.width,
                clientWidth: element.clientWidth,
                scrollWidth: element.scrollWidth,
                cssWidth: style.width,
                minWidth: style.minWidth,
                maxWidth: style.maxWidth,
                overflowX: style.overflowX,
                display: style.display,
                whiteSpace: style.whiteSpace,
                overflowWrap: style.overflowWrap,
                wordBreak: style.wordBreak,
              };
            };
            const selectors = [
              "html", "body", "#root", ".portfolio-app", ".app-main",
              ".refinery-workspace", ".refinery-results-shell", ".refinery-results-stack",
              ".refinery-phase5-card", ".refinery-phase5-card .table-scroll",
              ".refinery-cluster-table", ".refinery-redundancy-table",
              ".refinery-verdict-counts", ".refinery-window-strip", ".refinery-evidence-grid",
              ".notice", ".data-table",
            ];
            const selected = selectors.flatMap((selector) =>
              Array.from(document.querySelectorAll(selector)).map((element, index) => describe(element, `${selector}[${index}]`)),
            ).filter(Boolean);
            const overflowers = Array.from(document.querySelectorAll("body *"))
              .map((element, index) => ({ item: describe(element, `${element.tagName.toLowerCase()}#${index}`), element }))
              .filter(({ item }) => item && (item.right > window.innerWidth + 1 || item.width > window.innerWidth + 1))
              .map(({ item }) => item)
              .sort((a, b) => b.right - a.right)
              .slice(0, 40);
            return {
              viewport: window.innerWidth,
              documentClientWidth: document.documentElement.clientWidth,
              documentScrollWidth: document.documentElement.scrollWidth,
              bodyClientWidth: document.body.clientWidth,
              bodyScrollWidth: document.body.scrollWidth,
              selected,
              overflowers,
            };
          });
          console.log("PHASE5_LAYOUT_DIAGNOSTICS=" + JSON.stringify(layoutDiagnostics));
          const overflow = layoutDiagnostics.documentScrollWidth - layoutDiagnostics.viewport;
          expect(overflow).toBeLessThanOrEqual(1);'''
          updated, count = pattern.subn(new, text, count=1)
          if count != 1:
              raise SystemExit(f"layout assertion regex mismatch: {count}")
          path.write_text(updated, encoding="utf-8")
          PY
      - name: Run targeted Phase 5 100-candidate layout probe
        run: npx playwright test tests/e2e/refinery_phase5.spec.mjs --grep "100-candidate" --reporter=line
