name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify Python dependency consistency
        run: python -m pip check
      - name: Install Worker dependencies
        run: npm ci
      - name: Compile Python
        run: >-
          python -m compileall -q
          api/index.py api/index_v2.py api/metrics.py api/scan.py api/scan_v2.py
          api/screener.py api/exhaustive_optimizer.py api/portfolio_v3.py api/refinery_v1.py
          apps/api/app
          scripts/update_universes.py
      - name: Lint Python
        run: ruff check api apps scripts tests
      - name: Test Python
        run: python -m pytest -q
      - name: Check JavaScript
        run: npm run check
      - name: Test Worker
        run: npm run test:worker
      - name: Test score formulas
        run: npm run test:score
      - name: Type-check and build Portfolio app
        run: npm run check:portfolio
      - name: Test Portfolio and Refinery source contracts
        run: node --test tests/test_portfolio_web_contract.mjs tests/test_portfolio_route_bridge.mjs tests/test_refinery_web_contract.mjs tests/test_refinery_phase5_web_contract.mjs tests/test_refinery_phase6_web_contract.mjs
      - name: One-time sync generated Portfolio assets for PR 170
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 170 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/optimizer-hub-dual-momentum' }}
        shell: bash
        run: |
          set -euo pipefail
          generated_dir="$(mktemp -d)"
          cp -a public/portfolio "$generated_dir/portfolio"
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          rm -rf public/portfolio
          mkdir -p public
          cp -a "$generated_dir/portfolio" public/portfolio
          git show 8c01699561c9e606fe5dc1e6e6543ad8279b5d8e:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/portfolio .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "No generated asset changes to sync."
            exit 0
          fi
          git commit -m "chore: sync Portfolio production assets"
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Verify committed Portfolio production assets
        run: git diff --exit-code -- package-lock.json public/portfolio
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Test browser user flow
        run: npm run test:e2e -- --reporter=line,html
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            public/portfolio/
            package-lock.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Vercel configuration
        run: python -m json.tool vercel.json > /dev/null
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply backteststock-universe --local
      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
