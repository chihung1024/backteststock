name: Validate Frozen Runtime

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate frozen runtime structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          required = [
              'README.md', 'requirements.txt', 'package.json', 'vercel.json',
              'wrangler.jsonc', 'api', 'apps/api/app', 'migrations', 'public',
              'scripts/exhaustive_selection_authority.mjs', 'worker',
          ]
          forbidden = [
              '.dev.vars.example', 'AGENTS.md', 'to_do_update_list.md', 'docs',
              'tests', 'apps/api/tests', 'apps/portfolio-web',
              'requirements-dev.txt', 'playwright.config.mjs',
          ]
          missing = [path for path in required if not Path(path).exists()]
          present = [path for path in forbidden if Path(path).exists()]
          maps = list(Path('public').rglob('*.map'))
          if missing or present or maps:
              raise SystemExit(
                  f'frozen runtime structure invalid: missing={missing}, '
                  f'forbidden_present={present}, sourcemaps={[str(p) for p in maps]}'
              )
          json.loads(Path('package.json').read_text())
          json.loads(Path('vercel.json').read_text())
          PY
      - name: Syntax-check production Python
        run: python -m compileall -q api apps/api/app scripts/update_universes.py
      - name: Syntax-check production JavaScript
        run: |
          find worker public scripts api -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check
      - name: Validate Universe updater parsing and safety rules
        run: |
          node --input-type=module <<'JS'
          import {
            normalizeTicker,
            isoDate,
            parseCsv,
            parseIsharesCsv,
            parseNasdaqGiwJson,
            validateSnapshot,
          } from './worker/universe_updater.js';
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          assert(normalizeTicker('BRK.B') === 'BRK-B', 'ticker normalization');
          assert(isoDate('Aug 18, 2026') === '2026-08-18', 'source date parsing');
          const rows = parseCsv('"a","b"\n"x,y","z"\n');
          assert(rows[1][0] === 'x,y', 'quoted CSV parsing');
          const csv = 'Fund Holdings as of,"Aug 18, 2026"\nmeta\nTicker,Name,Sector,Asset Class,Weight (%),Market Value\nAAPL,Apple,Technology,Equity,5.1,"1,234"\nUSD,Cash,,Cash,0,2\n';
          const parsed = parseIsharesCsv(csv);
          assert(parsed.sourceAsOf === '2026-08-18', 'iShares date');
          assert(parsed.members.length === 1, 'iShares equity filter');
          assert(parsed.members[0].marketValue === 1234, 'iShares numeric field');
          const giw = parseNasdaqGiwJson(
            { iTotalRecords: 1, aaData: [{ Symbol: 'MSFT', Name: 'Microsoft' }] },
            '2026-08-18',
          );
          assert(giw.members[0].ticker === 'MSFT', 'Nasdaq GIW parsing');
          validateSnapshot(
            { id: 'sample', minMembers: 1, maxMembers: 2, maxCountChangeRatio: 1, maxMembershipChurnRatio: 1 },
            parsed.members,
            new Set(['AAPL']),
          );
          JS
      - name: Validate Worker bundle and Cron configuration
        run: |
          npm ci
          npx wrangler deploy --dry-run
      - name: Prove production Cron refreshed all Universe snapshots
        run: |
          node --input-type=module <<'JS'
          const endpoint = 'https://backteststock.chired.workers.dev/api/v2/universes';
          const deployedAfter = Date.parse('2026-08-19T12:39:23Z');
          const expected = new Set(['sp500', 'nasdaq100', 'soxx', 'russell2000']);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          for (let attempt = 1; attempt <= 30; attempt += 1) {
            const response = await fetch(endpoint, {
              headers: { accept: 'application/json' },
              signal: AbortSignal.timeout(15_000),
            });
            if (!response.ok) throw new Error(`Universe catalog HTTP ${response.status}`);
            const payload = await response.json();
            const rows = Array.isArray(payload?.data) ? payload.data : [];
            const byId = new Map(rows.map((row) => [row.id, row]));
            const evidence = [...expected].map((id) => ({
              id,
              fetchedAt: byId.get(id)?.fetchedAt || null,
              version: byId.get(id)?.version || null,
              memberCount: byId.get(id)?.memberCount ?? null,
            }));
            console.log(JSON.stringify({ attempt, evidence }));
            const refreshed = evidence.every(({ id, fetchedAt, memberCount }) => (
              expected.has(id)
              && Number.isFinite(Date.parse(fetchedAt || ''))
              && Date.parse(fetchedAt) > deployedAfter
              && Number(memberCount) > 0
            ));
            if (refreshed) {
              console.log('Production Cloudflare Cron independently refreshed all four Universe snapshots.');
              process.exit(0);
            }
            if (attempt < 30) await sleep(20_000);
          }
          throw new Error('Cloudflare Cron did not refresh all four Universe snapshots after the scheduled-entry deployment.');
          JS
