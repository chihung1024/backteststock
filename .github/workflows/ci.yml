name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify Python dependency consistency
        run: python -m pip check
      - name: Install Worker dependencies
        run: npm ci
      - name: Compile Python
        run: >-
          python -m compileall -q
          api/index.py api/index_v2.py api/metrics.py api/scan.py api/scan_v2.py
          api/screener.py api/exhaustive_optimizer.py api/portfolio_v3.py api/refinery_v1.py
          apps/api/app
          scripts/update_universes.py
      - name: Lint Python
        run: ruff check api apps scripts tests
      - name: Test Python
        run: python -m pytest -q
      - name: Check JavaScript
        run: npm run check
      - name: Test Worker
        run: npm run test:worker
      - name: Verify generated Worker bindings
        run: npm run types:check
      - name: Test score formulas
        run: npm run test:score
      - name: Type-check and build Portfolio app
        run: npm run check:portfolio
      - name: Test Portfolio and Refinery source contracts
        run: node --test tests/test_portfolio_web_contract.mjs tests/test_portfolio_route_bridge.mjs tests/test_refinery_web_contract.mjs tests/test_refinery_phase5_web_contract.mjs tests/test_refinery_phase6_web_contract.mjs
      - name: Verify committed Portfolio production assets
        run: node scripts/verify_portfolio_assets.mjs
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Test browser user flow
        run: npm run test:e2e -- --reporter=line,html
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Vercel configuration
        run: python -m json.tool vercel.json > /dev/null
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply backteststock-universe --local
      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
