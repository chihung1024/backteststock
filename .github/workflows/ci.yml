name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify Python dependency consistency
        run: python -m pip check
      - name: Install Worker dependencies
        run: npm ci
      - name: Compile Python
        run: >-
          python -m compileall -q
          api/index.py api/index_v2.py api/metrics.py api/scan.py api/scan_v2.py
          api/screener.py api/exhaustive_optimizer.py api/portfolio_v3.py api/refinery_v1.py
          apps/api/app
          scripts/update_universes.py
      - name: Lint Python
        run: ruff check api apps scripts tests
      - name: Test Python
        run: python -m pytest -q
      - name: Check JavaScript
        run: npm run check
      - name: Test Worker
        run: npm run test:worker
      - name: Test score formulas
        run: npm run test:score
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Test browser user flow
        run: npm run test:e2e -- --reporter=line,html
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Vercel configuration
        run: python -m json.tool vercel.json > /dev/null
      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply backteststock-universe --local
      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

  temporary_patch_phase5_permutation_test:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase5/clustering-redundancy'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_PARENT_SHA: 956c6383a7e32e683a05f12447e0d2c20848f791
      TARGET_BRANCH: phase5/clustering-redundancy
      TRIGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Guard exact branch state
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${current}" = "${TRIGGER_HEAD_SHA}"
          test "${parent}" = "${EXPECTED_PARENT_SHA}"
          test "${remote}" = "${current}"
      - name: Patch permutation-equivalence assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_refinery_phase5.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert original["clustering"] == permuted["clustering"]
              assert original["redundancy"] == permuted["redundancy"]
              assert original["clustering"]["bootstrap_seed_fingerprint"] == (
                  permuted["clustering"]["bootstrap_seed_fingerprint"]
              )
          '''
          new = '''    assert original["clustering"] == permuted["clustering"]
              assert original["redundancy"]["status"] == permuted["redundancy"]["status"]
              assert original["redundancy"]["counts"] == permuted["redundancy"]["counts"]
              assert original["redundancy"]["verdict_semantics"] == (
                  permuted["redundancy"]["verdict_semantics"]
              )
              assert original["redundancy"]["magic_numeric_score"] is False

              original_pairs = {
                  (item["symbol_a"], item["symbol_b"]): item
                  for item in original["redundancy"]["pairs"]
              }
              permuted_pairs = {
                  (item["symbol_a"], item["symbol_b"]): item
                  for item in permuted["redundancy"]["pairs"]
              }
              assert original_pairs.keys() == permuted_pairs.keys()
              numeric_fields = {
                  "structural_correlation",
                  "medium_correlation",
                  "downside_correlation",
                  "stress_correlation",
                  "factor_implied_correlation",
                  "window_cocluster_agreement",
                  "bootstrap_cocluster_probability",
              }
              for pair_key in original_pairs:
                  left = original_pairs[pair_key]
                  right = permuted_pairs[pair_key]
                  assert {
                      key: value for key, value in left.items() if key not in numeric_fields
                  } == {
                      key: value for key, value in right.items() if key not in numeric_fields
                  }
                  for field in numeric_fields:
                      left_value = left[field]
                      right_value = right[field]
                      if left_value is None or right_value is None:
                          assert left_value is right_value
                      else:
                          assert np.isclose(
                              left_value,
                              right_value,
                              rtol=1e-12,
                              atol=1e-15,
                          )

              assert original["clustering"]["bootstrap_seed_fingerprint"] == (
                  permuted["clustering"]["bootstrap_seed_fingerprint"]
              )
          '''
          if text.count(old) != 1:
              raise SystemExit("permutation assertion marker mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          changed="$(git diff --name-only)"
          test "${changed}" = "tests/test_refinery_phase5.py"
      - name: Commit and push test-only fix
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote}" = "${TRIGGER_HEAD_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_refinery_phase5.py
          git commit -m "test: compare permutation evidence with numerical tolerance"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
