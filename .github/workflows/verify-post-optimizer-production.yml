name: Verify post-merge optimizer production

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-post-optimizer-production.yml
      - scripts/verify_post_optimizer_production.py
      - scripts/verify_post_optimizer_search.mjs

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: ${{ github.workspace }}
      VERCEL_GIT_COMMIT_SHA: 1ed3c720551ce44c1ce18e6a5f1748eeaa49f1a6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
      - name: Verify pages and prepare signed production snapshot
        run: python scripts/verify_post_optimizer_production.py prepare
      - name: Run balanced 30,000 search twice
        run: node scripts/verify_post_optimizer_search.mjs
      - name: Verify exact results and snapshot-only reproducibility
        run: python scripts/verify_post_optimizer_production.py exact
      - name: Write compact final report
        run: python scripts/verify_post_optimizer_production.py summary
      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: post-optimizer-production-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 3
