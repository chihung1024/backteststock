name: Verify post-merge optimizer production

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-post-optimizer-production.yml

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORIGIN: https://backteststock.chired.workers.dev
      PYTHONPATH: ${{ github.workspace }}
      VERCEL_GIT_COMMIT_SHA: 1ed3c720551ce44c1ce18e6a5f1748eeaa49f1a6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install exact dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Verify production pages and optimizer assets
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          curl --location --fail-with-body --silent --show-error --retry 3 \
            --dump-header diagnostics/home.headers \
            --write-out '%{http_code}\t%{url_effective}\t%{size_download}\n' \
            "$ORIGIN/" -o diagnostics/home.html | tee diagnostics/home.probe
          curl --location --fail-with-body --silent --show-error --retry 3 \
            --dump-header diagnostics/optimizer.headers \
            --write-out '%{http_code}\t%{url_effective}\t%{size_download}\n' \
            "$ORIGIN/optimizer.html" -o diagnostics/optimizer.html | tee diagnostics/optimizer.probe
          grep -E '^200[[:space:]]' diagnostics/home.probe
          grep -E '^200[[:space:]]' diagnostics/optimizer.probe
          test -s diagnostics/home.html
          test -s diagnostics/optimizer.html
          grep -F 'id="open-optimizer"' diagnostics/home.html
          grep -F 'href="/optimizer.html"' diagnostics/home.html
          grep -F '五目標平衡搜尋（無單一主要目標）' diagnostics/optimizer.html
          grep -F '300 組（5×48 + 60）' diagnostics/optimizer.html
          grep -F '/optimizer.js?v=20260802.3' diagnostics/optimizer.html
          grep -F '/ui-enhancements.js?v=20260802.3' diagnostics/optimizer.html
          grep -F '/optimizer-ui-hardening.js?v=20260802.3' diagnostics/optimizer.html
          for asset in \
            optimizer.js \
            optimizer-worker.js \
            optimizer-balanced-worker.js \
            ui-enhancements.js \
            optimizer-ui-hardening.js \
            optimizer.css; do
            curl --location --fail-with-body --silent --show-error --retry 3 \
              "$ORIGIN/$asset" -o "diagnostics/$asset"
            test -s "diagnostics/$asset"
          done
          grep -F 'const EXACT_OBJECTIVE_QUOTA = 48;' diagnostics/optimizer-balanced-worker.js
          grep -F 'const EXACT_DIVERSITY_QUOTA = 60;' diagnostics/optimizer-balanced-worker.js
          grep -F 'const BALANCED_WORKER_URL' diagnostics/optimizer-ui-hardening.js
          sha256sum diagnostics/optimizer.html diagnostics/*.js diagnostics/optimizer.css \
            | tee diagnostics/production-assets.sha256

      - name: Prepare production signed snapshot with strict 70/30 coverage
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import gzip
          import json
          import math
          import time
          from pathlib import Path

          import requests

          origin = "https://backteststock.chired.workers.dev"
          tickers = [
              "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL",
              "META", "AVGO", "TSLA", "JPM", "WMT",
              "COST", "LLY", "XOM", "V", "MA",
              "HD", "NFLX", "ORCL", "AMD", "CSCO",
          ]
          start_date = "2016-08-01"
          end_date = "2026-07-31"
          benchmark = "SPY"

          def post(path: str, payload: dict, timeout: int = 300):
              last = None
              for attempt in range(1, 5):
                  started = time.perf_counter()
                  response = requests.post(
                      origin + path,
                      json=payload,
                      timeout=timeout,
                      headers={"User-Agent": "backteststock-post-merge-verification/2"},
                  )
                  elapsed = time.perf_counter() - started
                  try:
                      body = response.json()
                  except Exception:
                      body = {"raw": response.text[:2000]}
                  if response.status_code == 200:
                      return body, elapsed, dict(response.headers)
                  last = (response.status_code, body, elapsed)
                  if response.status_code not in (429, 500, 502, 503, 504):
                      break
                  time.sleep(5 * attempt)
              raise RuntimeError(f"{path} failed: {last}")

          calendar, calendar_seconds, calendar_headers = post(
              "/api/optimizer/calendar",
              {
                  "startDate": start_date,
                  "endDate": end_date,
                  "benchmark": benchmark,
                  "trainingRatio": 0.70,
              },
          )
          total = calendar["trainingObservations"] + calendar["validationObservations"]
          assert calendar["trainingRatio"] == 0.70
          assert calendar["trainingObservations"] == math.floor(total * 0.70)
          assert calendar["benchmark"] == benchmark
          assert calendar["benchmarkCorporateActionAudit"]["status"] == "verified_standard_actions"

          prepared, prepare_seconds, prepare_headers = post(
              "/api/optimizer/prepare",
              {
                  "startDate": start_date,
                  "endDate": end_date,
                  "benchmark": benchmark,
                  "trainingRatio": 0.70,
                  "trainingEnd": calendar["trainingEnd"],
                  "candidateTickers": tickers,
                  "candidateSelection": {
                      "mode": "post_merge_production_verification",
                      "rankingField": "sortino_ratio",
                      "sourceTickerCount": len(tickers),
                      "finalCandidateCount": 20,
                  },
              },
          )
          envelope = prepared["snapshot"]
          raw = gzip.decompress(base64.b64decode(envelope["data"], validate=True))
          snapshot = json.loads(raw)
          assert snapshot["candidateTickers"] == tickers
          assert snapshot["benchmark"] == benchmark
          assert snapshot["split"]["trainingObservations"] == calendar["trainingObservations"]
          assert snapshot["split"]["validationObservations"] == calendar["validationObservations"]
          assert snapshot["trainingRatio"] == 0.70
          assert len(snapshot["dates"]) == total
          assert envelope["datasetHash"] and envelope["signature"]
          assert envelope["signatureMode"].startswith("hmac-sha256")
          assert snapshot["dataSourceSettings"] == {
              "interval": "1d",
              "auto_adjust": False,
              "repair": True,
              "actions": True,
              "keepna": False,
          }
          required = [*tickers, benchmark]
          statuses = prepared["summary"]["corporateActionStatus"]
          assert all(statuses[ticker] == "verified_standard_actions" for ticker in required)
          coverage = prepared["summary"]["dataCoverageAudit"]
          for ticker in required:
              assert coverage[ticker]["training"] >= 0.98, (ticker, coverage[ticker])
              assert coverage[ticker]["validation"] >= 0.98, (ticker, coverage[ticker])
          assert coverage["_global_complete_case"]["training"] >= 0.98
          assert coverage["_global_complete_case"]["validation"] >= 0.98
          assert len(snapshot["priceFingerprints"]) == 21

          report = {
              "calendarSeconds": calendar_seconds,
              "prepareSeconds": prepare_seconds,
              "requestedStart": start_date,
              "requestedEnd": end_date,
              "observations": total,
              "trainingObservations": calendar["trainingObservations"],
              "validationObservations": calendar["validationObservations"],
              "trainingStart": calendar["trainingStart"],
              "trainingEnd": calendar["trainingEnd"],
              "validationStart": calendar["validationStart"],
              "validationEnd": calendar["validationEnd"],
              "candidateCount": len(tickers),
              "benchmark": benchmark,
              "compressedBytes": envelope["compressedBytes"],
              "uncompressedBytes": envelope["uncompressedBytes"],
              "datasetHash": envelope["datasetHash"],
              "signatureMode": envelope["signatureMode"],
              "optimizerAlgorithmVersion": snapshot["optimizerAlgorithmVersion"],
              "metricDefinitionVersion": snapshot["metricDefinitionVersion"],
              "marketDataContractVersion": snapshot["marketDataContractVersion"],
              "allCorporateActionsVerified": True,
              "strictCoverageVerified": True,
              "dataSourceSettings": snapshot["dataSourceSettings"],
              "calendarResponseVersion": calendar_headers.get("X-Optimizer-Algorithm-Version"),
              "prepareResponseVersion": prepare_headers.get("X-Optimizer-Algorithm-Version"),
          }
          Path("diagnostics/production-prepared.json").write_text(
              json.dumps(prepared, ensure_ascii=False), encoding="utf-8"
          )
          Path("diagnostics/production-snapshot.json").write_text(
              json.dumps(snapshot, ensure_ascii=False), encoding="utf-8"
          )
          Path("diagnostics/production-prepare-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Run balanced 30,000 search twice and select exact 300
        run: |
          node <<'NODE'
          import { createHash } from "node:crypto";
          import { performance } from "node:perf_hooks";
          import { readFile, writeFile } from "node:fs/promises";
          import { optimizeSnapshot } from "./public/optimizer-worker.js";
          import {
            balancedSearchPlan,
            selectBalancedCombinations,
          } from "./public/optimizer-balanced-worker.js";

          const snapshot = JSON.parse(await readFile("diagnostics/production-snapshot.json", "utf8"));
          const objectives = ["sortino_ratio", "cagr", "mdd_abs", "beta_abs", "alpha"];
          const plan = balancedSearchPlan(30_000);
          const expectedPlan = {
            total: 30_000,
            objectives: {
              sortino_ratio: 5_400,
              cagr: 5_400,
              mdd_abs: 5_400,
              beta_abs: 5_400,
              alpha: 5_400,
            },
            pareto_diversity: 3_000,
          };
          if (JSON.stringify(plan) !== JSON.stringify(expectedPlan)) {
            throw new Error(`balanced plan mismatch: ${JSON.stringify(plan)}`);
          }

          function hashMasks(masks) {
            const bytes = Buffer.alloc(masks.length * 4);
            masks.forEach((mask, index) => bytes.writeUInt32LE(mask >>> 0, index * 4));
            return createHash("sha256").update(bytes).digest("hex");
          }

          async function runOnce(label) {
            const started = performance.now();
            const definitions = [
              ...objectives.map((objective) => ({
                sourceRun: `objective:${objective}`,
                primaryObjective: objective,
                searchBudget: plan.objectives[objective],
              })),
              {
                sourceRun: "pareto_diversity",
                primaryObjective: "sortino_ratio",
                searchBudget: plan.pareto_diversity,
              },
            ];
            const childRuns = [];
            for (const definition of definitions) {
              const childStarted = performance.now();
              const result = await optimizeSnapshot({
                snapshot,
                settings: {
                  primaryObjective: definition.primaryObjective,
                  searchBudget: definition.searchBudget,
                },
              });
              if (result.search.deepCombinationCount !== definition.searchBudget) {
                throw new Error(`${definition.sourceRun} deep budget mismatch`);
              }
              if (new Set(result.search.evaluatedMasks).size !== definition.searchBudget) {
                throw new Error(`${definition.sourceRun} unique deep masks mismatch`);
              }
              childRuns.push({
                ...definition,
                elapsedSeconds: (performance.now() - childStarted) / 1000,
                result,
              });
            }
            const sourceRecords = childRuns.flatMap(({ sourceRun, result }) => (
              result.combinations.map((record) => ({ ...record, sourceRun }))
            ));
            const selected = selectBalancedCombinations(sourceRecords);
            const selectedMasks = selected.records.map((record) => Number(record.mask) >>> 0);
            const evaluatedMasks = [...new Set(
              childRuns.flatMap(({ result }) => result.search.evaluatedMasks),
            )].map((mask) => Number(mask) >>> 0).sort((a, b) => a - b);
            return {
              label,
              elapsedSeconds: (performance.now() - started) / 1000,
              combinations: selected.records.map((record, index) => ({
                combinationId: `optimizer-${String(index + 1).padStart(3, "0")}`,
                mask: Number(record.mask) >>> 0,
                tickers: record.tickers,
                selectionSource: record.selectionSource,
                approximateTrainingMetrics: record.approximateTrainingMetrics,
              })),
              exactAllocation: selected.allocation,
              sourcePoolCount: selected.sourcePoolCount,
              selectedMaskHash: hashMasks(selectedMasks),
              evaluatedMaskHash: hashMasks(evaluatedMasks),
              uniqueEvaluatedMasks: evaluatedMasks.length,
              childRuns: childRuns.map((run) => ({
                sourceRun: run.sourceRun,
                primaryObjective: run.primaryObjective,
                searchBudget: run.searchBudget,
                elapsedSeconds: run.elapsedSeconds,
                evaluatedMaskHash: run.result.search.evaluatedMaskHash,
                randomSeed: run.result.search.randomSeed,
              })),
            };
          }

          const first = await runOnce("first");
          const second = await runOnce("second");
          const deterministic = (
            first.selectedMaskHash === second.selectedMaskHash
            && first.evaluatedMaskHash === second.evaluatedMaskHash
            && JSON.stringify(first.combinations.map((item) => item.mask))
              === JSON.stringify(second.combinations.map((item) => item.mask))
            && JSON.stringify(first.childRuns.map((item) => item.randomSeed))
              === JSON.stringify(second.childRuns.map((item) => item.randomSeed))
          );
          const expectedExact = {
            requested: {
              sortino_ratio: 48,
              cagr: 48,
              mdd_abs: 48,
              beta_abs: 48,
              alpha: 48,
              pareto_diversity: 60,
            },
            actual: {
              sortino_ratio: 48,
              cagr: 48,
              mdd_abs: 48,
              beta_abs: 48,
              alpha: 48,
              pareto_diversity: 60,
            },
          };
          if (!deterministic) throw new Error("balanced search is not deterministic");
          if (first.combinations.length !== 300 || new Set(first.combinations.map((x) => x.mask)).size !== 300) {
            throw new Error("exact selection is not 300 unique combinations");
          }
          if (JSON.stringify(first.exactAllocation) !== JSON.stringify(expectedExact)) {
            throw new Error(`exact allocation mismatch: ${JSON.stringify(first.exactAllocation)}`);
          }
          const report = {
            searchPlan: plan,
            firstElapsedSeconds: first.elapsedSeconds,
            secondElapsedSeconds: second.elapsedSeconds,
            deterministic,
            exactCount: first.combinations.length,
            exactAllocation: first.exactAllocation,
            sourcePoolCount: first.sourcePoolCount,
            selectedMaskHash: first.selectedMaskHash,
            evaluatedMaskHash: first.evaluatedMaskHash,
            uniqueEvaluatedMasks: first.uniqueEvaluatedMasks,
            childRuns: first.childRuns,
          };
          await writeFile(
            "diagnostics/production-search-output.json",
            `${JSON.stringify({ combinations: first.combinations, report })}\n`,
          );
          await writeFile(
            "diagnostics/production-search-report.json",
            `${JSON.stringify(report, null, 2)}\n`,
          );
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Verify exact production results and snapshot-only reproducibility
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import math
          import time
          from pathlib import Path

          import requests

          from api import optimizer

          origin = "https://backteststock.chired.workers.dev"
          prepared = json.loads(Path("diagnostics/production-prepared.json").read_text())
          snapshot = json.loads(Path("diagnostics/production-snapshot.json").read_text())
          search = json.loads(Path("diagnostics/production-search-output.json").read_text())
          combinations = search["combinations"]
          settings = {"bandRatio": 0.20, "transactionCostBps": 0}

          def post_verify(items):
              last = None
              for attempt in range(1, 4):
                  started = time.perf_counter()
                  response = requests.post(
                      origin + "/api/optimizer/verify",
                      json={
                          "snapshot": prepared["snapshot"],
                          "settings": settings,
                          "combinations": items,
                      },
                      timeout=300,
                      headers={"User-Agent": "backteststock-post-merge-verification/2"},
                  )
                  elapsed = time.perf_counter() - started
                  try:
                      payload = response.json()
                  except Exception:
                      payload = {"raw": response.text[:2000]}
                  if response.status_code == 200:
                      return payload, elapsed
                  last = (response.status_code, payload, elapsed)
                  if response.status_code not in (429, 500, 502, 503, 504):
                      break
                  time.sleep(5 * attempt)
              raise RuntimeError(f"production verify failed: {last}")

          started_all = time.perf_counter()
          payload, production_seconds = post_verify(combinations)
          results = payload["results"]
          metadata = payload["metadata"]
          total_seconds = time.perf_counter() - started_all
          assert len(results) == 300
          assert len({row["mask"] for row in results}) == 300
          assert metadata["verified_combinations"] == 300
          assert metadata["dataset_hash"] == prepared["snapshot"]["datasetHash"]
          assert metadata["rebalance_band_ratio"] == 0.20
          assert metadata["trigger_lower_bound"] == 0.08
          assert metadata["trigger_upper_bound"] == 0.12
          assert metadata["execution_delay_trading_days"] == 1
          assert metadata["execution_price"] == "next_common_trading_day_adjusted_close"
          assert metadata["turnover_definition"] == "gross_notional_and_one_way"
          assert metadata["price_fingerprints"] == snapshot["priceFingerprints"]

          finite_keys = (
              "total_return", "cagr", "mdd", "volatility", "sharpe_ratio",
              "sortino_ratio", "beta", "alpha", "annualizedTurnoverOneWay",
              "transactionCost", "turnoverGross", "turnoverOneWay",
          )
          for row in results:
              assert len(row["tickers"]) == 10 and len(set(row["tickers"])) == 10
              for period in ("training", "validation"):
                  metrics = row[period]
                  for key in finite_keys:
                      value = metrics[key]
                      assert isinstance(value, (int, float)) and math.isfinite(value), (period, key, value)
                  assert isinstance(metrics["rebalanceCount"], int) and metrics["rebalanceCount"] >= 0
                  assert metrics["portfolioValueFingerprint"]

          repeat_payload, repeat_seconds = post_verify([combinations[0]])
          repeat = repeat_payload["results"][0]
          first = results[0]
          for period in ("training", "validation"):
              assert repeat[period]["portfolioValueFingerprint"] == first[period]["portfolioValueFingerprint"]
          assert repeat["training"]["sortino_ratio"] == first["training"]["sortino_ratio"]
          assert repeat["validation"]["cagr"] == first["validation"]["cagr"]

          def forbidden_download(*_args, **_kwargs):
              raise AssertionError("verify attempted a second market download")

          optimizer.app.config.update(TESTING=True)
          optimizer._download_common_prices = forbidden_download
          client = optimizer.app.test_client()
          local_started = time.perf_counter()
          local_response = client.post(
              "/api/optimizer/verify",
              json={
                  "snapshot": prepared["snapshot"],
                  "settings": settings,
                  "combinations": combinations,
              },
          )
          local_seconds = time.perf_counter() - local_started
          assert local_response.status_code == 200, local_response.get_json()
          local_results = local_response.get_json()["results"]
          assert len(local_results) == 300
          production_by_id = {row["combinationId"]: row for row in results}
          for local_row in local_results:
              production_row = production_by_id[local_row["combinationId"]]
              for period in ("training", "validation"):
                  assert local_row[period]["portfolioValueFingerprint"] == production_row[period]["portfolioValueFingerprint"]
                  for key in (
                      "sortino_ratio", "cagr", "mdd", "beta", "alpha",
                      "annualizedTurnoverOneWay", "rebalanceCount",
                  ):
                      assert local_row[period][key] == production_row[period][key], (
                          local_row["combinationId"], period, key
                      )

          report = {
              "productionExactSeconds": production_seconds,
              "productionTotalSeconds": total_seconds,
              "repeatSeconds": repeat_seconds,
              "localSnapshotOnlySeconds": local_seconds,
              "resultCount": len(results),
              "uniqueMasks": len({row["mask"] for row in results}),
              "datasetHash": metadata["dataset_hash"],
              "sameSignedSnapshotUsed": True,
              "marketDownloadDuringVerify": False,
              "productionMatchesLocalSnapshotOnly": True,
              "deterministicExact": True,
              "allTrainingFinite": True,
              "allValidationFinite": True,
              "totalTrainingRebalances": sum(row["training"]["rebalanceCount"] for row in results),
              "totalValidationRebalances": sum(row["validation"]["rebalanceCount"] for row in results),
              "trainingFingerprintSample": first["training"]["portfolioValueFingerprint"],
              "validationFingerprintSample": first["validation"]["portfolioValueFingerprint"],
              "rebalanceBandRatio": metadata["rebalance_band_ratio"],
              "triggerLowerBound": metadata["trigger_lower_bound"],
              "triggerUpperBound": metadata["trigger_upper_bound"],
              "executionDelayTradingDays": metadata["execution_delay_trading_days"],
              "turnoverDefinition": metadata["turnover_definition"],
          }
          Path("diagnostics/production-exact-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Write compact final report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = {
              "mergeSha": "1ed3c720551ce44c1ce18e6a5f1748eeaa49f1a6",
              "backupBranch": "release-backup/post-optimizer-manual-30-sortable-20260802T0355Z",
              "productionOrigin": "https://backteststock.chired.workers.dev",
              "prepare": json.loads(Path("diagnostics/production-prepare-report.json").read_text()),
              "search": json.loads(Path("diagnostics/production-search-report.json").read_text()),
              "exact": json.loads(Path("diagnostics/production-exact-report.json").read_text()),
              "persistentDailyPriceDatabase": False,
          }
          Path("diagnostics/post-optimizer-production-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n"
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v6
        if: ${{ always() }}
        with:
          name: post-optimizer-production-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 3
