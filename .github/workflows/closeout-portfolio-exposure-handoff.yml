name: Close Portfolio Exposure Handoff

on:
  push:
    branches:
      - feat/portfolio-weight-defined-exposure
    paths:
      - .github/workflows/closeout-portfolio-exposure-handoff.yml

permissions:
  contents: write

jobs:
  update-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update current handoff and preserve historical appendix
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('to_do_update_list.md')
          text = path.read_text()
          marker = '\n---\n\n# Historical Execution Record — Batch 4A-5\n'
          if text.count(marker) != 1:
              raise SystemExit('historical appendix marker missing or duplicated')
          prefix, appendix = text.split(marker, 1)

          replacements = [
              (
                  'Status: **FINAL CANDIDATE / implementation + targeted/full Python regression verified; final user-authored exact-head CI/Vercel pending**.',
                  'Status: **DONE / API + ledger contract verified; exact-head CI #856 SUCCESS. Vercel preview on the final L2 docs head was externally rate-limited, while the underlying product implementation had successful preview evidence.**',
              ),
              (
                  '- the final user-authored L2 candidate must still pass formal exact-head full-repository CI and Vercel preview before L2 is marked DONE.',
                  '- final L2 exact head `f0c5dec66c66de7dd6fabf204ca89a6e01ff556f` passed CI #856 across Python, JS, Worker, quant formulas, Portfolio type/build/source contracts, browser E2E, Vercel configuration validation, local D1 migration and Cloudflare bundle; Git Integration preview was blocked only by `build-rate-limit`, not by a build/test failure.',
              ),
              (
                  'Status: **PLANNING ONLY / do not write until user confirms final UI details and L2 closes**.',
                  'Status: **DONE / implementation + generated production assets + exact-head CI #863 VERIFIED at `7edb503fa8d75fd1aee1896440611a14134c24af`.**',
              ),
              (
                  'Do not start L3 source writes until L2 exact-head verification is complete and the final UI change list has been presented to the user for confirmation.',
                  'L3 verification record:\n\n- `model.ts` now treats non-100% totals as valid weight-defined exposure and preserves API/domain as the sole gross-limit authority;\n- `AllocationEditor` removes the 100% cell cap, shows cash / fully invested / financed-gross summaries, and makes `100% 等權` / `縮放至 100%` explicit actions instead of silent normalization;\n- `SettingsPanels` separates borrowing-rate/maintenance-margin assumptions from the collapsed legacy leverage compatibility controls and explains daily gross reset vs internal allocation rebalance;\n- generated `public/portfolio` assets were rebuilt from the same source and passed the committed-asset drift gate;\n- dedicated browser regressions cover 50%, 150%, 300%, request payload preservation, legacy-control demotion and 390px mobile semantics;\n- two initial E2E failures were test-locator scope errors against duplicated hidden/visible responsive DOM, not product behavior failures; Playwright diagnostics confirmed the mobile UI rendered the expected exposure text;\n- final L3 exact head `7edb503fa8d75fd1aee1896440611a14134c24af` passed CI #863 end-to-end, including browser E2E, Vercel config validation, D1 migration and Cloudflare bundle.',
              ),
          ]
          for old, new in replacements:
              if prefix.count(old) != 1:
                  raise SystemExit(f'anchor mismatch: {old[:80]}')
              prefix = prefix.replace(old, new, 1)

          start = prefix.index('## 7. Current Public Product Boundary')
          end = prefix.index('## 8. NOW / NEXT / BACKLOG / REJECT')
          section7 = (
              '## 7. Current Public Product Boundary\n\n'
              'At the verified L3 branch candidate:\n\n'
              '- Portfolio API admission supports below/equal/above 100% weight-defined exposure within the domain bound;\n'
              '- browser percentage cells are direct per-Portfolio equity-relative exposure controls and no longer impose a 100% cap;\n'
              '- below 100% is shown as residual cash, 100% as fully invested, and above 100% as gross multiple plus financed exposure;\n'
              '- non-100% summaries disclose daily total-exposure reset while internal asset mix remains governed by periodic/threshold allocation rebalance;\n'
              '- borrowing interest and maintenance margin remain configurable for weight-defined financed exposure;\n'
              '- legacy fixed-ratio/fixed-debt controls remain collapsed compatibility behavior and cannot combine with non-100% weight-defined exposure;\n'
              '- desktop/mobile source and committed production assets are synchronized and covered by browser regression;\n'
              '- production main remains unchanged at `e93e3ba51...` until PR #162 completes final R3 recovery/review/merge and production verification.\n\n'
          )
          prefix = prefix[:start] + section7 + prefix[end:]

          start = prefix.index('### NOW\n')
          end = prefix.index('### BACKLOG\n')
          now_next = (
              '### NOW\n\n'
              'Final R3 closure only:\n\n'
              '```text\n'
              'handoff/contract closeout\n'
              '→ final user-authored exact head + full CI\n'
              '→ pre-merge recovery for exact main\n'
              '→ independent exact-head review\n'
              '→ Ready / squash merge only with all gates green\n'
              '```\n\n'
              '### NEXT\n\n'
              'After merge: post-main recovery, main CI, Vercel production, and live Portfolio regressions for representative 50% / 100% / 150% / 300% cases.\n\n'
              '### AFTER PR #162\n\n'
              'Resume product roadmap at Batch 4A-6 Walk-Forward user-facing UX unless a new production correctness issue outranks it.\n\n'
          )
          prefix = prefix[:start] + now_next + prefix[end:]

          old_resume = (
              '4. treat the corrected L1 ledger semantics as locked unless new correctness evidence reopens them;\n'
              '5. finish L2 exact-head formal verification;\n'
              '6. do not write L3 UX until its final change list has been presented to the user and authorized;\n'
              '7. preserve the historical appendix below when updating this file.'
          )
          new_resume = (
              '4. treat L1/L2/L3 feature semantics as verified and locked unless new correctness evidence reopens them;\n'
              '5. complete final R3 exact-head CI, recovery and independent review before merge;\n'
              '6. after merge, verify production with 50% / 100% / 150% / 300% representative Portfolios before closing PR #162;\n'
              '7. preserve the historical appendix below when updating this file.'
          )
          if prefix.count(old_resume) != 1:
              raise SystemExit('resume anchor mismatch')
          prefix = prefix.replace(old_resume, new_resume, 1)

          updated = prefix + marker + appendix
          if updated.count('# Historical Execution Record — Batch 4A-5') != 1:
              raise SystemExit('historical appendix not preserved exactly once')
          path.write_text(updated)
          PY
          git diff --check
          git diff -- to_do_update_list.md

      - name: Commit handoff only and remove updater
        run: |
          set -euo pipefail
          rm .github/workflows/closeout-portfolio-exposure-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- to_do_update_list.md .github/workflows/closeout-portfolio-exposure-handoff.yml
          git diff --cached --check
          git commit -m "docs: close Portfolio exposure implementation handoff"
          git push origin HEAD:feat/portfolio-weight-defined-exposure
