name: Margin Band Cleanup Once

on:
  push:
    branches:
      - fix/portfolio-margin-band-20260827
    paths:
      - ".github/workflows/margin-band-cleanup-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-margin-band-20260827
          fetch-depth: 0
      - name: Remove runner-only artifacts and self
        run: |
          git config user.name "chihung1024"
          git config user.email "104315542+chihung1024@users.noreply.github.com"
          if git ls-files node_modules | grep -q .; then git rm -r node_modules; fi
          git ls-files -z | grep -zE '(^|/)__pycache__/|\.pyc$' | xargs -0 -r git rm -f
          git rm .github/workflows/margin-band-cleanup-once.yml
          git add -A
          git commit -m "chore: remove one-shot build artifacts"
          git push origin HEAD:fix/portfolio-margin-band-20260827
