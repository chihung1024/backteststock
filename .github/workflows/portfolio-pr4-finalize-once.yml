name: Portfolio PR4 finalize once

on:
  push:
    branches: [feat/portfolio-migration-pr4-full-page-app]
    paths:
      - ".github/workflows/portfolio-pr4-finalize-once.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-web-build-once
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/portfolio-migration-pr4-full-page-app
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Mark migration capabilities complete
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          matrix_path = Path("tests/fixtures/portfolio_migration/capability_matrix.json")
          matrix = json.loads(matrix_path.read_text())
          completed = {
              "page.full_route": "implemented",
              "allocation.five_portfolios": "implemented",
              "allocation.twenty_assets": "implemented",
              "allocation.matrix": "implemented",
              "results.complete_dashboard": "implemented",
              "results.data_audit": "implemented",
              "state.save_share_export": "implemented",
              "accessibility.responsive": "implemented",
          }
          for capability in matrix["capabilities"]:
              if capability["id"] in completed:
                  capability["status"] = completed[capability["id"]]
          matrix_path.write_text(json.dumps(matrix, ensure_ascii=False, indent=2) + "\n")

          readme_path = Path("docs/portfolio-migration/README.md")
          text = readme_path.read_text()
          text = text.replace(
              "| PR 4～PR 7 | 未開始 | 依本文件順序執行 |",
              "| PR 4 | 已完成 | React + TypeScript `/portfolio/` 獨立專頁、完整配置／設定／結果／稽核、儲存分享匯出及 390px 響應式驗收 |\n| PR 5～PR 7 | 未開始 | 依本文件順序執行 |",
          )
          marker = "## 差異治理"
          section = """## PR 4 全頁式應用契約

`/portfolio/` 可直接開啟、重新整理及分享，使用同源 Portfolio v3 API，主功能不使用 Dialog 或 iframe。完整資產矩陣、手機聚焦編輯、模擬設定、九個結果頁籤、資料稽核、儲存／分享／匯入／匯出及無障礙規則見：

- `docs/portfolio-migration/PR4_FULL_PAGE_APP.md`

PR 4 尚不切換主網站入口或 Scanner handoff；PR 5 負責導覽與狀態保留，PR 6 負責刪除舊 runtime。

"""
          if section not in text:
              text = text.replace(marker, section + marker)
          readme_path.write_text(text)
          PY
      - name: Resolve dependencies and build production app
        run: |
          npm install
          npm run check:portfolio
          node --test tests/test_portfolio_web_contract.mjs
      - name: Commit generated application
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/portfolio-web-build-once.yml
          rm -f .github/workflows/portfolio-pr4-finalize-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/portfolio \
            tests/fixtures/portfolio_migration/capability_matrix.json \
            docs/portfolio-migration/README.md \
            .github/workflows/portfolio-web-build-once.yml \
            .github/workflows/portfolio-pr4-finalize-once.yml
          if git diff --cached --quiet; then
            echo "No generated changes were needed."
            exit 0
          fi
          git commit -m "build: finalize Portfolio full-page app [portfolio-build]"
          git push origin HEAD:feat/portfolio-migration-pr4-full-page-app
