name: Run daily range patch on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/daily-range-edge-cache
      - name: Apply implementation and tests
        run: |
          python scripts/apply_daily_range_patch.py
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use daily rolling ranges and cache repeated backtests"
          git push origin HEAD:perf/daily-range-edge-cache
