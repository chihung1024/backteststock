name: Run daily range patch on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/daily-range-edge-cache
      - name: Execute embedded patch
        run: |
          ruby -ryaml -e 'puts YAML.load_file(ARGV[0]).dig("jobs", "apply", "steps", 1, "run")' \
            .github/workflows/apply-daily-range-performance.yml > /tmp/apply-daily-range.sh
          bash /tmp/apply-daily-range.sh
          rm -f \
            .github/workflows/run-daily-range-patch-on-pr.yml \
            diagnostics/daily-range-trigger.txt
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use daily rolling ranges and cache repeated backtests"
          git push origin HEAD:perf/daily-range-edge-cache
