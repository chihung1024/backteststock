name: Run daily range patch on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/daily-range-edge-cache
      - name: Execute embedded patch
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-daily-range-performance.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          embedded = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          normalized = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          exec(compile(normalized, 'apply-daily-range-performance', 'exec'))
          for path in (
              Path('.github/workflows/run-daily-range-patch-on-pr.yml'),
              Path('diagnostics/daily-range-trigger.txt'),
          ):
              if path.exists():
                  path.unlink()
          PY
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use daily rolling ranges and cache repeated backtests"
          git push origin HEAD:perf/daily-range-edge-cache
