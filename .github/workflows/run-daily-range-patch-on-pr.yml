name: Run daily range patch on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/daily-range-edge-cache
      - name: Apply implementation and tests
        run: |
          python scripts/patch_app_daily.py
          python scripts/patch_worker_edge_cache.py
          python scripts/patch_backtest_timing.py
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_daily_range_patch.py")
          content = path.read_text(encoding="utf-8")
          for call in (
              "    patch_backtest_timing()\n",
              "    patch_frontend()\n",
              "    patch_worker()\n",
          ):
              if content.count(call) != 1:
                  raise SystemExit(f"Unable to disable delegated call: {call.strip()}")
              content = content.replace(call, "", 1)
          path.write_text(content, encoding="utf-8")
          PY
          python scripts/apply_daily_range_patch.py
          rm -f \
            scripts/patch_app_daily.py \
            scripts/patch_worker_edge_cache.py \
            scripts/patch_backtest_timing.py
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use daily rolling ranges and cache repeated backtests"
          git push origin HEAD:perf/daily-range-edge-cache
