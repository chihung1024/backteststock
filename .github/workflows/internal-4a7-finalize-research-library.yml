name: Internal 4A-7 Research Library Finalize

on:
  push:
    branches:
      - internal-4a7-research-memory
    paths:
      - ".github/workflows/internal-4a7-finalize-research-library.yml"

permissions:
  contents: write

jobs:
  finalize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: internal-4a7-research-memory
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Add stale-result guard and focused browser regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path("apps/portfolio-web/src/ResearchLibraryPanel.tsx")
          text = panel.read_text(encoding="utf-8")

          anchor = '  const activeController = useRef<AbortController | null>(null);\n  const namePlaceholder = useMemo(() => suggestedRunName(request), [request]);'
          replacement = '  const activeController = useRef<AbortController | null>(null);\n  const operationVersion = useRef(0);\n  const namePlaceholder = useMemo(() => suggestedRunName(request), [request]);'
          if anchor not in text:
              raise SystemExit("active controller anchor not found")
          text = text.replace(anchor, replacement, 1)

          anchor = '  useEffect(() => () => activeController.current?.abort(), []);'
          replacement = '''  useEffect(() => () => {
    operationVersion.current += 1;
    activeController.current?.abort();
  }, []);'''
          if anchor not in text:
              raise SystemExit("cleanup effect anchor not found")
          text = text.replace(anchor, replacement, 1)

          anchor = '''    activeController.current?.abort();
    const controller = new AbortController();
    activeController.current = controller;
    setAction(nextAction);'''
          replacement = '''    activeController.current?.abort();
    const controller = new AbortController();
    const version = ++operationVersion.current;
    activeController.current = controller;
    setAction(nextAction);'''
          if anchor not in text:
              raise SystemExit("operation start anchor not found")
          text = text.replace(anchor, replacement, 1)

          anchor = '''    try {
      return await operation(controller.signal);
    } catch (caught) {
      if (!(caught instanceof DOMException && caught.name === "AbortError")) setError(libraryErrorText(caught));
      return null;
    } finally {
      if (activeController.current === controller) activeController.current = null;
      setAction((current) => current === nextAction ? null : current);
      onBusyChange(false);
    }'''
          replacement = '''    try {
      const response = await operation(controller.signal);
      if (version !== operationVersion.current || activeController.current !== controller) return null;
      return response;
    } catch (caught) {
      if (!(caught instanceof DOMException && caught.name === "AbortError")) setError(libraryErrorText(caught));
      return null;
    } finally {
      if (version === operationVersion.current && activeController.current === controller) {
        activeController.current = null;
        setAction((current) => current === nextAction ? null : current);
        onBusyChange(false);
      }
    }'''
          if anchor not in text:
              raise SystemExit("operation completion anchor not found")
          text = text.replace(anchor, replacement, 1)

          anchor = '''  function cancelOperation() {
    activeController.current?.abort();'''
          replacement = '''  function cancelOperation() {
    operationVersion.current += 1;
    activeController.current?.abort();'''
          if anchor not in text:
              raise SystemExit("cancel anchor not found")
          text = text.replace(anchor, replacement, 1)

          anchor = '''  function forgetDeviceCredential() {
    activeController.current?.abort();'''
          replacement = '''  function forgetDeviceCredential() {
    operationVersion.current += 1;
    activeController.current?.abort();'''
          if anchor not in text:
              raise SystemExit("forget anchor not found")
          text = text.replace(anchor, replacement, 1)

          anchor = '<small>job {shortHash(run.jobHash)}{run.sourceRunId ? ` · rerun of ${shortHash(run.sourceRunId)}` : ""}</small>'
          replacement = '<small>run {shortHash(run.runId)} · job {shortHash(run.jobHash)}{run.sourceRunId ? ` · rerun of ${shortHash(run.sourceRunId)}` : ""}</small>'
          if anchor not in text:
              raise SystemExit("run identity anchor not found")
          text = text.replace(anchor, replacement, 1)
          panel.write_text(text, encoding="utf-8")

          spec = Path("tests/e2e/research_library.spec.mjs")
          tests = spec.read_text(encoding="utf-8")
          marker = 'test("cancel invalidates a late Research Library response even when transport ignores abort"'
          if marker not in tests:
              tests += r'''

          test("cancel invalidates a late Research Library response even when transport ignores abort", async ({ page }) => {
            await mockBase(page);
            await page.addInitScript(({ capabilityValue }) => {
              const realFetch = window.fetch.bind(window);
              window.__resolveResearchRunSave = null;
              window.fetch = (input, init = {}) => {
                const url = typeof input === "string" ? input : input.url;
                if (url.endsWith("/api/v1/research/runs") && init.method === "POST") {
                  return new Promise((resolve) => {
                    window.__resolveResearchRunSave = () => resolve(new Response(JSON.stringify({
                      contractVersion: "research-run-memory-2026-08-17.1",
                      libraryId: "lib_late",
                      libraryCapability: capabilityValue,
                      run: {
                        runId: "run_44444444-4444-4444-8444-444444444444",
                        sourceRunId: null,
                        name: "Late result",
                        jobHash: "9".repeat(64),
                        resultContractVersion: "walk-forward-job-2026-08-15.1",
                        decisionCount: 1,
                        createdAt: "2026-08-17 05:30:00",
                      },
                      result: { status: "completed" },
                    }), { status: 201, headers: { "content-type": "application/json" } }));
                  });
                }
                return realFetch(input, init);
              };
            }, { capabilityValue: CAPABILITY });

            await openWalkForward(page);
            await page.getByLabel("ResearchRun 研究名稱").fill("Late result");
            await page.getByRole("button", { name: "執行並保存", exact: true }).click();
            await expect(page.getByRole("button", { name: "停止等待" })).toBeVisible();
            await expect(page.getByRole("button", { name: "執行並保存中…" })).toBeVisible();
            await page.getByRole("button", { name: "停止等待" }).click();
            await expect(page.getByText(/已停止瀏覽器等待/u)).toBeVisible();

            await page.evaluate(() => window.__resolveResearchRunSave?.());
            await page.waitForTimeout(100);

            expect(await page.evaluate((key) => localStorage.getItem(key), CAPABILITY_KEY)).toBeNull();
            await expect(page.getByText("新研究庫已建立：請立即備份復原碼")).toHaveCount(0);
            await expect(page.getByText("Late result", { exact: true })).toHaveCount(0);
            await expect(page.getByRole("button", { name: "執行並保存", exact: true })).toBeEnabled();
          });

          test("Research Library remains usable without page-level horizontal overflow at 390px", async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await mockBase(page);
            await openWalkForward(page);

            await expect(page.getByRole("heading", { name: "Research Library" })).toBeVisible();
            await expect(page.getByLabel("ResearchRun 研究名稱")).toBeVisible();
            await expect(page.getByLabel("匯入 Research Library 復原碼")).toBeVisible();
            await expect(page.getByRole("button", { name: "執行並保存", exact: true })).toBeVisible();
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            expect(overflow).toBeLessThanOrEqual(1);
          });
          '''
              spec.write_text(tests, encoding="utf-8")
          PY

      - run: npm ci

      - name: Check JavaScript and Worker authority regressions
        run: |
          npm run check
          npm run test:worker

      - name: Type-check and build Portfolio production assets
        run: npm run check:portfolio

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Walk-Forward and Research Library browser behavior
        run: npx playwright test tests/e2e/walk_forward_workspace.spec.mjs tests/e2e/walk_forward_admission.spec.mjs tests/e2e/research_library.spec.mjs --reporter=line

      - name: Rehearse D1 migrations through ResearchRun schema
        run: |
          rm -rf .wrangler/state
          npx wrangler d1 migrations apply backteststock-universe --local
          npx wrangler d1 execute backteststock-universe --local --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('research_libraries','research_runs') ORDER BY name;"

      - name: Verify Cloudflare bundle
        run: npx wrangler deploy --dry-run

      - name: Commit verified fix, assets, regressions and remove verifier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/portfolio-web/src/ResearchLibraryPanel.tsx tests/e2e/research_library.spec.mjs public/portfolio
          git rm -- .github/workflows/internal-4a7-finalize-research-library.yml
          git commit -m "fix: guard Research Library stale results"
          git push origin HEAD:internal-4a7-research-memory
