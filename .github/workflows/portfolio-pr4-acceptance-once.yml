name: Portfolio PR4 acceptance once

on:
  push:
    branches: [feat/portfolio-migration-pr4-full-page-app]
    paths:
      - ".github/workflows/portfolio-pr4-acceptance-once.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-pr4-acceptance-once
  cancel-in-progress: true

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/portfolio-migration-pr4-full-page-app
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check and verify production bundle
        run: |
          npm run check:portfolio
          node --test tests/test_portfolio_web_contract.mjs
          git diff --exit-code -- public/portfolio
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full-page desktop and mobile acceptance
        run: npx playwright test tests/e2e/portfolio_full_page.spec.mjs --reporter=line
      - name: Record acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          cat > docs/portfolio-migration/PR4_ACCEPTANCE.md <<'EOF'
          # PR 4 acceptance evidence

          The standalone `/portfolio/` application passed its phase acceptance on GitHub-hosted Ubuntu with Node 22 and Chromium.

          Verified gates:

          - Strict TypeScript `noEmit` check.
          - Deterministic Vite production build and committed-bundle diff check.
          - Source contract: self-owned Portfolio v3 API, no Dialog, iframe or legacy API dependency.
          - Direct `/portfolio/` navigation and refresh-compatible static entry.
          - Data preflight and Portfolio v3 backtest workflow.
          - Complete results dashboard and data-audit navigation.
          - Browser save and secret-free share URL.
          - Five-portfolio and twenty-asset limits.
          - 390px focused mobile editor and fixed safe-area action bar.

          The repository-wide CI remains the authoritative gate for Python, Worker, score, all Playwright flows, Vercel configuration, D1 migrations and Cloudflare bundle validation.
          EOF
          rm .github/workflows/portfolio-pr4-acceptance-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/portfolio-migration/PR4_ACCEPTANCE.md .github/workflows/portfolio-pr4-acceptance-once.yml
          git commit -m "test: record Portfolio PR4 acceptance [portfolio-acceptance]"
          git push origin HEAD:feat/portfolio-migration-pr4-full-page-app
