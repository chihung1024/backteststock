name: Apply scan output layout

on:
  push:
    branches: [fix/scan-output-and-performance]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/scan-output-and-performance
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply layout, exports, docs, and contracts
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Load the presentation module before the score enhancer so its
          # capture-phase export handlers and table cleanup run first.
          index_path = Path("public/index.html")
          index = index_path.read_text(encoding="utf-8")
          index = index.replace('href="/styles.css"', 'href="/styles.css?v=20260801.2"', 1)
          index = index.replace('src="/app.js"', 'src="/app.js?v=20260801.2"', 1)
          index = index.replace(
              '  <script type="module" src="/scan-composite-score.js"></script>',
              '  <script type="module" src="/scan-output-ui.js?v=20260801.2"></script>\n'
              '  <script type="module" src="/scan-composite-score.js?v=20260801.2"></script>',
              1,
          )
          export_button = '          <button id="export-scan" class="button ghost" type="button">匯出 CSV</button>'
          export_toolbar = '''          <div class="toolbar">
                    <button id="export-scan" class="button ghost" type="button">匯出精簡 CSV</button>
                    <button id="export-scan-audit" class="button ghost" type="button">匯出稽核 CSV</button>
                  </div>'''
          if index.count(export_button) != 1:
              raise SystemExit("export button anchor mismatch")
          index_path.write_text(index.replace(export_button, export_toolbar, 1), encoding="utf-8")

          score_path = Path("public/scan-composite-score.js")
          score = score_path.read_text(encoding="utf-8")
          old_ticker = '    const ticker = normalizeScoreTicker(originalCells[0].textContent);'
          new_ticker = '    const ticker = normalizeScoreTicker(row.dataset.ticker || originalCells[0].dataset.ticker || originalCells[0].textContent);'
          if score.count(old_ticker) != 1:
              raise SystemExit("score ticker anchor mismatch")
          score_path.write_text(score.replace(old_ticker, new_ticker, 1), encoding="utf-8")

          styles_path = Path("public/styles.css")
          styles = styles_path.read_text(encoding="utf-8")
          styles = styles.replace(
              '.summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }',
              '.summary-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }',
              1,
          )
          marker = "/* Scan result presentation v20260801.2 */"
          if marker in styles:
              raise SystemExit("scan presentation styles already present")
          styles += '''

          /* Scan result presentation v20260801.2 */
          #scan-table { min-width: 1760px; }
          #scan-table th,
          #scan-table td { min-width: 104px; }
          #scan-table th:first-child,
          #scan-table td:first-child {
            width: 150px;
            min-width: 150px;
            max-width: 180px;
            white-space: normal;
            z-index: 2;
          }
          #scan-table thead th:first-child { z-index: 4; }
          #scan-table th[data-composite-metric],
          #scan-table td[data-composite-metric] { min-width: 132px; }
          .scan-ticker-cell { line-height: 1.25; }
          .scan-ticker-symbol {
            display: block;
            color: var(--text);
            font-weight: 800;
            letter-spacing: 0.02em;
          }
          .scan-ticker-note {
            display: block;
            margin-top: 0.28rem;
            color: var(--muted);
            font-size: 0.7rem;
            font-weight: 550;
            line-height: 1.35;
            white-space: normal;
          }
          .scan-batch-timing { margin-top: 0.75rem; }
          .score-formula-details { padding-block: 0.65rem; }
          .score-formula-details summary {
            cursor: pointer;
            color: var(--text);
            font-weight: 750;
          }
          .score-formula-details ul {
            margin: 0.65rem 0 0;
            padding-left: 1.25rem;
          }
          .score-formula-details p { margin: 0.55rem 0 0; }
          '''
          styles_path.write_text(styles, encoding="utf-8")

          runtime_path = Path("tests/test_production_runtime.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime = runtime.replace(
              '    assert "aligned_sha256=" in result["note"]\n',
              '    assert result["note"] is None\n'
              '    assert "aligned_sha256=" in result["reproducibility"]\n'
              '    assert "market;dur=" in response.headers["Server-Timing"]\n'
              '    assert response.headers["X-Scan-Requested"] == "1"\n'
              '    assert response.headers["X-Scan-Resolved"] == "1"\n',
              1,
          )
          runtime = runtime.replace(
              "def test_scan_resolves_benchmark_once_before_large_asset_batch(scan_client, monkeypatch):",
              "def test_scan_resolves_benchmark_and_assets_in_one_large_batch(scan_client, monkeypatch):",
              1,
          )
          runtime = runtime.replace(
              '    assert calls == [["SPY"], ["AAA", "BBB"]]\n',
              '    assert calls == [["SPY", "AAA", "BBB"]]\n',
              1,
          )
          runtime_path.write_text(runtime, encoding="utf-8")

          metrics_path = Path("tests/test_metrics_core.py")
          metrics = metrics_path.read_text(encoding="utf-8")
          metrics = metrics.replace(
              "from api.metrics import (\n    METRIC_DEFINITION_VERSION,",
              "from api.metrics import (\n    FINGERPRINT_ALGORITHM,\n    METRIC_DEFINITION_VERSION,",
              1,
          )
          metrics = metrics.replace(
              '    assert metadata["scipy_version"] == "1.17.1"\n',
              '    assert metadata["scipy_version"] == "1.17.1"\n'
              '    assert metadata["fingerprint_algorithm"] == FINGERPRINT_ALGORITHM\n',
              1,
          )
          metrics_path.write_text(metrics, encoding="utf-8")

          docs_path = Path("docs/METRICS_REPRODUCIBILITY.md")
          docs = docs_path.read_text(encoding="utf-8")
          old_docs = "每筆掃描結果另回傳資料源版本、參數與 SHA-256 指紋；CSV 的 `note` 欄也保存同一份精簡再現資訊。"
          new_docs = "每筆掃描結果另回傳資料源版本、參數與 SHA-256 指紋。互動畫面及精簡 CSV 只顯示人類可讀備註；完整版本、參數與指紋放在獨立稽核 CSV，避免污染股票代碼與主要績效欄。"
          if docs.count(old_docs) != 1:
              raise SystemExit("documentation output contract anchor mismatch")
          docs = docs.replace(old_docs, new_docs, 1)
          docs = docs.replace(
              "- `price_fingerprint`\n",
              "- `fingerprint_algorithm`\n- `price_fingerprint`\n",
              1,
          )
          docs_path.write_text(docs, encoding="utf-8")

          Path(".github/workflows/apply-scan-output-layout.yml").unlink()
          PY
      - name: Commit layout and contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separate readable scan output from audit metadata"
          git push origin HEAD:fix/scan-output-and-performance
