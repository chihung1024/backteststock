name: Sync Portfolio Production Assets

on:
  push:
    branches:
      - feat/portfolio-weight-defined-exposure
    paths:
      - .github/workflows/sync-portfolio-production-assets.yml

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/portfolio-web/package-lock.json

      - name: Build exact Portfolio production assets
        run: |
          set -euo pipefail
          npm --prefix apps/portfolio-web ci
          npm --prefix apps/portfolio-web run typecheck
          npm --prefix apps/portfolio-web run build
          git diff --check
          test -f public/portfolio/index.html
          bundle_path="$(sed -n 's/.*src="\/portfolio\/assets\/\([^"]*\.js\)".*/public\/portfolio\/assets\/\1/p' public/portfolio/index.html | head -n 1)"
          test -n "$bundle_path"
          test -f "$bundle_path"
          echo "Built bundle: $bundle_path"
          git status --short -- public/portfolio

      - name: Commit generated assets only and remove synchronizer
        run: |
          set -euo pipefail
          rm .github/workflows/sync-portfolio-production-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/portfolio .github/workflows/sync-portfolio-production-assets.yml
          git diff --cached --check
          unexpected="$(git diff --cached --name-only | grep -Ev '^(public/portfolio/|\.github/workflows/sync-portfolio-production-assets\.yml$)' || true)"
          test -z "$unexpected"
          test -n "$(git diff --cached --name-only -- public/portfolio)"
          git commit -m "build: sync Portfolio production assets"
          git push origin HEAD:feat/portfolio-weight-defined-exposure
