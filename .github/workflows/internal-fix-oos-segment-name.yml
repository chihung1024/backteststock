name: Internal Fix OOS Segment Name

on:
  push:
    branches:
      - feat/optimizer-hub-parameter-optimization
    paths:
      - .github/internal-fix-oos-segment-name.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/optimizer-hub-parameter-optimization
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply deterministic bounded internal-name fix
        run: |
          python - <<'PY'
          from pathlib import Path

          models_path = Path("apps/api/app/portfolio/models.py")
          models = models_path.read_text(encoding="utf-8")
          before = "MAX_TARGET_GROSS_EXPOSURE = 5.0\n"
          after = "MAX_TARGET_GROSS_EXPOSURE = 5.0\nMAX_PORTFOLIO_NAME_LENGTH = 60\n"
          if before not in models or "MAX_PORTFOLIO_NAME_LENGTH" in models:
              raise SystemExit("unexpected Portfolio models anchor")
          models = models.replace(before, after, 1)
          if "if len(name) > 60:" not in models:
              raise SystemExit("Portfolio name validation anchor missing")
          models = models.replace(
              "if len(name) > 60:",
              "if len(name) > MAX_PORTFOLIO_NAME_LENGTH:",
              1,
          )
          models_path.write_text(models, encoding="utf-8")

          oos_path = Path("apps/api/app/research/oos_ledger.py")
          oos = oos_path.read_text(encoding="utf-8")
          if "import hashlib\n" in oos:
              raise SystemExit("hashlib unexpectedly already imported")
          oos = oos.replace(
              "from __future__ import annotations\n\n",
              "from __future__ import annotations\n\nimport hashlib\n",
              1,
          )
          import_anchor = "    LeverageType,\n    PortfolioSpec,\n"
          if import_anchor not in oos:
              raise SystemExit("OOS PortfolioSpec import anchor missing")
          oos = oos.replace(
              import_anchor,
              "    LeverageType,\n    MAX_PORTFOLIO_NAME_LENGTH,\n    PortfolioSpec,\n",
              1,
          )
          name_anchor = '            f"{name}:{decision.period.period_id}",\n'
          if name_anchor not in oos:
              raise SystemExit("OOS segment name anchor missing")
          oos = oos.replace(
              name_anchor,
              "            _segment_portfolio_name(name, decision.period.period_id),\n",
              1,
          )
          helper_anchor = "\ndef _validate_supported_config(config: SimulationConfig) -> None:\n"
          helper = '''\ndef _segment_portfolio_name(name: str, period_id: str) -> str:\n    \"\"\"Keep execution-only PortfolioSpec metadata inside its validated bound.\n\n    Walk-Forward period ids remain full-fidelity decision/audit identity.  The\n    Portfolio v3 segment name is only execution metadata, so an overlong display\n    name is compacted deterministically instead of rejecting an otherwise valid\n    research period.  Existing short names remain byte-for-byte unchanged.\n    \"\"\"\n\n    raw = f\"{name}:{period_id}\"\n    if len(raw) <= MAX_PORTFOLIO_NAME_LENGTH:\n        return raw\n    digest = hashlib.sha256(raw.encode(\"utf-8\")).hexdigest()[:12]\n    prefix_length = MAX_PORTFOLIO_NAME_LENGTH - len(digest) - 1\n    return f\"{raw[:prefix_length]}:{digest}\"\n\n\n'''
          if helper_anchor not in oos:
              raise SystemExit("OOS helper insertion anchor missing")
          oos = oos.replace(helper_anchor, "\n" + helper + helper_anchor.lstrip("\n"), 1)
          oos_path.write_text(oos, encoding="utf-8")

          test_path = Path("tests/test_walk_forward_oos_ledger.py")
          test = test_path.read_text(encoding="utf-8")
          import_test_anchor = "    WalkForwardEvaluation,\n    run_continuous_oos_ledger,\n"
          if import_test_anchor not in test:
              raise SystemExit("OOS test import anchor missing")
          test = test.replace(
              import_test_anchor,
              "    WalkForwardEvaluation,\n    _segment_portfolio_name,\n    run_continuous_oos_ledger,\n",
              1,
          )
          regression = '''\n\ndef test_oos_segment_name_bounds_execution_metadata_without_truncating_period_identity():\n    short = _segment_portfolio_name(\"Walk-Forward OOS\", \"2024-02-01\")\n    assert short == \"Walk-Forward OOS:2024-02-01\"\n\n    long_period_id = \"period-\" + \"x\" * 96\n    compact = _segment_portfolio_name(\"Inner Parameter Tuning:abcdef123456\", long_period_id)\n    assert len(compact) == 60\n    assert compact == _segment_portfolio_name(\"Inner Parameter Tuning:abcdef123456\", long_period_id)\n    assert compact != _segment_portfolio_name(\"Inner Parameter Tuning:abcdef123456\", long_period_id + \"y\")\n\n    period = WalkForwardPeriod(\n        period_id=long_period_id,\n        training_start=date(2024, 1, 2),\n        training_end=date(2024, 1, 31),\n        decision_date=date(2024, 1, 31),\n        evaluation_start=date(2024, 2, 1),\n        evaluation_end=date(2024, 2, 2),\n    )\n    decision = _decision(period, selected=(\"AAA\",), weights=(1.0,))\n    dataset = _evaluation_dataset(\n        start=period.evaluation_start,\n        end=period.evaluation_end,\n        dates=[\"2024-02-01\", \"2024-02-02\"],\n        aaa=[100.0, 101.0],\n        bbb=[100.0, 100.0],\n    )\n    result = run_continuous_oos_ledger(\n        (WalkForwardEvaluation(decision, dataset),),\n        SimulationConfig(initial_amount=100.0),\n        name=\"Inner Parameter Tuning:abcdef123456\",\n    )\n    assert result.periods[0].period_id == long_period_id\n    assert result.ledger.name == \"Inner Parameter Tuning:abcdef123456\"\n'''
          if "test_oos_segment_name_bounds_execution_metadata" in test:
              raise SystemExit("OOS long-name regression already present")
          test_path.write_text(test.rstrip() + regression + "\n", encoding="utf-8")
          PY
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Validate root-cause fix
        run: |
          ruff check apps/api/app/portfolio/models.py apps/api/app/research/oos_ledger.py tests/test_walk_forward_oos_ledger.py
          python -m pytest -q tests/test_walk_forward_oos_ledger.py tests/test_parameter_tuning_integration.py
      - name: Commit clean product patch and remove temporary plumbing
        run: |
          rm -f .github/internal-fix-oos-segment-name.trigger
          rm -f .github/workflows/internal-fix-oos-segment-name.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/api/app/portfolio/models.py apps/api/app/research/oos_ledger.py tests/test_walk_forward_oos_ledger.py .github
          git diff --cached --check
          git commit -m "fix: bound Walk-Forward segment portfolio names"
          git push origin HEAD:feat/optimizer-hub-parameter-optimization
