name: Diagnose production scan

on:
  push:
    branches: [fix/scan-stall-finite-fallback]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/scan-stall-finite-fallback
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Measure current production scan
        env:
          ORIGIN: https://backteststock.chired.workers.dev
        run: |
          mkdir -p diagnostics
          node <<'NODE'
          import { writeFile } from "node:fs/promises";

          const origin = process.env.ORIGIN;
          const report = {
            measuredAt: new Date().toISOString(),
            origin,
            period: { startYear: 2019, startMonth: 1, endYear: 2026, endMonth: 7 },
            events: [],
          };

          async function json(path, init = {}, timeout = 260_000) {
            const begin = Date.now();
            try {
              const response = await fetch(new URL(path, origin), {
                ...init,
                headers: { accept: "application/json", ...(init.headers || {}) },
                signal: AbortSignal.timeout(timeout),
              });
              const text = await response.text();
              const event = {
                path,
                status: response.status,
                elapsedMs: Date.now() - begin,
                bytes: text.length,
              };
              report.events.push(event);
              let payload;
              try { payload = JSON.parse(text); } catch { payload = { raw: text.slice(0, 1000) }; }
              if (!response.ok) {
                event.error = typeof payload?.error === "string" ? payload.error : text.slice(0, 1000);
                throw new Error(`${path} HTTP ${response.status}: ${event.error}`);
              }
              return payload;
            } catch (error) {
              if (!report.events.some((event) => event.path === path && event.elapsedMs != null)) {
                report.events.push({ path, elapsedMs: Date.now() - begin, error: error.message });
              }
              throw error;
            }
          }

          try {
            const screener = await json("/api/v2/screener", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                universe: "sp500",
                sector: "any",
                filters: { marketCap: { min: 10_000_000_000 } },
                sort: "marketCap-desc",
                limit: 100,
              }),
            }, 60_000);
            const tickers = screener.candidates.map((item) => item.ticker);
            report.candidateCount = tickers.length;
            report.firstTickers = tickers.slice(0, 10);

            const scanStarted = Date.now();
            const scan = await json("/api/scan", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                tickers,
                benchmark: "SPY",
                startYear: 2019,
                startMonth: 1,
                endYear: 2026,
                endMonth: 7,
              }),
            });
            const rows = Array.isArray(scan) ? scan : [];
            report.scanElapsedMs = Date.now() - scanStarted;
            report.responseType = Array.isArray(scan) ? "array" : typeof scan;
            report.rowCount = rows.length;
            report.ok = rows.filter((row) => row.status === "ok").length;
            report.failed = rows.filter((row) => row.status === "failed").length;
            report.retryable = rows.filter((row) => row.retryable === true).length;
            report.metricVersions = [...new Set(rows.map((row) => row.metric_definition_version).filter(Boolean))];
            report.sampleErrors = rows
              .filter((row) => row.error)
              .slice(0, 5)
              .map((row) => ({ ticker: row.ticker, error: row.error }));
            report.outcome = "completed";
          } catch (error) {
            report.outcome = "error";
            report.error = error.message;
          }

          await writeFile("diagnostics/production-scan-100.json", `${JSON.stringify(report, null, 2)}\n`);
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Store diagnosis and remove temporary workflow
        run: |
          rm .github/workflows/diagnose-production-scan.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record production 100-symbol scan diagnosis"
          git push origin HEAD:fix/scan-stall-finite-fallback
