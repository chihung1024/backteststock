name: Update Portfolio L1 Handoff

on:
  push:
    branches:
      - feat/portfolio-weight-defined-exposure
    paths:
      - .github/workflows/update-portfolio-l1-handoff.yml

permissions:
  contents: write

jobs:
  update-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Replace current-state prefix and preserve historical appendix
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PREFIX_BLOB: e993237ea27a3eb72dbb7b3a07f8c4ddfe2450a1
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${CURRENT_PREFIX_BLOB}" \
            | python -c 'import base64,json,sys; print(base64.b64decode(json.load(sys.stdin)["content"]).decode(), end="")' \
            > /tmp/current-prefix.md

          python <<'PY'
          from pathlib import Path

          path = Path('to_do_update_list.md')
          text = path.read_text()
          marker = '---\n\n# Historical Execution Record — Batch 4A-5\n'
          if text.count(marker) != 1:
              raise SystemExit('historical appendix marker must exist exactly once')
          _, appendix = text.split(marker, 1)
          current = Path('/tmp/current-prefix.md').read_text()
          if not current.endswith(marker):
              raise SystemExit('exact Git blob does not end at appendix marker')
          path.write_text(current + appendix)
          PY

      - name: Verify and commit durable handoff only
        run: |
          set -euo pipefail
          rm .github/workflows/update-portfolio-l1-handoff.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- to_do_update_list.md .github/workflows/update-portfolio-l1-handoff.yml
          git diff --cached --check
          git commit -m "docs: record Portfolio exposure L1 handoff"
          git push origin HEAD:feat/portfolio-weight-defined-exposure
