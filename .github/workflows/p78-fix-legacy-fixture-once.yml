name: P78 One-Time Legacy Fixture Fix

on:
  push:
    branches:
      - internal-p78-scan-job-normalization-2026-08-12

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Keep legacy-date fixture on the current metric contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/scan_optimizer_handoff.spec.mjs')
          text = path.read_text()
          old = '''      twd_valuation_contract_version: "test-twd-v1",\n    });\n    localStorage.setItem("backteststock-scan-job-v3", JSON.stringify({\n      version: 3,\n      id: "legacy-restored-scan",'''
          new = '''      twd_valuation_contract_version: "test-twd-v1",\n      metric_definition_version: "2026-08-01.2",\n    });\n    localStorage.setItem("backteststock-scan-job-v3", JSON.stringify({\n      version: 3,\n      id: "legacy-restored-scan",'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy fixture anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          rm .github/workflows/p78-fix-legacy-fixture-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/scan_optimizer_handoff.spec.mjs .github/workflows/p78-fix-legacy-fixture-once.yml
          git commit -m "test: isolate legacy date handoff migration"
          git push origin HEAD:${GITHUB_REF_NAME}
