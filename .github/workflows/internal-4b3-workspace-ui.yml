name: Internal 4B-3 Workspace UI

on:
  push:
    branches:
      - feat/optimizer-hub-parameter-optimization

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/optimizer-hub-parameter-optimization
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Apply workspace UI patch
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          component = root / 'apps/portfolio-web/src/WalkForwardOptimizationControls.tsx'
          component.write_text(r'''import type {
            WalkForwardAllocationMethod,
            WalkForwardWorkspaceModel,
          } from "./walkForwardTypes";
          import {
            MAX_INNER_FOLDS,
            MAX_PARAMETER_CANDIDATES,
            MAX_TUNING_EVALUATIONS_PER_JOB,
            parameterOptimizationCandidateCount,
            parameterOptimizationPlannedEvaluations,
          } from "./walkForwardModel";

          const ALLOCATION_METHODS: Array<{ value: WalkForwardAllocationMethod; label: string }> = [
            { value: "equal", label: "Equal Weight" },
            { value: "inverse_volatility", label: "Inverse Volatility" },
            { value: "risk_parity_erc", label: "Risk Parity / ERC" },
          ];

          function parseNumberList(value: string): number[] | null {
            const tokens = value.split(/[\s,]+/).map((item) => item.trim()).filter(Boolean);
            if (!tokens.length) return [];
            const numbers = tokens.map(Number);
            return numbers.every((item) => Number.isFinite(item)) ? numbers : null;
          }

          function numberList(values: number[], scale = 1): string {
            return values.map((value) => Number((value * scale).toFixed(8))).join(", ");
          }

          export function WalkForwardOptimizationControls({
            model,
            disabled,
            onPatch,
          }: {
            model: WalkForwardWorkspaceModel;
            disabled: boolean;
            onPatch: (patch: Partial<WalkForwardWorkspaceModel>) => void;
          }) {
            const search = model.optimizationSearchSpace;
            const inner = model.optimizationInnerValidation;
            const candidateCount = parameterOptimizationCandidateCount(search);
            const plannedEvaluations = parameterOptimizationPlannedEvaluations(model);
            const withinBudget = candidateCount >= 1
              && candidateCount <= MAX_PARAMETER_CANDIDATES
              && inner.foldCount >= 1
              && inner.foldCount <= MAX_INNER_FOLDS
              && plannedEvaluations <= MAX_TUNING_EVALUATIONS_PER_JOB;

            function commitList(
              raw: string,
              key: "lookbackMonths" | "topK" | "absoluteThresholds",
              scale = 1,
            ) {
              const parsed = parseNumberList(raw);
              if (parsed === null) return;
              onPatch({
                optimizationSearchSpace: {
                  ...search,
                  [key]: parsed.map((value) => value / scale),
                },
              });
            }

            function toggleAllocation(method: WalkForwardAllocationMethod, checked: boolean) {
              const next = new Set(search.allocationMethods);
              if (checked) next.add(method);
              else next.delete(method);
              onPatch({
                optimizationSearchSpace: {
                  ...search,
                  allocationMethods: ALLOCATION_METHODS
                    .map((item) => item.value)
                    .filter((item) => next.has(item)),
                },
              });
            }

            return (
              <div className="wf-optimizer-panel">
                <label className="field">
                  <span>Parameter Optimization</span>
                  <select
                    aria-label="Dual Momentum Optimization Mode"
                    value={model.optimizationMode}
                    disabled={disabled}
                    onChange={(event) => onPatch({ optimizationMode: event.target.value === "auto" ? "auto" : "manual" })}
                  >
                    <option value="manual">Manual</option>
                    <option value="auto">Auto Optimize</option>
                  </select>
                  <small>Manual 沿用既有 4B-1/4B-2 request identity；Auto 才送出獨立、版本化的 nested parameterOptimization contract。</small>
                </label>

                {model.optimizationMode === "auto" && (
                  <>
                    <label className="field">
                      <span>Lookback 搜尋（月）</span>
                      <input
                        key={`lookback-${numberList(search.lookbackMonths)}`}
                        aria-label="Auto Optimize Lookback Search"
                        defaultValue={numberList(search.lookbackMonths)}
                        disabled={disabled}
                        onBlur={(event) => commitList(event.currentTarget.value, "lookbackMonths")}
                      />
                      <small>逗號或空白分隔；後端 canonicalize、去重並排序，合法範圍 1–60 月。</small>
                    </label>
                    <label className="field">
                      <span>Top K 搜尋</span>
                      <input
                        key={`topk-${numberList(search.topK)}`}
                        aria-label="Auto Optimize Top K Search"
                        defaultValue={numberList(search.topK)}
                        disabled={disabled}
                        onBlur={(event) => commitList(event.currentTarget.value, "topK")}
                      />
                      <small>每個值都必須介於 1 與目前 Risky 資產數之間。</small>
                    </label>
                    <label className="field">
                      <span>Absolute Threshold 搜尋</span>
                      <div className="input-with-suffix">
                        <input
                          key={`threshold-${numberList(search.absoluteThresholds, 100)}`}
                          aria-label="Auto Optimize Absolute Threshold Search"
                          defaultValue={numberList(search.absoluteThresholds, 100)}
                          disabled={disabled}
                          onBlur={(event) => commitList(event.currentTarget.value, "absoluteThresholds", 100)}
                        />
                        <span>%</span>
                      </div>
                      <small>畫面使用百分比；送往後端時保存為 return decimal，例如 5% = 0.05。</small>
                    </label>
                    <fieldset className="field wf-optimizer-methods" disabled={disabled}>
                      <legend>Allocation 搜尋</legend>
                      <div className="wf-checkbox-list">
                        {ALLOCATION_METHODS.map((method) => (
                          <label key={method.value}>
                            <input
                              type="checkbox"
                              checked={search.allocationMethods.includes(method.value)}
                              onChange={(event) => toggleAllocation(method.value, event.currentTarget.checked)}
                            />
                            <span>{method.label}</span>
                          </label>
                        ))}
                      </div>
                      <small>至少保留一種；瀏覽器不計算權重，候選仍由後端 4B-2 Allocation authority 執行。</small>
                    </fieldset>
                    <label className="field">
                      <span>Inner folds</span>
                      <input
                        type="number"
                        aria-label="Auto Optimize Inner Fold Count"
                        min={1}
                        max={MAX_INNER_FOLDS}
                        step={1}
                        value={inner.foldCount}
                        disabled={disabled}
                        onChange={(event) => onPatch({
                          optimizationInnerValidation: { ...inner, foldCount: Number(event.currentTarget.value) },
                        })}
                      />
                      <small>每一 fold 都完全位於該 Outer Training 內；outer Evaluation 不參與 tuning。</small>
                    </label>
                    <label className="field">
                      <span>Inner Evaluation</span>
                      <div className="input-with-suffix">
                        <input
                          type="number"
                          aria-label="Auto Optimize Inner Evaluation Months"
                          min={1}
                          max={60}
                          step={1}
                          value={inner.evaluationMonths}
                          disabled={disabled}
                          onChange={(event) => onPatch({
                            optimizationInnerValidation: { ...inner, evaluationMonths: Number(event.currentTarget.value) },
                          })}
                        />
                        <span>月</span>
                      </div>
                    </label>
                    <label className="field">
                      <span>Inner step</span>
                      <div className="input-with-suffix">
                        <input
                          type="number"
                          aria-label="Auto Optimize Inner Step Months"
                          min={1}
                          max={60}
                          step={1}
                          value={inner.stepMonths}
                          disabled={disabled}
                          onChange={(event) => onPatch({
                            optimizationInnerValidation: { ...inner, stepMonths: Number(event.currentTarget.value) },
                          })}
                        />
                        <span>月</span>
                      </div>
                      <small>必須 ≥ Inner Evaluation，避免 inner OOS folds 重疊。</small>
                    </label>
                    <div className={`wf-optimizer-preflight ${withinBudget ? "ready" : "warning"}`} role="status">
                      <strong>{withinBudget ? "Search budget 預檢通過" : "Search budget 需修正"}</strong>
                      <span>{candidateCount} candidates × {inner.foldCount} folds × {model.periods.length} outer periods = {plannedEvaluations} tuning evaluations</span>
                      <small>上限：{MAX_PARAMETER_CANDIDATES} candidates、{MAX_INNER_FOLDS} folds、{MAX_TUNING_EVALUATIONS_PER_JOB} total evaluations。後端會在任何 market-data 工作前再次 fail closed。</small>
                    </div>
                  </>
                )}
              </div>
            );
          }
          ''', encoding='utf-8')

          path = root / 'apps/portfolio-web/src/WalkForwardWorkspace.tsx'
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '  createDualMomentumMonthlyPeriods,\n  createDualMomentumWalkForwardModel,',
              '  createDualMomentumAutoPeriods,\n  createDualMomentumMonthlyPeriods,\n  createDualMomentumWalkForwardModel,',
          )
          replace_once(
              'import { ResearchLibraryPanel } from "./ResearchLibraryPanel";\n',
              'import { ResearchLibraryPanel } from "./ResearchLibraryPanel";\nimport { WalkForwardOptimizationControls } from "./WalkForwardOptimizationControls";\n',
          )
          replace_once(
              '''  function regenerateDualMomentumPeriods() {
    mutateModel((current) => ({
      ...current,
      periods: createDualMomentumMonthlyPeriods(current.lookbackMonths),
    }));
    setMessage("已依目前 Lookback 重新產生最近 6 個月的月度 Decision / OOS 區間。 ");
  }''',
              '''  function regenerateDualMomentumPeriods() {
    try {
      const periods = model.optimizationMode === "auto"
        ? createDualMomentumAutoPeriods(
            model.optimizationSearchSpace,
            model.optimizationInnerValidation,
          )
        : createDualMomentumMonthlyPeriods(model.lookbackMonths);
      mutateModel((current) => ({ ...current, periods }));
      setMessage(model.optimizationMode === "auto"
        ? "已依 Auto Optimize 最大 Lookback + inner folds 需求重新產生最近 6 個月區間。 "
        : "已依目前 Lookback 重新產生最近 6 個月的月度 Decision / OOS 區間。 ");
    } catch (caught) {
      setMessage(caught instanceof Error ? `無法產生月度區間：${caught.message}` : "無法產生月度區間。 ");
    }
  }''',
          )
          replace_once(
              '''            <span>Top K <strong>{model.topK}</strong></span>
            <span>Allocation <strong>{model.allocationMethod === "equal" ? "Equal" : model.allocationMethod === "inverse_volatility" ? "Inverse Vol" : "Risk Parity / ERC"}</strong></span>''',
              '''            <span>Mode <strong>{model.optimizationMode === "auto" ? "Auto Optimize" : "Manual"}</strong></span>
            {model.optimizationMode === "manual" ? (
              <>
                <span>Top K <strong>{model.topK}</strong></span>
                <span>Allocation <strong>{model.allocationMethod === "equal" ? "Equal" : model.allocationMethod === "inverse_volatility" ? "Inverse Vol" : "Risk Parity / ERC"}</strong></span>
              </>
            ) : (
              <span>Nested tuning <strong>Training-only</strong></span>
            )}''',
          )
          replace_once(
              '''              <label className="field">
                <span>Momentum Lookback</span>''',
              '''              <WalkForwardOptimizationControls
                model={model}
                disabled={workspaceBusy}
                onPatch={(patch) => mutateModel((current) => ({ ...current, ...patch }))}
              />
              <label className="field">
                <span>Momentum Lookback</span>''',
          )
          replace_once(
              'aria-label="Dual Momentum Lookback 月數" min={1} max={60} step={1} value={model.lookbackMonths} disabled={workspaceBusy}',
              'aria-label="Dual Momentum Lookback 月數" min={1} max={60} step={1} value={model.lookbackMonths} disabled={workspaceBusy || model.optimizationMode === "auto"}',
          )
          replace_once(
              'aria-label="Dual Momentum Top K" min={1} max={Math.max(1, riskyCount)} step={1} value={model.topK} disabled={workspaceBusy}',
              'aria-label="Dual Momentum Top K" min={1} max={Math.max(1, riskyCount)} step={1} value={model.topK} disabled={workspaceBusy || model.optimizationMode === "auto"}',
          )
          replace_once(
              'value={model.allocationMethod}\n                  disabled={workspaceBusy}',
              'value={model.allocationMethod}\n                  disabled={workspaceBusy || model.optimizationMode === "auto"}',
          )
          replace_once(
              'aria-label="Dual Momentum Absolute Threshold" step={0.1} value={model.absoluteThresholdPct} disabled={workspaceBusy}',
              'aria-label="Dual Momentum Absolute Threshold" step={0.1} value={model.absoluteThresholdPct} disabled={workspaceBusy || model.optimizationMode === "auto"}',
          )
          replace_once(
              'disabled={workspaceBusy || !Number.isInteger(model.lookbackMonths) || model.lookbackMonths < 1 || model.lookbackMonths > 60} onClick={regenerateDualMomentumPeriods}',
              'disabled={workspaceBusy} onClick={regenerateDualMomentumPeriods}',
          )
          replace_once(
              '''? "Dual Momentum v1 採月度 Decision。Training 必須涵蓋完整 Lookback；每期 frozen Decision 只影響之後的 OOS 月度區間。"''',
              '''? model.optimizationMode === "auto"
                  ? "Auto Optimize 只在每一期 Outer Training 內建立 completed-calendar-month inner folds；winner 會在完整 Outer Training refit 後才凍結，outer Evaluation 不參與 tuning。"
                  : "Dual Momentum v1 採月度 Decision。Training 必須涵蓋完整 Lookback；每期 frozen Decision 只影響之後的 OOS 月度區間。"''',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build canonical Portfolio assets
        run: npm run check:portfolio
      - name: Verify UI source contracts
        run: node --test tests/test_portfolio_web_contract.mjs tests/test_portfolio_route_bridge.mjs
      - name: Commit workspace UI and synchronized assets
        run: |
          rm .github/workflows/internal-4b3-workspace-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portfolio-web/src/WalkForwardOptimizationControls.tsx apps/portfolio-web/src/WalkForwardWorkspace.tsx public/portfolio .github/workflows/internal-4b3-workspace-ui.yml
          git commit -m "feat: add Auto Optimize workspace controls"
          git push origin HEAD:feat/optimizer-hub-parameter-optimization
