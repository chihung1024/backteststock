name: Preserve formula label separator

on:
  push:
    branches: [fix/scan-output-and-performance]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/scan-output-and-performance
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore full-width equals separator
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("public/scan-composite-score.js")
          text = path.read_text(encoding="utf-8")
          old = '      item.textContent = `${formula.shortLabel}：${formula.description}`;'
          new = '      item.textContent = `${formula.shortLabel}＝${formula.description}`;'
          if text.count(old) != 1:
              raise SystemExit(f"formula label separator count={text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/fix-formula-label-separator.yml").unlink()
          PY
      - name: Commit separator compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve formula comparison text contract"
          git push origin HEAD:fix/scan-output-and-performance
