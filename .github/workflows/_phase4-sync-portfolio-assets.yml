name: Phase 4 temporary Portfolio asset sync

on:
  push:
    branches:
      - "phase4/refinery-diagnostic-ui"
    paths:
      - ".github/workflows/_phase4-sync-portfolio-assets.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SOURCE_SHA: cbc0f9140a02af04d0d3b65010f11021a2a3ac6e
      TARGET_BRANCH: phase4/refinery-diagnostic-ui
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v7
        with:
          ref: phase4/refinery-diagnostic-ui
          fetch-depth: 0

      - name: Guard exact source parent and remote head
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${current}" = "${GITHUB_SHA}"
          test "${parent}" = "${EXPECTED_SOURCE_SHA}"
          test "${remote}" = "${current}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check and deterministically rebuild Portfolio app
        run: npm run check:portfolio

      - name: Verify build changed only committed production assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Expected stale production assets, but build produced no diff."
            exit 1
          fi
          printf 'Generated changes:\n'
          printf '  %s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "${path}" in
              package-lock.json|public/portfolio/*) ;;
              *)
                echo "Unexpected build-side change: ${path}"
                exit 1
                ;;
            esac
          done

      - name: Upload exact generated assets for audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase4-portfolio-production-assets
          path: public/portfolio
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- package-lock.json public/portfolio
          git diff --cached --exit-code && {
            echo "No generated asset diff to commit."
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync Phase 4 Portfolio production assets"

      - name: Guard target branch against races and push
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${remote}" = "${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
