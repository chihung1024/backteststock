name: Repair Portfolio Exposure L1 Integration

on:
  push:
    branches:
      - feat/portfolio-weight-defined-exposure
    paths:
      - .github/workflows/repair-portfolio-exposure-l1-integration.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Preserve existing ledger constructor and rebalance adapter contracts
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('apps/api/app/portfolio/ledger.py')
          text = path.read_text()

          start = text.index('@dataclass(slots=True)\nclass PortfolioLedger:')
          end = text.index('\n\ndef align_portfolio_components', start)
          replacement = dedent('''\
          @dataclass(slots=True)
          class PortfolioLedger:
              # Keep the established constructor prefix stable. Quant fixtures and
              # Walk-Forward OOS construct this shared ledger directly; new exposure
              # diagnostics therefore remain optional and derive from existing truth.
              name: str
              symbols: tuple[str, ...]
              target_allocation: dict[str, float]
              equity: pd.Series
              return_index: pd.Series
              daily_returns: pd.Series
              external_flows: pd.Series
              income: pd.Series
              cumulative_income: pd.Series
              cash: pd.Series
              debt: pd.Series
              gross_exposure: pd.Series
              allocation_history: pd.DataFrame
              transaction_costs: float
              borrowing_costs: float
              rebalance_count: int
              events: list[LedgerEvent]
              warnings: list[str]
              liquidated: bool
              contract_version: str = PORTFOLIO_LEDGER_CONTRACT_VERSION
              target_asset_mix: dict[str, float] | None = None
              target_gross_exposure_ratio: float | None = None
              target_cash_allocation: float | None = None
              net_exposure: pd.Series | None = None
              gross_exposure_ratio: pd.Series | None = None
              net_exposure_ratio: pd.Series | None = None
              leverage_reset_count: int = 0

              def __post_init__(self) -> None:
                  target_gross = (
                      float(sum(self.target_allocation.values()))
                      if self.target_gross_exposure_ratio is None
                      else float(self.target_gross_exposure_ratio)
                  )
                  self.target_gross_exposure_ratio = target_gross
                  if self.target_asset_mix is None:
                      if target_gross > _EPSILON:
                          self.target_asset_mix = {
                              symbol: float(self.target_allocation.get(symbol, 0.0)) / target_gross
                              for symbol in self.symbols
                          }
                      else:
                          self.target_asset_mix = {symbol: 0.0 for symbol in self.symbols}
                  if self.target_cash_allocation is None:
                      self.target_cash_allocation = max(1.0 - target_gross, 0.0)

                  if self.net_exposure is None:
                      self.net_exposure = self.gross_exposure.astype(float).copy().rename(
                          "net_exposure"
                      )
                  if self.gross_exposure_ratio is None:
                      self.gross_exposure_ratio = _derive_exposure_ratio(
                          self.gross_exposure,
                          self.equity,
                          "gross_exposure_ratio",
                      )
                  if self.net_exposure_ratio is None:
                      self.net_exposure_ratio = _derive_exposure_ratio(
                          self.net_exposure,
                          self.equity,
                          "net_exposure_ratio",
                      )

              @property
              def final_allocation(self) -> dict[str, float]:
                  if self.allocation_history.empty:
                      return {symbol: 0.0 for symbol in self.symbols}
                  row = self.allocation_history.iloc[-1]
                  return {symbol: float(row.get(symbol, 0.0)) for symbol in self.symbols}


          def _derive_exposure_ratio(
              exposure: pd.Series,
              equity: pd.Series,
              name: str,
          ) -> pd.Series:
              aligned_exposure = exposure.reindex(equity.index).astype(float)
              aligned_equity = equity.astype(float)
              result = pd.Series(0.0, index=equity.index, dtype=float, name=name)
              valid = aligned_equity > _EPSILON
              result.loc[valid] = aligned_exposure.loc[valid] / aligned_equity.loc[valid]
              return result
          ''')
          text = text[:start] + replacement.rstrip() + text[end:]

          signature = dedent('''\
          def _rebalance(
              asset_values: np.ndarray,
              debt: float,
              cash: float,
              policy: ExposurePolicy,
              leverage: LeverageConfig,
              transaction_cost_bps: float,
          ) -> tuple[np.ndarray, float, float, float, float]:
              equity = _state_equity(asset_values, cash, debt)
          ''')
          adapter = dedent('''\
          def _rebalance(
              asset_values: np.ndarray,
              debt: float,
              cash: float,
              policy: ExposurePolicy | np.ndarray,
              leverage: LeverageConfig,
              transaction_cost_bps: float,
          ) -> tuple[np.ndarray, float, float, float, float]:
              # Walk-Forward OOS already consumes this shared helper with a target
              # weight vector. Adapt that existing call immediately into the same
              # ExposurePolicy rather than creating a second rebalance authority.
              if not isinstance(policy, ExposurePolicy):
                  policy = _exposure_policy(np.asarray(policy, dtype=float), leverage)
              equity = _state_equity(asset_values, cash, debt)
          ''')
          if text.count(signature) != 1:
              raise SystemExit('expected _rebalance signature not found exactly once')
          text = text.replace(signature, adapter)
          path.write_text(text)
          PY

      - name: Add focused compatibility regressions
        run: |
          cat > tests/test_portfolio_ledger_compatibility.py <<'PY'
          from __future__ import annotations

          import numpy as np
          import pandas as pd
          import pytest

          from apps.api.app.portfolio.ledger import PortfolioLedger, _rebalance
          from apps.api.app.portfolio.models import LeverageConfig


          def test_legacy_portfolio_ledger_constructor_derives_new_exposure_diagnostics() -> None:
              index = pd.to_datetime(["2024-01-02", "2024-01-03"])
              equity = pd.Series([100.0, 110.0], index=index, name="equity")
              zeros = pd.Series(0.0, index=index, dtype=float)
              gross = equity.rename("gross_exposure")
              ledger = PortfolioLedger(
                  name="legacy fixture",
                  symbols=("AAA",),
                  target_allocation={"AAA": 1.0},
                  equity=equity,
                  return_index=pd.Series([1.0, 1.1], index=index, name="return_index"),
                  daily_returns=pd.Series([0.0, 0.1], index=index, name="daily_return"),
                  external_flows=zeros.rename("external_flow"),
                  income=zeros.rename("income"),
                  cumulative_income=zeros.rename("cumulative_income"),
                  cash=zeros.rename("cash"),
                  debt=zeros.rename("debt"),
                  gross_exposure=gross,
                  allocation_history=pd.DataFrame({"AAA": [1.0, 1.0]}, index=index),
                  transaction_costs=0.0,
                  borrowing_costs=0.0,
                  rebalance_count=0,
                  events=[],
                  warnings=[],
                  liquidated=False,
              )

              assert ledger.target_asset_mix == {"AAA": 1.0}
              assert ledger.target_gross_exposure_ratio == pytest.approx(1.0)
              assert ledger.target_cash_allocation == pytest.approx(0.0)
              assert ledger.leverage_reset_count == 0
              assert ledger.net_exposure.tolist() == pytest.approx([100.0, 110.0])
              assert ledger.gross_exposure_ratio.tolist() == pytest.approx([1.0, 1.0])
              assert ledger.net_exposure_ratio.tolist() == pytest.approx([1.0, 1.0])


          def test_existing_weight_vector_rebalance_adapter_uses_same_policy_authority() -> None:
              assets = np.asarray([110.0, 0.0], dtype=float)
              target_weights = np.asarray([0.0, 1.0], dtype=float)

              target, debt, cash, cost, traded = _rebalance(
                  assets,
                  0.0,
                  0.0,
                  target_weights,
                  LeverageConfig(),
                  100.0,
              )

              assert traded == pytest.approx(220.0)
              assert cost == pytest.approx(2.2)
              assert target.tolist() == pytest.approx([0.0, 107.8])
              assert debt == pytest.approx(0.0)
              assert cash == pytest.approx(0.0)
          PY

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile and run full Python regression
        run: |
          set -euo pipefail
          python -m compileall -q api apps scripts tests
          ruff check api apps scripts tests
          python -m pytest -q

      - name: Commit only verified integration repair
        run: |
          set -euo pipefail
          rm .github/workflows/repair-portfolio-exposure-l1-integration.yml
          git status --short
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/api/app/portfolio/ledger.py \
            tests/test_portfolio_ledger_compatibility.py \
            .github/workflows/repair-portfolio-exposure-l1-integration.yml
          git diff --cached --check
          git commit -m "fix: preserve Portfolio ledger integration contracts"
          git push origin HEAD:feat/portfolio-weight-defined-exposure
