name: Implement Portfolio L2 API Contract

on:
  push:
    branches:
      - feat/portfolio-weight-defined-exposure
    paths:
      - .github/workflows/implement-portfolio-l2-api.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODEL_TEST_APPEND_BLOB: 091fd8865b8567b8fd137b34fe7f758280aa8019
      SERVICE_TEST_APPEND_BLOB: dd0b9ed68c7948e6e3f62c0f2f3de0a5dc1c8bc7
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Implement public weight admission and exposure serialization
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          models = Path('apps/api/app/portfolio/api_models.py')
          text = models.read_text()
          import_anchor = '    SimulationConfig,\n)'
          if text.count(import_anchor) != 1:
              raise SystemExit('expected SimulationConfig import anchor exactly once')
          text = text.replace(
              import_anchor,
              '    SimulationConfig,\n    WEIGHT_TOLERANCE,\n)',
              1,
          )
          schema = 'PORTFOLIO_API_SCHEMA_VERSION = "portfolio-v3-2026-08-04.1"'
          if text.count(schema) != 1:
              raise SystemExit('expected API schema version exactly once')
          text = text.replace(
              schema,
              'PORTFOLIO_API_SCHEMA_VERSION = "portfolio-v3-2026-08-15.1"',
              1,
          )
          weight_field = '    weight: float = Field(gt=0.0, le=100.0)'
          if text.count(weight_field) != 1:
              raise SystemExit('expected public weight field exactly once')
          text = text.replace(
              weight_field,
              '    weight: float = Field(gt=0.0, le=500.0)',
              1,
          )

          old_total = dedent('''\
              total = sum(asset.weight for asset in self.assets)
              if abs(total - 100.0) > 0.05:
                  raise ValueError(f"portfolio weights must total 100%, received {total:.4f}%")
          ''')
          new_total = dedent('''\
              total = sum(asset.weight for asset in self.assets)
              if total > 500.0:
                  raise ValueError(
                      "portfolio target gross exposure cannot exceed 500%, "
                      f"received {total:.4f}%"
                  )
          ''')
          old_total = ''.join(f'        {line}\n' if line else '\n' for line in old_total.splitlines())
          new_total = ''.join(f'        {line}\n' if line else '\n' for line in new_total.splitlines())
          if text.count(old_total) != 1:
              raise SystemExit('expected legacy 100% validator exactly once')
          text = text.replace(old_total, new_total, 1)

          anchor = dedent('''\
              names = [portfolio.name for portfolio in self.portfolios]
              if len(names) != len(set(names)):
                  raise ValueError("portfolio names must be unique")
              if self.benchmark:
          ''')
          replacement = dedent('''\
              names = [portfolio.name for portfolio in self.portfolios]
              if len(names) != len(set(names)):
                  raise ValueError("portfolio names must be unique")
              if self.leverage.type != LeverageType.NONE:
                  ambiguous = [
                      portfolio.name
                      for portfolio in self.portfolios
                      if abs(
                          sum(asset.weight for asset in portfolio.assets) / 100.0 - 1.0
                      ) > WEIGHT_TOLERANCE
                  ]
                  if ambiguous:
                      raise ValueError(
                          "explicit legacy leverage requires 100% asset weights; "
                          "non-100% weights already define residual cash or gross exposure: "
                          + ", ".join(ambiguous)
                      )
              if self.benchmark:
          ''')
          anchor = ''.join(f'        {line}\n' if line else '\n' for line in anchor.splitlines())
          replacement = ''.join(f'        {line}\n' if line else '\n' for line in replacement.splitlines())
          if text.count(anchor) != 1:
              raise SystemExit('expected request validation anchor exactly once')
          models.write_text(text.replace(anchor, replacement, 1))

          service = Path('apps/api/app/portfolio/api_service.py')
          text = service.read_text()
          old_frame = dedent('''\
              "cash": ledger.cash,
              "debt": ledger.debt,
              "gross_exposure": ledger.gross_exposure,
          ''')
          new_frame = dedent('''\
              "cash": ledger.cash,
              "debt": ledger.debt,
              "gross_exposure": ledger.gross_exposure,
              "net_exposure": ledger.net_exposure,
              "gross_exposure_ratio": ledger.gross_exposure_ratio,
              "net_exposure_ratio": ledger.net_exposure_ratio,
          ''')
          old_frame = ''.join(f'                {line}\n' if line else '\n' for line in old_frame.splitlines())
          new_frame = ''.join(f'                {line}\n' if line else '\n' for line in new_frame.splitlines())
          if text.count(old_frame) != 1:
              raise SystemExit('expected serialization frame anchor exactly once')
          text = text.replace(old_frame, new_frame, 1)

          old_payload = dedent('''\
              "target_allocation": ledger.target_allocation,
              "final_allocation": ledger.final_allocation,
              "series": [
          ''')
          new_payload = dedent('''\
              "target_allocation": ledger.target_allocation,
              "target_asset_mix": ledger.target_asset_mix,
              "target_gross_exposure_ratio": ledger.target_gross_exposure_ratio,
              "target_cash_allocation": ledger.target_cash_allocation,
              "final_allocation": ledger.final_allocation,
              "leverage_reset_count": ledger.leverage_reset_count,
              "series": [
          ''')
          old_payload = ''.join(f'            {line}\n' if line else '\n' for line in old_payload.splitlines())
          new_payload = ''.join(f'            {line}\n' if line else '\n' for line in new_payload.splitlines())
          if text.count(old_payload) != 1:
              raise SystemExit('expected payload exposure anchor exactly once')
          service.write_text(text.replace(old_payload, new_payload, 1))
          PY

      - name: Update exact API regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('tests/test_portfolio_api_models.py')
          text = path.read_text()
          old_name = 'def test_request_rejects_extra_fields_duplicate_symbols_and_invalid_weight_total() -> None:'
          new_name = 'def test_request_rejects_extra_fields_duplicate_symbols_and_excess_gross_exposure() -> None:'
          if text.count(old_name) != 1:
              raise SystemExit('expected legacy model test name exactly once')
          text = text.replace(old_name, new_name, 1)

          old = dedent('''\
              payload = _payload()
              payload["portfolios"][0]["assets"][0]["weight"] = 50
              with pytest.raises(ValidationError, match="must total 100"):
                  PortfolioRequest.model_validate(payload)
          ''')
          new = dedent('''\
              payload = _payload()
              payload["portfolios"][0]["assets"] = [
                  {"symbol": "SPY", "weight": 450},
                  {"symbol": "QQQ", "weight": 60},
              ]
              with pytest.raises(ValidationError, match="cannot exceed 500"):
                  PortfolioRequest.model_validate(payload)
          ''')
          old = ''.join(f'    {line}\n' if line else '\n' for line in old.splitlines())
          new = ''.join(f'    {line}\n' if line else '\n' for line in new.splitlines())
          if text.count(old) != 1:
              raise SystemExit('expected legacy invalid-total test exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

          fetch_blob_text() {
            local sha="$1"
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | python -c 'import base64,json,sys; print(base64.b64decode(json.load(sys.stdin)["content"]).decode(), end="")'
          }

          fetch_blob_text "${MODEL_TEST_APPEND_BLOB}" >> tests/test_portfolio_api_models.py
          fetch_blob_text "${SERVICE_TEST_APPEND_BLOB}" >> tests/test_portfolio_api_service.py

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run L2 targeted and full Python regression
        run: |
          set -euo pipefail
          python -m compileall -q api apps scripts tests
          ruff check api apps scripts tests
          pytest -q tests/test_portfolio_api_models.py tests/test_portfolio_api_service.py tests/test_portfolio_v3_api.py
          python -m pytest -q

      - name: Commit only verified L2 API implementation
        run: |
          set -euo pipefail
          rm .github/workflows/implement-portfolio-l2-api.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/api/app/portfolio/api_models.py \
            apps/api/app/portfolio/api_service.py \
            tests/test_portfolio_api_models.py \
            tests/test_portfolio_api_service.py \
            .github/workflows/implement-portfolio-l2-api.yml
          git diff --cached --check
          git commit -m "feat: expose weight-defined Portfolio API semantics"
          git push origin HEAD:feat/portfolio-weight-defined-exposure
