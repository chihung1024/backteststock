name: Internal 4A-7 Closeout Handoff Sync

on:
  push:
    branches:
      - internal-4a7-closeout-handoff

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply closeout handoff
        run: python scripts/internal_close_4a7_handoff.py

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git diff -- to_do_update_list.md .vercel-redeploy-trigger

      - name: Remove temporary updater and publish handoff branch
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/internal-4a7-closeout-handoff.yml scripts/internal_close_4a7_handoff.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- to_do_update_list.md .vercel-redeploy-trigger .github/workflows/internal-4a7-closeout-handoff.yml scripts/internal_close_4a7_handoff.py
          git commit -m "docs: record verified 4A-7 production closeout"
          git push origin HEAD:internal-4a7-closeout-handoff
