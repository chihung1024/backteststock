name: Internal Parameter Tuning Capacity Benchmark

on:
  pull_request:
    branches:
      - feat/optimizer-hub-parameter-optimization

permissions:
  contents: read

jobs:
  benchmark:
    if: github.head_ref == 'internal-4b3-capacity-benchmark-20260819'
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidates: 2
            folds: 3
          - candidates: 12
            folds: 3
          - candidates: 12
            folds: 6
          - candidates: 24
            folds: 3
          - candidates: 24
            folds: 6
          - candidates: 48
            folds: 3
          - candidates: 48
            folds: 6
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: ${{ github.workspace }}
      BENCHMARK_CANDIDATES: ${{ matrix.candidates }}
      BENCHMARK_FOLDS: ${{ matrix.folds }}
      BENCHMARK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run exact tuning capacity case
        run: python .github/benchmark/run_capacity_case.py
      - name: Upload capacity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: parameter-tuning-capacity-${{ matrix.candidates }}-${{ matrix.folds }}-${{ github.event.pull_request.head.sha }}
          path: parameter-tuning-capacity-${{ matrix.candidates }}-${{ matrix.folds }}.json
          if-no-files-found: error
          retention-days: 7
