name: Apply scan backend performance fix

on:
  push:
    branches: [fix/scan-output-and-performance]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/scan-output-and-performance
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Patch metrics and scan endpoint
        run: |
          python <<'PY'
          from pathlib import Path

          metrics_path = Path("api/metrics.py")
          metrics = metrics_path.read_text(encoding="utf-8")
          anchor = 'METRIC_DEFINITION_VERSION = "2026-08-01.1"\n'
          if metrics.count(anchor) != 1:
              raise SystemExit(f"metric version anchor count={metrics.count(anchor)}")
          metrics = metrics.replace(
              anchor,
              anchor + 'FINGERPRINT_ALGORITHM = "sha256-le-i8-f8-v1"\n',
              1,
          )
          start = metrics.index("def series_fingerprint")
          end = metrics.index("\ndef benchmark_coverage", start)
          new_block = '''def _canonical_float64(values) -> np.ndarray:
              array = np.asarray(values, dtype=np.float64)
              if np.isnan(array).any():
                  array = array.copy()
                  array[np.isnan(array)] = np.nan
              return array.astype("<f8", copy=False)


          def series_fingerprint(history) -> str | None:
              """Hash normalized dates and values as canonical little-endian records."""
              values = normalize_value_series(history)
              if values.empty:
                  return None
              records = np.empty(
                  len(values),
                  dtype=np.dtype([("date", "<i8"), ("value", "<f8")], align=False),
              )
              records["date"] = np.asarray(values.index.asi8, dtype="<i8")
              records["value"] = _canonical_float64(values.to_numpy())
              digest = hashlib.sha256()
              digest.update(f"{FINGERPRINT_ALGORITHM}:series\\0".encode("ascii"))
              digest.update(records.tobytes(order="C"))
              return digest.hexdigest()


          def aligned_fingerprint(asset_history, benchmark_history) -> str | None:
              """Hash benchmark-calendar pairs without Python row iteration."""
              asset = normalize_value_series(asset_history, name="asset")
              benchmark = normalize_value_series(benchmark_history, name="benchmark")
              if benchmark.empty:
                  return None
              aligned_asset = asset.reindex(benchmark.index)
              records = np.empty(
                  len(benchmark),
                  dtype=np.dtype(
                      [("date", "<i8"), ("asset", "<f8"), ("benchmark", "<f8")],
                      align=False,
                  ),
              )
              records["date"] = np.asarray(benchmark.index.asi8, dtype="<i8")
              records["asset"] = _canonical_float64(aligned_asset.to_numpy())
              records["benchmark"] = _canonical_float64(benchmark.to_numpy())
              digest = hashlib.sha256()
              digest.update(f"{FINGERPRINT_ALGORITHM}:aligned\\0".encode("ascii"))
              digest.update(records.tobytes(order="C"))
              return digest.hexdigest()

          '''
          metrics = metrics[:start] + new_block + metrics[end + 1:]
          metadata_anchor = '        "scipy_version": package_version("scipy"),\n'
          if metrics.count(metadata_anchor) != 1:
              raise SystemExit("scipy metadata anchor missing")
          metrics = metrics.replace(
              metadata_anchor,
              metadata_anchor + '        "fingerprint_algorithm": FINGERPRINT_ALGORITHM,\n',
              1,
          )
          metrics_path.write_text(metrics, encoding="utf-8")

          scan_path = Path("api/scan_v2.py")
          scan = scan_path.read_text(encoding="utf-8")
          scan = scan.replace("import logging\n", "import logging\nimport time\n", 1)
          scan = scan.replace(
              "def scan_handler():\n    raw_tickers = []\n",
              "def scan_handler():\n    request_started = time.perf_counter()\n    raw_tickers = []\n",
              1,
          )
          block_start = scan.index("        # Resolve the one shared benchmark independently")
          block_end = scan.index("\n\n        shared_metadata = reproducibility_metadata", block_start)
          download_block = '''        # Fetch benchmark and assets together. The finite downloader retries
                  # only unresolved symbols, so a missing benchmark is retried alone and
                  # never invalidates otherwise usable asset histories.
                  market_started = time.perf_counter()
                  resolved, unresolved = legacy.download_prices_finitely(
                      legacy.deduplicate([benchmark_ticker, *tickers]),
                      start_text,
                      end_text,
                  )
                  market_duration_ms = (time.perf_counter() - market_started) * 1000
                  unresolved_set = set(unresolved)
                  benchmark_prices = resolved.get(benchmark_ticker)
                  benchmark_available = (
                      benchmark_ticker not in unresolved_set
                      and benchmark_prices is not None
                      and not benchmark_prices.empty
                  )

                  compute_started = time.perf_counter()'''
          scan = scan[:block_start] + download_block + scan[block_end:]
          scan = scan.replace(
              '            notes.append(f"再現資訊 {reproducibility}")\n',
              "",
              1,
          )
          note_line = '                    "note": f"（{\'；\'.join(notes)}）",\n'
          if scan.count(note_line) != 1:
              raise SystemExit(f"note line count={scan.count(note_line)}")
          scan = scan.replace(
              note_line,
              '                    "note": f"（{\'；\'.join(notes)}）" if notes else None,\n',
              1,
          )
          return_anchor = "        return jsonify(results)\n"
          if scan.count(return_anchor) != 1:
              raise SystemExit(f"return anchor count={scan.count(return_anchor)}")
          response_block = '''        compute_duration_ms = (time.perf_counter() - compute_started) * 1000
                  serialize_started = time.perf_counter()
                  response = jsonify(results)
                  serialize_duration_ms = (time.perf_counter() - serialize_started) * 1000
                  total_duration_ms = (time.perf_counter() - request_started) * 1000
                  response.headers["Server-Timing"] = ", ".join(
                      [
                          f"market;dur={market_duration_ms:.1f}",
                          f"compute;dur={compute_duration_ms:.1f}",
                          f"serialize;dur={serialize_duration_ms:.1f}",
                          f"total;dur={total_duration_ms:.1f}",
                      ]
                  )
                  response.headers["X-Scan-Requested"] = str(len(tickers))
                  response.headers["X-Scan-Resolved"] = str(
                      sum(1 for item in results if item.get("status") == "ok")
                  )
                  return response
          '''
          scan = scan.replace(return_anchor, response_block, 1)
          scan_path.write_text(scan, encoding="utf-8")

          Path(".github/workflows/apply-scan-output-performance-fix.yml").unlink()
          PY
      - name: Commit backend changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Speed up scan fingerprints and expose phase timing"
          git push origin HEAD:fix/scan-output-and-performance
