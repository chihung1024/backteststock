name: Margin Band Contract Once

on:
  push:
    branches:
      - fix/portfolio-margin-band-20260827
    paths:
      - ".github/workflows/margin-band-contract-once.yml"

permissions:
  contents: write

jobs:
  apply-check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-margin-band-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply first-principles margin-band contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Domain model: separate target exposure from maintenance policy.
          replace(
              "apps/api/app/portfolio/models.py",
              '''class LeverageType(StrEnum):\n    NONE = "none"\n    FIXED_RATIO = "fixed_ratio"\n    FIXED_DEBT = "fixed_debt"\n''',
              '''class LeverageType(StrEnum):\n    NONE = "none"\n    FIXED_RATIO = "fixed_ratio"\n    FIXED_DEBT = "fixed_debt"\n\n\nclass ExposureMaintenanceMode(StrEnum):\n    NONE = "none"\n    BAND = "band"\n    DAILY = "daily"\n''',
          )
          replace(
              "apps/api/app/portfolio/models.py",
              '''@dataclass(frozen=True, slots=True)\nclass SimulationConfig:\n''',
              '''@dataclass(frozen=True, slots=True)\nclass ExposureMaintenanceConfig:\n    mode: ExposureMaintenanceMode = ExposureMaintenanceMode.BAND\n    tolerance_percent: float = 10.0\n\n    def __post_init__(self) -> None:\n        tolerance = float(self.tolerance_percent)\n        if not math.isfinite(tolerance) or tolerance <= 0.0 or tolerance > 100.0:\n            raise ValueError("exposure maintenance tolerance must be in (0, 100]")\n        object.__setattr__(self, "tolerance_percent", tolerance)\n\n\n@dataclass(frozen=True, slots=True)\nclass SimulationConfig:\n''',
          )
          replace(
              "apps/api/app/portfolio/models.py",
              '''    leverage: LeverageConfig = field(default_factory=LeverageConfig)\n    risk_free_rate: float = 0.0\n''',
              '''    leverage: LeverageConfig = field(default_factory=LeverageConfig)\n    exposure_maintenance: ExposureMaintenanceConfig = field(\n        default_factory=ExposureMaintenanceConfig\n    )\n    risk_free_rate: float = 0.0\n''',
          )

          # API contract.
          replace(
              "apps/api/app/portfolio/api_models.py",
              '''    CashflowType,\n    LeverageConfig,\n''',
              '''    CashflowType,\n    ExposureMaintenanceConfig,\n    ExposureMaintenanceMode,\n    LeverageConfig,\n''',
          )
          replace(
              "apps/api/app/portfolio/api_models.py",
              '''PORTFOLIO_API_SCHEMA_VERSION = "portfolio-v3-2026-08-15.1"''',
              '''PORTFOLIO_API_SCHEMA_VERSION = "portfolio-v3-2026-08-27.2"''',
          )
          replace(
              "apps/api/app/portfolio/api_models.py",
              '''class AnalyticsInput(BaseModel):\n''',
              '''class ExposureMaintenanceInput(BaseModel):\n    model_config = ConfigDict(extra="forbid")\n\n    mode: ExposureMaintenanceMode = ExposureMaintenanceMode.BAND\n    tolerance_percent: float = Field(default=10.0, gt=0.0, le=100.0)\n\n    def to_config(self) -> ExposureMaintenanceConfig:\n        return ExposureMaintenanceConfig(\n            mode=self.mode,\n            tolerance_percent=self.tolerance_percent,\n        )\n\n\nclass AnalyticsInput(BaseModel):\n''',
          )
          replace(
              "apps/api/app/portfolio/api_models.py",
              '''    leverage: LeverageInput = Field(default_factory=LeverageInput)\n    analytics: AnalyticsInput = Field(default_factory=AnalyticsInput)\n''',
              '''    leverage: LeverageInput = Field(default_factory=LeverageInput)\n    exposure_maintenance: ExposureMaintenanceInput = Field(\n        default_factory=ExposureMaintenanceInput\n    )\n    analytics: AnalyticsInput = Field(default_factory=AnalyticsInput)\n''',
          )
          replace(
              "apps/api/app/portfolio/api_models.py",
              '''            leverage=self.leverage.to_config(),\n            risk_free_rate=self.analytics.risk_free_rate_percent / 100.0,\n''',
              '''            leverage=self.leverage.to_config(),\n            exposure_maintenance=self.exposure_maintenance.to_config(),\n            risk_free_rate=self.analytics.risk_free_rate_percent / 100.0,\n''',
          )

          # Ledger contract and policy.
          replace(
              "apps/api/app/portfolio/ledger.py",
              '''    CashflowTiming,\n    CashflowType,\n    LedgerEvent,\n''',
              '''    CashflowTiming,\n    CashflowType,\n    ExposureMaintenanceMode,\n    LedgerEvent,\n''',
          )
          replace(
              "apps/api/app/portfolio/ledger.py",
              '''PORTFOLIO_LEDGER_CONTRACT_VERSION = "portfolio-ledger-twd-2026-08-27.1"''',
              '''PORTFOLIO_LEDGER_CONTRACT_VERSION = "portfolio-ledger-twd-2026-08-27.2"''',
          )
          replace(
              "apps/api/app/portfolio/ledger.py",
              '''    target_gross_ratio: float\n    target_cash_ratio: float\n    daily_reset_ratio: float | None\n    fixed_debt: bool\n''',
              '''    target_gross_ratio: float\n    target_cash_ratio: float\n    fixed_debt: bool\n''',
          )
          replace(
              "apps/api/app/portfolio/ledger.py",
              '''    Asset weights are equity-relative target exposures. Totals below 1.0 leave\n    residual cash; totals above 1.0 create financed gross exposure. Any\n    non-100% gross exposure is reset at each close while preserving the\n    current asset mix unless allocation rebalance independently fires.\n''',
              '''    Asset weights are equity-relative target exposures. Totals below 1.0 leave\n    residual cash; totals above 1.0 create margin-financed gross exposure.\n    Market movement alone never changes shares or loan principal. Exposure\n    maintenance is an explicit policy: margin-band repair is the default for\n    financed portfolios, while daily constant exposure remains opt-in.\n''',
          )
          replace(
              "apps/api/app/portfolio/ledger.py",
              '''    liquidated = False\n    events: list[LedgerEvent] = []\n''',
              '''    liquidated = False\n    pending_band_repair: np.ndarray | None = None\n    pending_band_signal_date: str | None = None\n    events: list[LedgerEvent] = []\n''',
          )
          replace(
              "apps/api/app/portfolio/ledger.py",
              '''        interest = debt * annual_interest_rate * calendar_days / 365.2425\n        if interest > 0.0:\n            cash -= interest\n            borrowing_costs += interest\n            events.append(\n                LedgerEvent(\n                    date=timestamp.date().isoformat(),\n                    type="borrowing_interest",\n                    details={\n                        "amount": interest,\n                        "debt_before_interest": debt,\n                        "calendar_days": calendar_days,\n                        "annual_interest_rate_percent": (\n                            config.leverage.annual_interest_rate_percent\n                        ),\n                    },\n                )\n            )\n''',
              '''        interest = debt * annual_interest_rate * calendar_days / 365.2425\n        if interest > 0.0:\n            debt_before_interest = debt\n            debt += interest\n            borrowing_costs += interest\n            events.append(\n                LedgerEvent(\n                    date=timestamp.date().isoformat(),\n                    type="borrowing_interest",\n                    details={\n                        "amount": interest,\n                        "debt_before_interest": debt_before_interest,\n                        "debt_after_interest": debt,\n                        "calendar_days": calendar_days,\n                        "annual_interest_rate_percent": (\n                            config.leverage.annual_interest_rate_percent\n                        ),\n                    },\n                )\n            )\n''',
          )

          old_trade = '''        else:\n            periodic = bool(rebalance_mask[position]) and (\n                config.rebalancing.frequency != RebalanceFrequency.NONE\n            )\n            threshold = False\n            if (\n                config.rebalancing.threshold_percent is not None\n                and execution_eligible[position]\n            ):\n                threshold = _threshold_breached(\n                    asset_values,\n                    debt,\n                    cash,\n                    policy,\n                    config.rebalancing.threshold_percent / 100.0,\n                )\n\n            if periodic or threshold:\n                trigger = (\n                    "periodic_and_threshold"\n                    if periodic and threshold\n                    else ("periodic" if periodic else "threshold")\n                )\n                gross_before = _gross_exposure(asset_values)\n                debt_before = debt\n                asset_values, debt, cash, cost, traded_notional = _rebalance(\n                    asset_values,\n                    debt,\n                    cash,\n                    policy,\n                    config.leverage,\n                    config.transaction_cost_bps,\n                )\n                transaction_costs += cost\n                rebalance_count += 1\n                events.append(\n                    LedgerEvent(\n                        date=timestamp.date().isoformat(),\n                        type="rebalance",\n                        details={\n                            "trigger": trigger,\n                            "traded_notional": traded_notional,\n                            "transaction_cost": cost,\n                            "gross_exposure_before": gross_before,\n                            "gross_exposure_after": _gross_exposure(asset_values),\n                            "target_gross_ratio": policy.target_gross_ratio,\n                            "target_cash_ratio": policy.target_cash_ratio,\n                            "debt_before": debt_before,\n                            "target_debt": debt,\n                            "execution_clock": "common_native_market_observation",\n                        },\n                    )\n                )\n            elif policy.daily_reset_ratio is not None and execution_eligible[position]:\n                gross_before = _gross_exposure(asset_values)\n                debt_before = debt\n                (\n                    asset_values,\n                    debt,\n                    cash,\n                    cost,\n                    traded_notional,\n                ) = _reset_gross_exposure(\n                    asset_values,\n                    debt,\n                    cash,\n                    policy,\n                    config.transaction_cost_bps,\n                )\n                transaction_costs += cost\n                if traded_notional > _EPSILON:\n                    exposure_reset_count += 1\n                    events.append(\n                        LedgerEvent(\n                            date=timestamp.date().isoformat(),\n                            type="exposure_reset",\n                            details={\n                                "target_gross_ratio": policy.daily_reset_ratio,\n                                "gross_exposure_before": gross_before,\n                                "gross_exposure_after": _gross_exposure(asset_values),\n                                "debt_before": debt_before,\n                                "debt_after": debt,\n                                "traded_notional": traded_notional,\n                                "transaction_cost": cost,\n                                "asset_allocation_preserved": True,\n                                "execution_clock": "common_native_market_observation",\n                            },\n                        )\n                    )\n'''
          new_trade = '''        else:\n            periodic = bool(rebalance_mask[position]) and (\n                config.rebalancing.frequency != RebalanceFrequency.NONE\n            )\n            threshold = False\n            if (\n                config.rebalancing.threshold_percent is not None\n                and execution_eligible[position]\n            ):\n                threshold = _threshold_breached(\n                    asset_values,\n                    debt,\n                    cash,\n                    policy,\n                    config.rebalancing.threshold_percent / 100.0,\n                )\n\n            if periodic or threshold:\n                trigger = (\n                    "periodic_and_threshold"\n                    if periodic and threshold\n                    else ("periodic" if periodic else "threshold")\n                )\n                gross_before = _gross_exposure(asset_values)\n                debt_before = debt\n                asset_values, debt, cash, cost, traded_notional = _rebalance(\n                    asset_values,\n                    debt,\n                    cash,\n                    policy,\n                    config.leverage,\n                    config.transaction_cost_bps,\n                )\n                transaction_costs += cost\n                rebalance_count += 1\n                pending_band_repair = None\n                pending_band_signal_date = None\n                events.append(\n                    LedgerEvent(\n                        date=timestamp.date().isoformat(),\n                        type="rebalance",\n                        details={\n                            "trigger": trigger,\n                            "traded_notional": traded_notional,\n                            "transaction_cost": cost,\n                            "gross_exposure_before": gross_before,\n                            "gross_exposure_after": _gross_exposure(asset_values),\n                            "target_gross_ratio": policy.target_gross_ratio,\n                            "target_cash_ratio": policy.target_cash_ratio,\n                            "debt_before": debt_before,\n                            "target_debt": debt,\n                            "execution_clock": "common_native_market_observation",\n                        },\n                    )\n                )\n            else:\n                maintenance_mode = config.exposure_maintenance.mode\n                financed = (\n                    not policy.fixed_debt\n                    and policy.target_gross_ratio > 1.0 + WEIGHT_TOLERANCE\n                )\n                if (\n                    financed\n                    and maintenance_mode == ExposureMaintenanceMode.DAILY\n                    and execution_eligible[position]\n                ):\n                    gross_before = _gross_exposure(asset_values)\n                    debt_before = debt\n                    (\n                        asset_values,\n                        debt,\n                        cash,\n                        cost,\n                        traded_notional,\n                    ) = _reset_gross_exposure(\n                        asset_values,\n                        debt,\n                        cash,\n                        policy,\n                        config.transaction_cost_bps,\n                    )\n                    transaction_costs += cost\n                    if traded_notional > _EPSILON:\n                        exposure_reset_count += 1\n                        events.append(\n                            LedgerEvent(\n                                date=timestamp.date().isoformat(),\n                                type="exposure_reset",\n                                details={\n                                    "mode": "daily_constant_exposure",\n                                    "target_gross_ratio": policy.target_gross_ratio,\n                                    "gross_exposure_before": gross_before,\n                                    "gross_exposure_after": _gross_exposure(asset_values),\n                                    "debt_before": debt_before,\n                                    "debt_after": debt,\n                                    "traded_notional": traded_notional,\n                                    "transaction_cost": cost,\n                                    "asset_allocation_preserved": True,\n                                    "execution_clock": "common_native_market_observation",\n                                },\n                            )\n                        )\n                elif financed and maintenance_mode == ExposureMaintenanceMode.BAND:\n                    if pending_band_repair is not None and execution_eligible[position]:\n                        gross_before = _gross_exposure(asset_values)\n                        debt_before = debt\n                        breached_symbols = [\n                            symbol\n                            for symbol, breached in zip(\n                                symbols, pending_band_repair, strict=True\n                            )\n                            if breached\n                        ]\n                        (\n                            asset_values,\n                            debt,\n                            cash,\n                            cost,\n                            traded_notional,\n                        ) = _repair_exposure_band(\n                            asset_values,\n                            debt,\n                            cash,\n                            policy,\n                            pending_band_repair,\n                            config.transaction_cost_bps,\n                        )\n                        transaction_costs += cost\n                        if traded_notional > _EPSILON:\n                            exposure_reset_count += 1\n                            events.append(\n                                LedgerEvent(\n                                    date=timestamp.date().isoformat(),\n                                    type="exposure_band_repair",\n                                    details={\n                                        "signal_date": pending_band_signal_date,\n                                        "breached_symbols": breached_symbols,\n                                        "tolerance_percent": config.exposure_maintenance.tolerance_percent,\n                                        "gross_exposure_before": gross_before,\n                                        "gross_exposure_after": _gross_exposure(asset_values),\n                                        "debt_before": debt_before,\n                                        "debt_after": debt,\n                                        "traded_notional": traded_notional,\n                                        "transaction_cost": cost,\n                                        "repair_scope": "breached_assets_only",\n                                        "execution_clock": "next_common_native_market_observation",\n                                    },\n                                )\n                            )\n                        pending_band_repair = None\n                        pending_band_signal_date = None\n                    elif pending_band_repair is None:\n                        breached, deviations = _exposure_band_breaches(\n                            asset_values,\n                            debt,\n                            cash,\n                            policy,\n                            config.exposure_maintenance.tolerance_percent / 100.0,\n                        )\n                        if bool(breached.any()):\n                            pending_band_repair = breached\n                            pending_band_signal_date = timestamp.date().isoformat()\n                            events.append(\n                                LedgerEvent(\n                                    date=pending_band_signal_date,\n                                    type="exposure_band_signal",\n                                    details={\n                                        "breached_symbols": [\n                                            symbol\n                                            for symbol, flag in zip(\n                                                symbols, breached, strict=True\n                                            )\n                                            if flag\n                                        ],\n                                        "relative_deviations": {\n                                            symbol: float(deviation)\n                                            for symbol, deviation in zip(\n                                                symbols, deviations, strict=True\n                                            )\n                                        },\n                                        "tolerance_percent": config.exposure_maintenance.tolerance_percent,\n                                        "execution_policy": "next_common_native_market_observation",\n                                    },\n                                )\n                            )\n'''
          replace("apps/api/app/portfolio/ledger.py", old_trade, new_trade)

          replace(
              "apps/api/app/portfolio/ledger.py",
              '''    daily_reset = (\n        target_gross\n        if leverage.type != LeverageType.FIXED_DEBT\n        and abs(target_gross - 1.0) > WEIGHT_TOLERANCE\n        else None\n    )\n    return ExposurePolicy(\n        target_exposures=target_exposures,\n        target_asset_mix=target_mix,\n        target_gross_ratio=target_gross,\n        target_cash_ratio=target_cash,\n        daily_reset_ratio=daily_reset,\n        fixed_debt=leverage.type == LeverageType.FIXED_DEBT,\n    )\n''',
              '''    return ExposurePolicy(\n        target_exposures=target_exposures,\n        target_asset_mix=target_mix,\n        target_gross_ratio=target_gross,\n        target_cash_ratio=target_cash,\n        fixed_debt=leverage.type == LeverageType.FIXED_DEBT,\n    )\n''',
          )
          replace(
              "apps/api/app/portfolio/ledger.py",
              '''    if policy.daily_reset_ratio is not None:\n        fraction = min(remaining / equity, 1.0)\n        asset_values *= 1.0 - fraction\n        debt *= 1.0 - fraction\n        return asset_values, debt, cash\n''',
              '''    if (\n        not policy.fixed_debt\n        and policy.target_gross_ratio > 1.0 + WEIGHT_TOLERANCE\n    ):\n        fraction = min(remaining / equity, 1.0)\n        asset_values *= 1.0 - fraction\n        debt *= 1.0 - fraction\n        return asset_values, debt, cash\n''',
          )
          replace(
              "apps/api/app/portfolio/ledger.py",
              '''    target_ratio = policy.daily_reset_ratio\n    if target_ratio is None:\n        return asset_values, debt, cash, 0.0, 0.0\n''',
              '''    target_ratio = policy.target_gross_ratio\n    if abs(target_ratio - 1.0) <= WEIGHT_TOLERANCE or policy.fixed_debt:\n        return asset_values, debt, cash, 0.0, 0.0\n''',
          )
          replace(
              "apps/api/app/portfolio/ledger.py",
              '''def _solve_trade_target(\n''',
              '''def _exposure_band_breaches(\n    asset_values: np.ndarray,\n    debt: float,\n    cash: float,\n    policy: ExposurePolicy,\n    tolerance: float,\n) -> tuple[np.ndarray, np.ndarray]:\n    """Return equity-relative exposure breaches and their relative deviations."""\n\n    equity = _state_equity(asset_values, cash, debt)\n    deviations = np.zeros_like(policy.target_exposures, dtype=float)\n    if equity <= _EPSILON:\n        return np.zeros_like(policy.target_exposures, dtype=bool), deviations\n    current_exposures = asset_values / equity\n    deviations = np.abs(\n        current_exposures / policy.target_exposures - 1.0\n    )\n    breached = deviations + _EPSILON >= tolerance\n    return breached.astype(bool), deviations\n\n\ndef _repair_exposure_band(\n    asset_values: np.ndarray,\n    debt: float,\n    cash: float,\n    policy: ExposurePolicy,\n    breached: np.ndarray,\n    transaction_cost_bps: float,\n) -> tuple[np.ndarray, float, float, float, float]:\n    """Repair only breached equity-relative target exposures back to target."""\n\n    mask = np.asarray(breached, dtype=bool)\n    if mask.shape != asset_values.shape:\n        raise ValueError("exposure-band repair mask must match portfolio assets")\n    if not bool(mask.any()) or policy.fixed_debt:\n        return asset_values, debt, cash, 0.0, 0.0\n    equity = _state_equity(asset_values, cash, debt)\n    if equity <= _EPSILON:\n        return np.zeros_like(asset_values), 0.0, max(equity, 0.0), 0.0, 0.0\n\n    current_assets = asset_values.copy()\n    preserved_cash = max(cash, 0.0)\n\n    def target_builder(net_equity: float) -> tuple[np.ndarray, float, float]:\n        target_assets = current_assets.copy()\n        target_assets[mask] = policy.target_exposures[mask] * net_equity\n        target_debt = max(float(target_assets.sum()) + preserved_cash - net_equity, 0.0)\n        return target_assets, target_debt, preserved_cash\n\n    return _solve_trade_target(\n        asset_values,\n        equity,\n        transaction_cost_bps,\n        target_builder,\n    )\n\n\ndef _solve_trade_target(\n''',
          )

          # Frontend request/state contract.
          replace(
              "apps/portfolio-web/src/types.ts",
              '''export interface LeverageSettings {\n''',
              '''export interface ExposureMaintenanceSettings {\n  mode: "none" | "band" | "daily";\n  tolerancePercent: number;\n}\n\nexport interface LeverageSettings {\n''',
          )
          replace(
              "apps/portfolio-web/src/types.ts",
              '''  leverage: LeverageSettings;\n  analytics: AnalyticsSettings;\n''',
              '''  leverage: LeverageSettings;\n  exposureMaintenance: ExposureMaintenanceSettings;\n  analytics: AnalyticsSettings;\n''',
          )
          replace(
              "apps/portfolio-web/src/types.ts",
              '''  analytics: {\n''',
              '''  exposure_maintenance: {\n    mode: ExposureMaintenanceSettings["mode"];\n    tolerance_percent: number;\n  };\n  analytics: {\n''',
          )

          replace(
              "apps/portfolio-web/src/model.ts",
              '''    leverage: {\n      type: "none",\n      ratio: 1,\n      debtAmount: 0,\n      annualInterestRatePercent: 0,\n      maintenanceMarginPercent: 25,\n    },\n    analytics: {\n''',
              '''    leverage: {\n      type: "none",\n      ratio: 1,\n      debtAmount: 0,\n      annualInterestRatePercent: 0,\n      maintenanceMarginPercent: 25,\n    },\n    exposureMaintenance: {\n      mode: "band",\n      tolerancePercent: 10,\n    },\n    analytics: {\n''',
          )
          replace(
              "apps/portfolio-web/src/model.ts",
              '''      detail: "每日重設總曝險；內部比例依再平衡設定",\n''',
              '''      detail: "現金部位自然漂移；內部比例依再平衡設定",\n''',
          )
          replace(
              "apps/portfolio-web/src/model.ts",
              '''    detail: "每日重設總曝險；內部比例依再平衡設定",\n''',
              '''    detail: "融資曝險依維持模式控制；內部比例依再平衡設定",\n''',
          )
          replace(
              "apps/portfolio-web/src/model.ts",
              '''  if (model.leverage.type === "fixed_debt" && model.leverage.debtAmount <= 0) {\n    issues.push({ field: "leverage", message: "固定借款金額必須大於 0。" });\n  }\n  return issues;\n''',
              '''  if (model.leverage.type === "fixed_debt" && model.leverage.debtAmount <= 0) {\n    issues.push({ field: "leverage", message: "固定借款金額必須大於 0。" });\n  }\n  if (\n    !Number.isFinite(model.exposureMaintenance.tolerancePercent)\n    || model.exposureMaintenance.tolerancePercent <= 0\n    || model.exposureMaintenance.tolerancePercent > 100\n  ) {\n    issues.push({ field: "exposureMaintenance", message: "曝險容忍帶必須介於 0% 到 100% 之間。" });\n  }\n  return issues;\n''',
          )
          replace(
              "apps/portfolio-web/src/model.ts",
              '''    leverage: {\n      type: model.leverage.type,\n      ratio: model.leverage.ratio,\n      debt_amount: model.leverage.debtAmount,\n      annual_interest_rate_percent: model.leverage.annualInterestRatePercent,\n      maintenance_margin_percent: model.leverage.maintenanceMarginPercent,\n    },\n    analytics: {\n''',
              '''    leverage: {\n      type: model.leverage.type,\n      ratio: model.leverage.ratio,\n      debt_amount: model.leverage.debtAmount,\n      annual_interest_rate_percent: model.leverage.annualInterestRatePercent,\n      maintenance_margin_percent: model.leverage.maintenanceMarginPercent,\n    },\n    exposure_maintenance: {\n      mode: model.exposureMaintenance.mode,\n      tolerance_percent: model.exposureMaintenance.tolerancePercent,\n    },\n    analytics: {\n''',
          )
          replace(
              "apps/portfolio-web/src/model.ts",
              '''    leverage: { ...fallback.leverage, ...(raw.leverage || {}) },\n    analytics: { ...fallback.analytics, ...(raw.analytics || {}) },\n''',
              '''    leverage: { ...fallback.leverage, ...(raw.leverage || {}) },\n    exposureMaintenance: {\n      ...fallback.exposureMaintenance,\n      ...(raw.exposureMaintenance || {}),\n    },\n    analytics: { ...fallback.analytics, ...(raw.analytics || {}) },\n''',
          )

          old_settings = '''        <div className="notice info" style={{ gridColumn: "1 / -1", margin: 0 }}>\n          <strong>總曝險與內部再平衡分開計算</strong>\n          <p>每組權重總和就是該投組的目標總曝險。非 100% 投組每日只重設總曝險；資產內部比例只有定期或偏離門檻再平衡觸發時才回到目標。</p>\n        </div>\n'''
          new_settings = '''        <div className="notice info" style={{ gridColumn: "1 / -1", margin: 0 }}>\n          <strong>融資持倉與槓桿 ETF 分開建模</strong>\n          <p>權重總和高於 100% 時代表真實融資持倉：價格變動不會自動改變股數或借款本金。預設只有單一標的相對目標曝險偏離達容忍帶時才建立訊號，並在下一個所有成分股共同可交易日只修復超限標的。每日固定曝險僅供槓桿 ETF 式研究。</p>\n        </div>\n        <label className="field">\n          <span>融資曝險維持</span>\n          <select value={model.exposureMaintenance.mode} onChange={(event) => setModel((current) => ({ ...current, exposureMaintenance: { ...current.exposureMaintenance, mode: event.target.value as WorkspaceModel["exposureMaintenance"]["mode"] } }))}>\n            <option value="band">容忍帶（建議）</option>\n            <option value="none">自然漂移，不自動維持</option>\n            <option value="daily">每日固定曝險（槓桿 ETF 式）</option>\n          </select>\n        </label>\n        {model.exposureMaintenance.mode === "band" && <NumberField label="曝險相對容忍帶" value={model.exposureMaintenance.tolerancePercent} min={0.1} max={100} step={0.1} suffix="%" onChange={(value) => setModel((current) => ({ ...current, exposureMaintenance: { ...current.exposureMaintenance, tolerancePercent: value } }))} />}\n'''
          replace("apps/portfolio-web/src/SettingsPanels.tsx", old_settings, new_settings)

          print("margin-band source patches applied")
          PY
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Verify quantitative invariants
        run: |
          python - <<'PY'
          from types import SimpleNamespace
          import numpy as np
          import pandas as pd

          from apps.api.app.portfolio.ledger import simulate_portfolio_ledger
          from apps.api.app.portfolio.models import (
              ExposureMaintenanceConfig,
              ExposureMaintenanceMode,
              LeverageConfig,
              PortfolioSpec,
              SimulationConfig,
          )

          def history(index, returns):
              returns = pd.Series(returns, index=index, dtype=float)
              valuation = SimpleNamespace(native_observation_mask=pd.Series(True, index=index))
              return SimpleNamespace(
                  daily_returns=returns,
                  price_returns=returns.copy(),
                  distribution_returns=pd.Series(0.0, index=index),
                  valuation=valuation,
              )

          # 200% margin position: 12.5% gain moves exposure to 180%; signal at T,
          # repair must wait until T+1 and restore 200%.
          idx = pd.DatetimeIndex(["2026-01-02", "2026-01-05", "2026-01-06"])
          ledger = simulate_portfolio_ledger(
              PortfolioSpec.from_weights("P", {"A": 2.0}),
              {"A": history(idx, [0.0, 0.125, 0.0])},
              SimulationConfig(initial_amount=100.0),
          )
          assert abs(ledger.gross_exposure_ratio.iloc[1] - 1.8) < 1e-10
          assert abs(ledger.gross_exposure_ratio.iloc[2] - 2.0) < 1e-10
          signal = [e for e in ledger.events if e.type == "exposure_band_signal"]
          repair = [e for e in ledger.events if e.type == "exposure_band_repair"]
          assert len(signal) == 1 and signal[0].date == "2026-01-05"
          assert len(repair) == 1 and repair[0].date == "2026-01-06"
          assert repair[0].details["signal_date"] == "2026-01-05"

          # A100+B50: construct A=103%, B=55% at T. Only B is at the 10% band;
          # A must remain untouched when the pending repair executes at T+1.
          idx2 = pd.DatetimeIndex(["2026-02-02", "2026-02-03", "2026-02-04"])
          a_return = 88.79310344827586 / 100.0 - 1.0
          b_return = 47.41379310344828 / 50.0 - 1.0
          ledger2 = simulate_portfolio_ledger(
              PortfolioSpec.from_weights("AB", {"A": 1.0, "B": 0.5}),
              {
                  "A": history(idx2, [0.0, a_return, 0.0]),
                  "B": history(idx2, [0.0, b_return, 0.0]),
              },
              SimulationConfig(initial_amount=100.0),
          )
          repair2 = [e for e in ledger2.events if e.type == "exposure_band_repair"]
          assert len(repair2) == 1
          assert repair2[0].details["breached_symbols"] == ["B"]
          eq2 = float(ledger2.equity.iloc[2])
          # Gross exposure / allocation history reconstructs absolute exposures here.
          gross2 = float(ledger2.gross_exposure.iloc[2])
          mix2 = ledger2.allocation_history.iloc[2]
          a_exp = gross2 * float(mix2["A"]) / eq2
          b_exp = gross2 * float(mix2["B"]) / eq2
          assert abs(a_exp - 1.03) < 1e-9
          assert abs(b_exp - 0.50) < 1e-9

          # 100% unleveraged portfolios are unaffected by exposure maintenance.
          plain = simulate_portfolio_ledger(
              PortfolioSpec.from_weights("Plain", {"A": 1.0}),
              {"A": history(idx, [0.0, 0.125, 0.0])},
              SimulationConfig(initial_amount=100.0),
          )
          assert not [e for e in plain.events if e.type.startswith("exposure_")]
          assert float(plain.debt.max()) == 0.0

          # Daily mode remains explicit constant-exposure behavior and resets at T close.
          daily = simulate_portfolio_ledger(
              PortfolioSpec.from_weights("Daily", {"A": 2.0}),
              {"A": history(idx, [0.0, 0.125, 0.0])},
              SimulationConfig(
                  initial_amount=100.0,
                  exposure_maintenance=ExposureMaintenanceConfig(
                      mode=ExposureMaintenanceMode.DAILY,
                      tolerance_percent=10.0,
                  ),
              ),
          )
          assert abs(daily.gross_exposure_ratio.iloc[1] - 2.0) < 1e-10
          reset = [e for e in daily.events if e.type == "exposure_reset"]
          assert reset and reset[0].date == "2026-01-05"

          # Borrowing interest capitalizes into debt, so subsequent interest accrues on it.
          idx3 = pd.DatetimeIndex(["2026-03-02", "2026-03-03", "2026-03-04"])
          interest_ledger = simulate_portfolio_ledger(
              PortfolioSpec.from_weights("Interest", {"A": 2.0}),
              {"A": history(idx3, [0.0, 0.0, 0.0])},
              SimulationConfig(
                  initial_amount=100.0,
                  leverage=LeverageConfig(annual_interest_rate_percent=10.0),
                  exposure_maintenance=ExposureMaintenanceConfig(
                      mode=ExposureMaintenanceMode.NONE,
                      tolerance_percent=10.0,
                  ),
              ),
          )
          r = 0.10 / 365.2425
          expected_debt = 100.0 * (1.0 + r) ** 2
          assert abs(float(interest_ledger.debt.iloc[-1]) - expected_debt) < 1e-9
          events = [e for e in interest_ledger.events if e.type == "borrowing_interest"]
          assert len(events) == 2 and "debt_after_interest" in events[-1].details

          print("margin-band quantitative invariants: OK")
          PY
