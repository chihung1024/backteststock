name: Fix scan output browser contract

on:
  push:
    branches: [fix/scan-output-and-performance]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/scan-output-and-performance
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fix Chinese note delimiter and preserve DOM text contract
        run: |
          python <<'PY'
          from pathlib import Path

          output_path = Path("public/scan-output-ui.js")
          output = output_path.read_text(encoding="utf-8")
          old_regex = '.split(/；?\\s*再現資訊\\b/u)[0]'
          new_regex = '.split(/；?\\s*再現資訊/u)[0]'
          if output.count(old_regex) != 1:
              raise SystemExit(f"output note regex count={output.count(old_regex)}")
          output = output.replace(old_regex, new_regex, 1)
          old_symbol = '    symbol.textContent = ticker;'
          new_symbol = '    symbol.textContent = `${ticker} `;'
          if output.count(old_symbol) != 1:
              raise SystemExit(f"symbol text count={output.count(old_symbol)}")
          output = output.replace(old_symbol, new_symbol, 1)
          old_detail = '      detail.textContent = `\\n${note}`;'
          new_detail = '      detail.textContent = `（${note}）`;'
          if output.count(old_detail) != 1:
              raise SystemExit(f"detail text count={output.count(old_detail)}")
          output = output.replace(old_detail, new_detail, 1)
          output_path.write_text(output, encoding="utf-8")

          app_path = Path("public/app.js")
          app = app_path.read_text(encoding="utf-8")
          if app.count(old_regex) != 1:
              raise SystemExit(f"app note regex count={app.count(old_regex)}")
          app_path.write_text(app.replace(old_regex, new_regex, 1), encoding="utf-8")

          package_path = Path("package.json")
          package = package_path.read_text(encoding="utf-8")
          old_check = "node --check public/app.js && node --check public/scan-score-formulas.js"
          new_check = "node --check public/app.js && node --check public/scan-output-ui.js && node --check public/scan-score-formulas.js"
          if package.count(old_check) != 1:
              raise SystemExit("package check script anchor mismatch")
          package_path.write_text(package.replace(old_check, new_check, 1), encoding="utf-8")

          Path(".github/workflows/fix-scan-output-browser-contract.yml").unlink()
          PY
      - name: Commit browser contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix readable note parsing and browser output contract"
          git push origin HEAD:fix/scan-output-and-performance
