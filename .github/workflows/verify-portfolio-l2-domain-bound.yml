name: Verify Portfolio L2 Domain Bound

on:
  push:
    branches:
      - feat/portfolio-weight-defined-exposure
    paths:
      - .github/workflows/verify-portfolio-l2-domain-bound.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Derive public upper bound from Portfolio domain authority
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('apps/api/app/portfolio/api_models.py')
          text = path.read_text()

          import_anchor = '    LeverageType,\n    PortfolioSpec,\n'
          if text.count(import_anchor) != 1:
              raise SystemExit('expected Portfolio domain import anchor exactly once')
          text = text.replace(
              import_anchor,
              '    LeverageType,\n    MAX_TARGET_GROSS_EXPOSURE,\n    PortfolioSpec,\n',
              1,
          )

          weight_field = '    weight: float = Field(gt=0.0, le=500.0)'
          if text.count(weight_field) != 1:
              raise SystemExit('expected hard-coded public weight bound exactly once')
          text = text.replace(
              weight_field,
              '    weight: float = Field(\n'
              '        gt=0.0, le=MAX_TARGET_GROSS_EXPOSURE * 100.0\n'
              '    )',
              1,
          )

          old_total = '''        total = sum(asset.weight for asset in self.assets)
          if total > 500.0:
              raise ValueError(
                  "portfolio target gross exposure cannot exceed 500%, "
                  f"received {total:.4f}%"
              )
          '''.replace('          ', '')
          new_total = '''        total = sum(asset.weight for asset in self.assets)
          max_total = (MAX_TARGET_GROSS_EXPOSURE + WEIGHT_TOLERANCE) * 100.0
          if total > max_total:
              raise ValueError(
                  "portfolio target gross exposure cannot exceed "
                  f"{MAX_TARGET_GROSS_EXPOSURE * 100.0:g}%, received {total:.4f}%"
              )
          '''.replace('          ', '')
          if text.count(old_total) != 1:
              raise SystemExit('expected hard-coded total bound exactly once')
          path.write_text(text.replace(old_total, new_total, 1))
          PY

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run L2 targeted and full Python regression
        run: |
          set -euo pipefail
          python -m compileall -q api apps scripts tests
          ruff check api apps scripts tests
          pytest -q tests/test_portfolio_api_models.py tests/test_portfolio_api_service.py tests/test_portfolio_v3_api.py
          python -m pytest -q

      - name: Commit only verified domain-bound repair
        run: |
          set -euo pipefail
          rm .github/workflows/verify-portfolio-l2-domain-bound.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/api/app/portfolio/api_models.py .github/workflows/verify-portfolio-l2-domain-bound.yml
          git diff --cached --check
          git commit -m "fix: derive Portfolio API exposure bound from domain"
          git push origin HEAD:feat/portfolio-weight-defined-exposure
